[package]
name = "lmm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
default-run = "lmm-core"
autobins = false
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "lmm-core"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = "=0.5.3"
base64 = "=0.22.1"
bcrypt = "=0.17.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
jsonwebtoken = { version = "=9.3.1", default-features = false }
# Required S256 primitive, upstream MIT OR Apache-2.0; durable grants are Core-owned.
oxide-auth = { git = "https://github.com/197g/oxide-auth", rev = "0e3ef86d924aa5546dc3275d1d7269ea63edfaf1" }
axum = "=0.8.9"
http-body = "=1.1.0"
ipnet = "=2.12.2"
rand = "=0.8.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "macros"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
fs2 = "=0.4.3"
prost = "=0.14.4"
subtle = "=2.6.1"
totp-rs = { version = "=6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[build-dependencies]
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
# SQLx uses this feature to create isolated test databases, not to upgrade them.
sqlx = { version = "=0.8.6", default-features = false, features = ["migrate"] }
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "protocol-events-fixture"
path = "src/events/fixture.rs"
