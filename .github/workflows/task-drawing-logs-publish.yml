name: Publish reviewed log source

on:
  push:
    branches: [fix/task-drawing-logs-20261010]
    paths: [.github/workflows/task-drawing-logs-publish.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.ref == 'refs/heads/fix/task-drawing-logs-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply only the reviewed application source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 4049d88c032d0e37d5783e546d55d21cdb68a473
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          source = pathlib.Path('.github/workflows/task-drawing-logs-apply.yml').read_text()
          encoded = source.split("encoded = '''", 1)[1].split("'''", 1)[0]
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6be02151de3441b2b440cf3308822e03c2fce2ca1fd08fa80f1747382c58df53'
          targets = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          targets = [p for p in targets if p.startswith('apps/')]
          assert len(targets) == 19 and len(set(targets)) == 19
          assert all('..' not in pathlib.PurePosixPath(p).parts for p in targets)
          patch_file = pathlib.Path('/tmp/task-drawing-logs.patch')
          patch_file.write_bytes(patch)
          exclusion = '--exclude=.github/workflows/task-drawing-logs-review.yml'
          subprocess.run(['git', 'apply', exclusion, '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', exclusion, str(patch_file)], check=True)
          utils = pathlib.Path('apps/web/src/features/usage-logs/lib/utils.ts')
          text = utils.read_text()
          for name in ['GetMidjourneyLogsParams', 'GetTaskLogsParams']:
              assertion = ' as ' + name
              assert text.count(assertion) == 2
              text = text.replace(assertion, '')
          utils.write_text(text)
          pathlib.Path('/tmp/log-update-targets.json').write_text(json.dumps(targets))
          PY
      - name: Install the locked formatter without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Format the changed web files
        shell: bash
        run: |
          export PATH="$PWD/apps/web/node_modules/.bin:$PWD/node_modules/.bin:$PATH"
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          web = root / 'apps/web'
          paths = [root / p for p in json.loads(pathlib.Path('/tmp/log-update-targets.json').read_text()) if p.endswith(('.ts', '.tsx'))]
          headers = {}
          try:
              for path in paths:
                  source = path.read_text()
                  match = re.match(r'(/\*.*?\*/\n)', source, re.S)
                  if match and 'QuantumNous' in match[0]:
                      headers[path] = match[0]
                      path.write_text(source[len(match[0]):])
              subprocess.run(['oxfmt', '-c', '.oxfmtrc.json', '--write', *[str(p.relative_to(web)) for p in paths]], cwd=web, check=True)
          finally:
              for path, header in headers.items():
                  path.write_text(header + path.read_text())
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Commit source only to the feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/task-drawing-logs-20261010
          python3 - <<'PY'
          import json, pathlib, subprocess
          targets = json.loads(pathlib.Path('/tmp/log-update-targets.json').read_text())
          subprocess.run(['git', 'add', '--', *targets], check=True)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == set(targets), actual
          assert all(p.startswith('apps/') for p in actual), actual
          assert not subprocess.check_output(['git', 'diff', '--', '.github/workflows'], text=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore task and drawing log filters, refresh and results'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/task-drawing-logs-20261010
          git rev-parse HEAD
