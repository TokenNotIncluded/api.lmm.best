name: HumanGrant verified source integration
on:
  push:
    branches: [feat/humangrant-main-20261012]
    paths: [.github/workflows/humangrant-transfer.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: "2"
    steps:
      - name: Checkout task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Verify sealed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .human-grant-transfer/part{0..5} | base64 --decode > "$RUNNER_TEMP/humangrant-payload.tar.xz"
          echo "4fdf5ca30509dd0cea79ea4adbab0059e3ca5fb9ba5ab4f75efe90e540087ad9  $RUNNER_TEMP/humangrant-payload.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/humangrant-source"
          tar -xJf "$RUNNER_TEMP/humangrant-payload.tar.xz" -C "$RUNNER_TEMP/humangrant-source"
      - name: Apply audited HumanGrant source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/humangrant-source/apply.py" "$GITHUB_WORKSPACE" --check
          python3 "$RUNNER_TEMP/humangrant-source/apply.py" "$GITHUB_WORKSPACE"
          git diff --check
      - name: Commit application source and remove temporary transfer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .human-grant-transfer
          git rm .github/workflows/humangrant-transfer.yml
          git add apps/api-go apps/web/src/features/auth apps/web/src/features/system-settings/auth apps/web/src/i18n/locales docs/humangrant.md examples/humangrant-agent.mjs packaging/common/lmm-api/edge-policy/nginx scripts/render-frontend-proxy-overlay.py
          git diff --cached --check
          git commit -m 'feat(auth): integrate HumanGrant scoped AI authorization'
          git push origin HEAD:feat/humangrant-main-20261012
          git rev-parse HEAD
      - name: Verify Go authentication integration
        working-directory: apps/api-go
        run: |
          go test -p 2 ./humangrant ./middleware ./router ./service -count=1
          go vet ./humangrant ./middleware ./router ./service
      - name: Verify HumanGrant browser protocol
        run: |
          node --test apps/api-go/humangrant/web/client.test.mjs
          node --check apps/api-go/humangrant/web/ui.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Verify web typecheck and production build
        run: |
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web build
