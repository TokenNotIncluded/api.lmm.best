name: Verify recovered L0 and bounty fix
on:
  push:
    branches: [verify/l0-airy-recovery-20260922]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Restore the existing patch and verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/l0-airy-recovery-20260922
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          # Repair one missing transport character; reject any other byte change.
          text=base64.b64encode(pathlib.Path('.github/l0-recovery.bin').read_bytes()).decode().rstrip('=')
          raw=base64.b64decode(text[:174]+'P'+text[174:])
          assert hashlib.sha256(raw).hexdigest() == 'cf0c6f117595ba5dab4fd0fe5b226de17225cc5692bf50bf130828ed8d802c3d'
          data=json.loads(gzip.decompress(raw))
          assert data['base']=='f7a3c7a4c59d63dec9c3bb3a43e55775759581c1'
          exclude='apps/web/src/features/open-source-bounties/bounty-progress.tsx'
          files=[f for f in data['files'] if f['path']!=exclude]
          assert len(files)==11
          for f in files:
              p=pathlib.Path(f['path'])
              assert p.parts[:4]==('apps','web','src','features') and '..' not in p.parts
              actual=subprocess.check_output(['git','hash-object',str(p)],text=True).strip() if p.exists() else None
              assert actual==f['before'],(str(p),actual,f['before'])
          subprocess.run(['git','apply','--exclude='+exclude],input=data['patch'],text=True,check=True)
          for f in files:
              actual=subprocess.check_output(['git','hash-object',f['path']],text=True).strip()
              assert actual==f['sha'],(f['path'],actual,f['sha'])
          pathlib.Path('/tmp/l0-recovered-files.json').write_text(json.dumps(files))
          print('Recovered 11 files; all exact hashes verified. Retained the main-branch timeline locale fix.')
          PY
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Formatting, copyright, lint and types
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: All Web regression tests
        run: bun run --filter @lmm/web test
      - name: Production build and initial bundle budget
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
      - name: Save only the verified source on this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/l0-airy-recovery-20260922
          python3 - <<'PY'
          import json,pathlib,subprocess
          files=json.loads(pathlib.Path('/tmp/l0-recovered-files.json').read_text())
          for f in files:
              actual=subprocess.check_output(['git','hash-object',f['path']],text=True).strip()
              assert actual==f['sha']
          subprocess.run(['git','add','--',*[f['path'] for f in files]],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): restore verified airy cloud and bounty locale patch'
          git push origin HEAD:refs/heads/verify/l0-airy-recovery-20260922
          git log -1 --format=%H
