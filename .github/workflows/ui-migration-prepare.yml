name: UI migration preparation

on:
  pull_request:
    paths:
      - '.github/workflows/ui-migration-prepare.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install original locked workspace
        run: bun install --frozen-lockfile
      - name: Resolve migration dependencies in the disposable checkout
        working-directory: apps/web
        run: |
          bun add --exact @base-ui/react@1.8.0
          bun remove vaul input-otp
      - name: Capture review inputs without credentials or font binaries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-prepare/registry" apps/web/node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/ui-prepare/revision.txt"
          git diff -- bun.lock apps/web/package.json > "$RUNNER_TEMP/ui-prepare/dependencies.patch"
          cp "$(command -v bun)" "$RUNNER_TEMP/ui-prepare/bun"
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' --exclude='*.map' --exclude='node_modules' -czf "$RUNNER_TEMP/ui-prepare/source.tar.gz" apps/web package.json bun.lock
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' --exclude='*.map' -czf "$RUNNER_TEMP/ui-prepare/dependencies.tar.gz" node_modules apps/web/node_modules
          for component in button input textarea card dialog sheet drawer input-otp select popover dropdown-menu tabs checkbox radio-group switch tooltip badge; do
            curl --fail --silent --show-error --max-time 20 "https://ui.shadcn.com/r/styles/base-luma/$component.json" -o "$RUNNER_TEMP/ui-prepare/registry/$component.json" || printf '%s registry unavailable\n' "$component" >> "$RUNNER_TEMP/ui-prepare/registry/errors.txt"
          done
          curl --fail --silent --show-error --max-time 20 https://raw.githubusercontent.com/shadcn-ui/ui/main/apps/v4/registry/styles/style-luma.css -o "$RUNNER_TEMP/ui-prepare/registry/style-luma.css"
      - name: Upload disposable review workspace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-migration-workspace
          path: ${{ runner.temp }}/ui-prepare
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
