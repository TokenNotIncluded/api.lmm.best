name: UI migration preparation

on:
  pull_request:
    paths:
      - '.github/ui-migration/**'
      - '.github/workflows/ui-migration-prepare.yml'

permissions:
  contents: read

concurrency:
  group: materialize-luma-469
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'TokenNotIncluded/api.lmm.best' &&
      github.event.pull_request.number == 469 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/ui-luma-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_TYPESCRIPT: ${{ runner.temp }}/ui-tools/node_modules/typescript
      UI_LUMA_CSS: ${{ runner.temp }}/style-luma.css
      UI_LUMA_DRAWER: ${{ runner.temp }}/drawer.json
      UI_LUMA_AUDIT: ${{ runner.temp }}/ui-audit.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install isolated migration tooling
        shell: bash
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-package-lock --ignore-scripts typescript@5.8.3
          curl --fail --silent --show-error --max-time 30 https://api.github.com/repos/shadcn-ui/ui/git/blobs/739e8f9260ef9e82f31bb42f5d579df13ada2787 -o "$RUNNER_TEMP/luma-blob.json"
          python3 -c 'import json,base64,os,pathlib,hashlib; b=base64.b64decode(json.load(open(os.environ["RUNNER_TEMP"]+"/luma-blob.json"))["content"]); assert hashlib.sha256(b).hexdigest()=="a698210162ca2d3385142a47334f22985831b1e91716c2d3175828d928a59707"; pathlib.Path(os.environ["UI_LUMA_CSS"]).write_bytes(b)'
          curl --fail --silent --show-error --max-time 30 https://ui.shadcn.com/r/styles/base-luma/drawer.json -o "$UI_LUMA_DRAWER"
      - name: Materialize component sources and locked dependencies
        shell: bash
        run: |
          (cd apps/web && bun add --exact @base-ui/react@1.8.0 && bun remove vaul input-otp)
          node .github/ui-migration/styles.cjs
          python3 .github/ui-migration/adapt.py
          node .github/ui-migration/dedupe.cjs
          bun run --filter @lmm/web format
          bun run --filter @lmm/web typecheck
          (cd apps/web && bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/components/ui/ui-foundation.test.tsx)
      - name: Remove one-shot tooling and commit only the migration branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf .github/ui-migration
          rm .github/workflows/ui-migration-prepare.yml
          git add -- apps/web bun.lock .github/ui-migration .github/workflows/ui-migration-prepare.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(web): materialize reviewed Luma foundation and Base UI 1.8 migration'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          current=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/ui-luma-foundation | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/ui-luma-foundation
      - name: Retain reproducible migration evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-materialization"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-materialization/revision.txt"
          git diff > "$RUNNER_TEMP/ui-materialization/uncommitted.patch"
          tar --exclude=node_modules --exclude=dist --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf "$RUNNER_TEMP/ui-materialization/source.tar.gz" apps/web package.json bun.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-materialization
          path: ${{ runner.temp }}/ui-materialization
          retention-days: 1
          if-no-files-found: warn
