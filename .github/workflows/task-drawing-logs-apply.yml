name: Apply and verify task log update

on:
  push:
    branches: [fix/task-drawing-logs-20261010]
    paths: [.github/workflows/task-drawing-logs-apply.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/task-drawing-logs-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Verify and apply the exact reviewed patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 2c01aba6f790b2316392719a588c7d59e1a70a3b
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          encoded = '''
          
          
          
          
          '''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6be02151de3441b2b440cf3308822e03c2fce2ca1fd08fa80f1747382c58df53'
          targets = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(targets) == 20 and len(set(targets)) == 20
          assert all(not p.startswith('/') and '..' not in pathlib.PurePosixPath(p).parts for p in targets)
          patch_file = pathlib.Path('/tmp/task-drawing-logs.patch')
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          pathlib.Path('/tmp/log-update-targets.json').write_text(json.dumps(targets))
          PY
      - name: Install locked formatter dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Format only the reviewed web files and preserve license headers
        shell: bash
        run: |
          export PATH="$PWD/apps/web/node_modules/.bin:$PWD/node_modules/.bin:$PATH"
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          web = root / 'apps/web'
          paths = [root / p for p in json.loads(pathlib.Path('/tmp/log-update-targets.json').read_text()) if p.endswith(('.ts', '.tsx'))]
          headers = {}
          try:
              for path in paths:
                  source = path.read_text()
                  match = re.match(r'(/\*.*?\*/\n)', source, re.S)
                  if match and 'QuantumNous' in match[0]:
                      headers[path] = match[0]
                      path.write_text(source[len(match[0]):])
              subprocess.run(['oxfmt', '-c', '.oxfmtrc.json', '--write', *[str(p.relative_to(web)) for p in paths]], cwd=web, check=True)
          finally:
              for path, header in headers.items():
                  path.write_text(header + path.read_text())
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Commit to this feature branch only and remove the one-time writer
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/task-drawing-logs-20261010
          python3 - <<'PY'
          import json, pathlib, subprocess
          targets = json.loads(pathlib.Path('/tmp/log-update-targets.json').read_text())
          writer = '.github/workflows/task-drawing-logs-apply.yml'
          pathlib.Path(writer).unlink()
          subprocess.run(['git', 'add', '--', *targets, writer], check=True)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual <= set(targets + [writer]), actual
          assert len(actual) == 21, actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: revive task and drawing logs with filters, refresh and results'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/task-drawing-logs-20261010
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - name: Capture the exact source tested
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs-source"
          git rev-parse HEAD > "$RUNNER_TEMP/logs-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/logs-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-drawing-logs-tested-source
          path: ${{ runner.temp }}/logs-source
          retention-days: 3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Typecheck the full application
        working-directory: apps/web
        run: bun run typecheck
      - name: Run log tests in isolated processes
        if: ${{ !cancelled() }}
        working-directory: apps/web
        shell: bash
        run: |
          failed=0
          while IFS= read -r test_file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test_file" || failed=1
          done < <(find src/features/usage-logs -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          exit "$failed"
      - name: Build the frontend without deployment
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: bun run build

  go:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Test drawing queries and user isolation
        working-directory: apps/api-go
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: go test -p 2 ./model -run '^TestMidjourneyLogFilters$' -count=1 -v
