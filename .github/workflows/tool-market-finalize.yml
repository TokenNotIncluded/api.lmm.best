name: Finalize reviewed marketplace source
on:
  push:
    branches: [feat/tool-market-provider-presets]
    paths: [.github/workflows/tool-market-finalize.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/feat/tool-market-provider-presets'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply exact reviewed patch and remove transfer scaffolding
        run: |
          set -euo pipefail
          echo 'd4f4b3b44b4644d7e760385cdb9646cbe06ed0ca1d2162d86d3859e23e1da640  .github/market-finalize.patch' | sha256sum -c -
          git apply --check .github/market-finalize.patch
          git apply --index .github/market-finalize.patch
          git rm .github/market-finalize.patch .github/workflows/tool-market-finalize.yml
          bun install --frozen-lockfile
          bun x --no-install prettier --write apps/web/src/features/tool-market/provider-i18n.ts apps/web/src/features/tool-market/provider-i18n.test.ts apps/web/src/features/tool-market/provider-preset-fields.tsx apps/web/src/features/tool-market/oauth-connection.tsx apps/web/src/features/tool-market/service-editor.tsx apps/web/src/features/tool-market/connections.tsx apps/web/src/features/tool-market/index.tsx apps/web/src/features/tool-market/service-editor-utils.interaction.test.tsx apps/web/src/features/debug/console-page-fixtures.ts apps/web/scripts/tool-market-provider-review.mjs
          git add apps docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tool-market): recover provider runs and enforce reviewed provider boundaries'
      - name: Integrate inspected main revision without replacing other changes
        run: |
          set -euo pipefail
          base=5d7fab5d432025d59d69490501f2a1d57e47fb1c
          if ! git merge --no-ff --no-commit "$base"; then
            test -f .git/MERGE_HEAD
            conflicts=$(git diff --name-only --diff-filter=U)
            test "$conflicts" = apps/web/src/i18n/locales/zh.json
          fi
          # Provider copy moved into its own namespace; retain main's locale and attribution exactly.
          git checkout "$base" -- apps/web/src/i18n/locales/zh.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'merge: retain current native OAuth routes and global translations'
          git push origin HEAD:refs/heads/feat/tool-market-provider-presets
          mkdir -p "$RUNNER_TEMP/market-source"
          git rev-parse HEAD > "$RUNNER_TEMP/market-source/commit.txt"
          git show -s --format=%T HEAD > "$RUNNER_TEMP/market-source/tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/market-source/source.tar.gz"
      - name: Record diagnostic diff
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/market-source"
          git status --short > "$RUNNER_TEMP/market-source/status.txt"
          git diff > "$RUNNER_TEMP/market-source/worktree.diff"
          git diff --cached > "$RUNNER_TEMP/market-source/index.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-final-source
          path: ${{ runner.temp }}/market-source
          retention-days: 7
