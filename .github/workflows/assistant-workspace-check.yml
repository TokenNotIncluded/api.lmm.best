name: Assistant isolated validation
on:
  push:
    branches: [work/assistant-chain-20260922]
    paths: [.github/workflows/assistant-workspace-check.yml]
permissions:
  contents: read
env:
  ASSISTANT_BASE: f7a3c7a4c59d63dec9c3bb3a43e55775759581c1
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          payload = ''.join(pathlib.Path(f'.assistant-patch-{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5cfb2070ed5540d9de46e92e5e696bcf51d8e79fe5de42f65f8de8e6e486212a'
          pathlib.Path('/tmp/assistant.patch').write_bytes(patch)
          PY
          git switch --detach "$ASSISTANT_BASE"
          git apply --unidiff-zero --check /tmp/assistant.patch
          git apply --unidiff-zero /tmp/assistant.patch
          git add -- apps/web/src
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = ('apps/web/src/features/assistant/', 'apps/web/src/features/onboarding/', 'apps/web/src/features/system-settings/', 'apps/web/src/i18n/locales/')
          assert len(files) == 22, files
          assert all(p.startswith(allowed) for p in files), files
          print('\n'.join(files))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Locked dependencies and web checks
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: Assistant and onboarding regressions
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          paths = []
          for folder in ('src/features/onboarding', 'src/features/assistant'):
              paths.extend(pathlib.Path(folder).glob('*.test.ts'))
              paths.extend(pathlib.Path(folder).glob('*.test.tsx'))
          paths.extend([pathlib.Path('src/features/system-settings/content/assistant-settings-section.test.tsx'), pathlib.Path('src/features/system-settings/content/assistant-settings-workspace.test.ts')])
          for path in sorted(set(paths)):
              print(f'\nTesting {path}', flush=True)
              subprocess.run(['bun', 'test', '--preload', './scripts/test-preload.mjs', '--timeout', '15000', str(path)], check=True)
          PY
      - name: Production build and verified commit
        shell: bash
        run: |
          set -euo pipefail
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
          git diff --exit-code
          git -c user.name=LIghtJUNction -c user.email=lightjunction.me@gmail.com commit -m "feat(web): assistant history, streaming recovery and settings workspace"
          mkdir -p /tmp/assistant-verified
          git rev-parse HEAD > /tmp/assistant-verified/COMMIT
          git bundle create /tmp/assistant-verified/assistant.bundle HEAD ^"$ASSISTANT_BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-verified-source
          path: /tmp/assistant-verified/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: f7a3c7a4c59d63dec9c3bb3a43e55775759581c1
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: assistant-verified-source
          path: /tmp/assistant-verified
      - name: Publish only the verified source branch
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify /tmp/assistant-verified/assistant.bundle
          git fetch /tmp/assistant-verified/assistant.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/assistant-verified/COMMIT)"
          test "$(git rev-parse FETCH_HEAD^)" = "$ASSISTANT_BASE"
          python3 - <<'PY'
          import os, subprocess
          files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['ASSISTANT_BASE'], 'FETCH_HEAD'], text=True).splitlines()
          allowed = ('apps/web/src/features/assistant/', 'apps/web/src/features/onboarding/', 'apps/web/src/features/system-settings/', 'apps/web/src/i18n/locales/')
          assert len(files) == 22 and all(p.startswith(allowed) for p in files), files
          print('\n'.join(files))
          PY
          git push origin FETCH_HEAD:refs/heads/feat/assistant-chain-20260922
          echo "Published $(git rev-parse FETCH_HEAD)"
