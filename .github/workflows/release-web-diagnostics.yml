name: Release web diagnostics
on:
  push:
    branches: [release/acceptance-20260916]
    paths: [.github/workflows/release-web-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 9e48a9e7795283631fac1f0c6ba06bc40f1508d1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Collect every test result without stopping at the first failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-diagnostics
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('apps/web').resolve()
          rows = []
          files = sorted([*root.glob('src/**/*.test.ts'), *root.glob('src/**/*.test.tsx'), *root.glob('scripts/*.test.mjs')])
          for path in files:
              name = str(path.relative_to(root))
              args = ['node', '--test', name] if path.suffix == '.mjs' else ['bun', 'test', '--preload', str(root/'scripts/test-preload.mjs'), '--timeout', '15000', name]
              try:
                  result = subprocess.run(args, cwd=root, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=150)
                  code, output = result.returncode, result.stdout
              except subprocess.TimeoutExpired as exc:
                  code, output = 124, str(exc)
              rows.append({'file':name,'exit_code':code})
              if code:
                  pathlib.Path('/tmp/release-diagnostics/'+name.replace('/','_')+'.log').write_text(output)
                  print('FAIL', name, code, flush=True)
          pathlib.Path('/tmp/release-diagnostics/tests.json').write_text(json.dumps(rows, indent=2))
          failures = [row for row in rows if row['exit_code']]
          print(json.dumps({'total_files':len(rows),'failed_files':failures}))
          pathlib.Path('/tmp/release-diagnostics/failed').write_text(str(len(failures)))
          PY
      - name: Extract previous deployment failure context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, pathlib, re, subprocess, zipfile
          repo = os.environ['REPO']
          path = f'repos/{repo}/actions/runs/34876833368/attempts/1/logs'
          result = subprocess.run(['gh','api',path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode:
              pathlib.Path('/tmp/release-diagnostics/deploy-download-error.txt').write_text(result.stderr.decode(errors='replace'))
          else:
              archive=zipfile.ZipFile(io.BytesIO(result.stdout))
              pattern=re.compile(r'error|failed|failure|AWAITING|rollback|pending|unsafe|stage|promot',re.I)
              with open('/tmp/release-diagnostics/deploy-attempt1-context.txt','w') as out:
                  for name in archive.namelist():
                      if name.endswith('.txt'):
                          lines=archive.read(name).decode(errors='replace').splitlines()
                          indices=set()
                          for i,line in enumerate(lines):
                              if pattern.search(line): indices.update(range(max(0,i-2),min(len(lines),i+4)))
                          out.write('\n=== '+name+' ===\n')
                          out.write('\n'.join(lines[i] for i in sorted(indices)))
          PY
      - name: Export executable and installed dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          cp "$(command -v bun)" /tmp/release-diagnostics/bun
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/release-diagnostics/node_modules.tar.gz
          sha256sum /tmp/release-diagnostics/bun /tmp/release-diagnostics/node_modules.tar.gz > /tmp/release-diagnostics/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-diagnostics-${{ github.run_id }}
          path: /tmp/release-diagnostics/
          retention-days: 1
          if-no-files-found: error
      - name: Preserve failing test status
        run: test "$(cat /tmp/release-diagnostics/failed)" = 0
