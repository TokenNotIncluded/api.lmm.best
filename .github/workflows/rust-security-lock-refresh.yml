name: Rust security lock refresh

on:
  push:
    branches:
      - codex/rust-rustsec-audit
    paths:
      - '.github/workflows/rust-security-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect reverse dependencies and update patched leaves
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api-rust
          echo '=== reverse dependency: rkyv ==='
          cargo tree --locked -i rkyv || true
          echo '=== reverse dependency: chacha20 0.10.1 ==='
          cargo tree --locked -i chacha20@0.10.1 || true
          echo '=== reverse dependency: rsa ==='
          cargo tree --locked -i rsa || true
          echo '=== reverse dependency: rustls 0.23.43 ==='
          cargo tree --locked -i rustls@0.23.43 || true
          cargo update -p rustls@0.23.43 --precise 0.23.45
          if ! cargo update -p chacha20@0.10.1 --precise 0.10.2; then
            echo 'chacha20 0.10.1 cannot be updated independently; parent remediation remains required' >&2
          fi

      - name: Commit reproducible lockfile refresh and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rust-security-lock-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api-rust/Cargo.lock .github/workflows/rust-security-lock-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rust): update patched security dependencies'
          git push origin HEAD:codex/rust-rustsec-audit
