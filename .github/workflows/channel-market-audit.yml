name: Channel marketplace audit

on:
  push:
    branches: [fix/channel-market-audit]
    paths: [.github/workflows/channel-market-audit.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/channel-market-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply bounded verification fixes
        run: |
          git apply --check .github/market-audit/followup.patch
          git apply .github/market-audit/followup.patch
      - name: Regenerate assistant request contracts
        working-directory: apps/api-go
        run: go generate ./controller
      - run: bun install --frozen-lockfile
      - name: Format changed frontend files only
        working-directory: apps/web
        run: bunx oxfmt --write src/features/public-relay/access.test.tsx src/features/channels/components/drawers/channel-mutate-drawer.tsx
      - name: Commit fixes to the isolated branch
        id: commit
        run: |
          git diff --check
          git add apps/api-go/model/channel_creation.go apps/api-go/model/public_relay_publication_test.go apps/api-go/controller/assistant_admin_operation_contracts.json apps/web/src/features/public-relay/access.test.tsx apps/web/src/features/channels/components/drawers/channel-mutate-drawer.tsx docs/channel-marketplace.md
          git rm .github/market-audit/followup.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete channel market verification and recovery guidance'
          git push origin HEAD:refs/heads/fix/channel-market-audit
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/channel-market-tested-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: channel-market-tested-source
          path: ${{ runner.temp }}/channel-market-tested-source.tar.gz
          retention-days: 1
  go:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Full model controller service and middleware tests
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller ./service ./middleware -count=1 -json | tee "$RUNNER_TEMP/channel-market-go.jsonl"
      - name: Go formatting
        if: success() || failure()
        run: test -z "$(gofmt -l apps/api-go/model/channel_creation.go apps/api-go/model/public_relay*.go apps/api-go/model/wallet_future_credit_basis_test.go apps/api-go/controller/channel.go apps/api-go/controller/public_relay*.go)"
      - name: Build Go service
        if: success() || failure()
        working-directory: apps/api-go
        run: go build -o "$RUNNER_TEMP/api-go" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: channel-market-go-results
          path: ${{ runner.temp }}/channel-market-go.jsonl
          retention-days: 1
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Channel marketplace UI regressions
        working-directory: apps/web
        run: |
          for test in src/features/public-relay/*.test.*; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" || exit 1
          done
      - name: Lint channel marketplace and shared drawer
        if: success() || failure()
        working-directory: apps/web
        run: bunx oxlint -c .oxlintrc.json src/features/public-relay src/features/channels/components/drawers/channel-mutate-drawer.tsx
      - name: Typecheck web
        if: success() || failure()
        run: bun run --filter @lmm/web typecheck
      - name: Production frontend build
        if: success() || failure()
        run: bun run --filter @lmm/web build
