name: Channel marketplace audit

on:
  push:
    branches: [fix/channel-market-audit]
    paths:
      - .github/workflows/channel-market-audit.yml
      - apps/api-go/**
      - apps/web/src/features/public-relay/**

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Channel market regression tests
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller ./service ./middleware -run 'PublicRelay|Channel.*Select|Channel.*Auth' -count=1 -v
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Channel market browser regressions
        working-directory: apps/web
        run: |
          for test in src/features/public-relay/*.test.*; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" || exit 1
          done
      - name: Typecheck web
        run: bun run --filter @lmm/web typecheck
