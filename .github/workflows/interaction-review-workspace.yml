name: Interaction review workspace

on:
  push:
    branches: [fix/remaining-interactions-759-762]
    paths: [.github/workflows/interaction-review-workspace.yml]

permissions:
  contents: read

jobs:
  go-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Download locked Go dependencies without production configuration
        working-directory: apps/api-go
        run: go mod download
      - name: Package only compiler and downloaded modules
        shell: bash
        run: |
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/interaction-goroot.tar.gz" .
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/interaction-gomodcache.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-goroot
          path: ${{ runner.temp }}/interaction-goroot.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-gomodcache
          path: ${{ runner.temp }}/interaction-gomodcache.tar.gz
          retention-days: 3
