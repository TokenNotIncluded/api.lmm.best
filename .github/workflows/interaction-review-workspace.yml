name: Interaction review workspace

on:
  push:
    branches: [fix/remaining-interactions-759-762]
    paths: [.github/workflows/interaction-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Archive the exact source revision without Git credentials
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/interaction-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-source
          path: ${{ runner.temp }}/interaction-source.tar.gz
          retention-days: 3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies in the isolated runner
        run: bun install --frozen-lockfile
      - name: Archive only dependencies and the test runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/interaction-runtime/bin"
          cp "$(command -v bun)" "$RUNNER_TEMP/interaction-runtime/bin/bun"
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/interaction-dependencies.tar.gz"
          tar -C "$RUNNER_TEMP/interaction-runtime" -czf "$RUNNER_TEMP/interaction-runtime.tar.gz" bin
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-runtime
          path: |
            ${{ runner.temp }}/interaction-dependencies.tar.gz
            ${{ runner.temp }}/interaction-runtime.tar.gz
          retention-days: 3
