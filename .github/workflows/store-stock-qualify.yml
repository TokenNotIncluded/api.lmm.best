name: Stock merge qualification
on:
  push:
    branches: [review/store-stock-finish-20261010]
    paths: [.github/workflows/store-stock-qualify.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      STOCK_FINAL_OUTPUT: ${{ runner.temp }}/stock-qualified
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Preserve main changes and prepare the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-stock-candidate.mjs
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Static and formatting checks
        working-directory: apps/web
        run: |
          bun run lint > "$STOCK_FINAL_OUTPUT/lint.log" 2>&1
          bun run typecheck > "$STOCK_FINAL_OUTPUT/typecheck.log" 2>&1
          PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" oxfmt --check scripts/store-stock-review.mjs scripts/store-stock-copy.mjs src/features/store/seller-page.tsx src/features/store/stock-status.ts src/features/store/stock-status.test.ts src/features/store/catalogue-tags.tsx src/features/usage-logs/lib/async-task-logs.ts src/features/usage-logs/lib/__tests__/safe-media-url-controls.test.ts > "$STOCK_FINAL_OUTPUT/format.log" 2>&1
      - name: Workflow and translation contracts
        run: |
          node --test scripts/workflow-topology.test.mjs scripts/check-i18n.test.mjs > "$STOCK_FINAL_OUTPUT/contracts.log" 2>&1
          node scripts/check-i18n.mjs --base e0573fb5a219233d11420c08f2919ff29182e936 > "$STOCK_FINAL_OUTPUT/translations.log" 2>&1
      - name: Stock, seller and media URL tests
        working-directory: apps/web
        run: |
          bun test src/features/store/stock-status.test.ts > "$STOCK_FINAL_OUTPUT/stock-unit.log" 2>&1
          bun test src/features/store/catalogue-interactions.test.tsx > "$STOCK_FINAL_OUTPUT/catalogue.log" 2>&1
          bun test src/features/store/interactions.test.tsx > "$STOCK_FINAL_OUTPUT/seller-interactions.log" 2>&1
          bun test src/features/usage-logs/lib/__tests__/async-task-logs.test.ts src/features/usage-logs/lib/__tests__/safe-media-url-controls.test.ts > "$STOCK_FINAL_OUTPUT/usage-log-tests.log" 2>&1
      - name: Stock and quota database tests with race detection
        working-directory: apps/api-go
        shell: bash
        run: |
          go test -race -p 2 ./model -run 'TestMerchantStore(Catalogue|Sales|Remaining|Fixed|Stock)' -count=1 -timeout=10m -json | tee "$STOCK_FINAL_OUTPUT/database.jsonl"
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/stock-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/stock-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile acceptance against the built candidate
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/stock-browser/node_modules/playwright/index.mjs
          STOCK_REVIEW_OUTPUT: ${{ runner.temp }}/stock-qualified
          STOCK_REVIEW_URL: http://127.0.0.1:4189
        run: |
          bun run build > "$STOCK_FINAL_OUTPUT/build.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4189 > "$STOCK_FINAL_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4189/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-stock-review.mjs
      - name: Record passed qualification and exact tracked source
        run: |
          git diff --exit-code -- . ':!apps/web/src/routeTree.gen.ts'
          git archive --format=tar.gz -o "$STOCK_FINAL_OUTPUT/source.tar.gz" HEAD
          printf 'passed\n' > "$STOCK_FINAL_OUTPUT/qualification.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-qualified-candidate
          path: ${{ runner.temp }}/stock-qualified
          if-no-files-found: error
          retention-days: 7
