name: Diagnose production authenticated readiness
on:
  push:
    branches: [release/acceptance-20260916]
    paths: [.github/workflows/diagnose-production-auth-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect current native probe selection and HTTP rejection class
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          umask 077
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$root/key"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$root/known_hosts"
          timeout 150 ssh -i "$root/key" -p 222 -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$root/known_hosts" root@45.59.187.63 python3 - <<'PY'
          import json, os, re, shlex, stat, subprocess, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          def private(path):
              info=path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_mode & 0o077 or info.st_size>1048576:
                  raise ValueError('unsafe private input')
              return path.read_text()
          report={'state_changes':False,'old_failure_classes':[],'auth_probes':[]}
          for workspace in sorted(Path('/var/lib/lmm-api-go-deploy/work').iterdir(),key=lambda p:p.lstat().st_mtime,reverse=True)[:10]:
              if workspace.is_symlink(): continue
              path=workspace/'state'/'status.json'
              if not path.exists(): continue
              state=json.loads(private(path))
              if state.get('phase')!='FAILED_PREARM': continue
              failure=str(state.get('failure',''))
              report['old_failure_classes'].append({'exit_codes':re.findall(r'exit status (\d{1,3})',failure),'timeout':'timed out' in failure,'token_file_unsafe':'token is missing or unsafe' in failure,'invalid_models_array':'does not contain an array' in failure,'parse_error':'decode authenticated models response' in failure,'authentication_probe':'authenticated business probe failed' in failure})
          try:
              values={}
              for line in private(Path('/etc/lmm-api-go/lmm-api-go.env')).splitlines():
                  if not line.strip() or line.lstrip().startswith('#') or '=' not in line: continue
                  key,value=line.split('=',1)
                  key=key.strip().removeprefix('export ')
                  parsed=shlex.split(value,comments=True)
                  values[key]=' '.join(parsed)
              dsn=values.get('SQL_DSN','')
              if not dsn: raise ValueError('missing database configuration')
              connection=urllib.parse.urlsplit(dsn)
              if connection.scheme not in ('postgres','postgresql'): raise ValueError('unsupported database configuration')
              env={'PATH':'/usr/bin:/bin','LC_ALL':'C','PGCONNECT_TIMEOUT':'10','PGPASSWORD':urllib.parse.unquote(connection.password or '')}
              netloc=connection.netloc.rsplit('@',1)[-1]
              if connection.username: netloc=urllib.parse.quote(urllib.parse.unquote(connection.username),safe='')+'@'+netloc
              clean_dsn=urllib.parse.urlunsplit((connection.scheme,netloc,connection.path,connection.query,''))
              query="""SELECT tokens.key FROM tokens JOIN users ON users.id=tokens.user_id
          WHERE tokens.deleted_at IS NULL AND tokens.status=1 AND users.status=1 AND users.role>=10
          AND (tokens.expired_time=-1 OR tokens.expired_time>EXTRACT(EPOCH FROM NOW()))
          AND (tokens.unlimited_quota OR tokens.remain_quota>0)
          AND COALESCE(LENGTH(BTRIM(tokens.allow_ips)),0)=0
          ORDER BY tokens.unlimited_quota DESC,tokens.remain_quota DESC,tokens.id DESC LIMIT 3"""
              result=subprocess.run(['/usr/bin/psql','-X','-A','-t','-v','ON_ERROR_STOP=1','--command',query,clean_dsn],env=env,capture_output=True,text=True,timeout=20)
              if result.returncode: raise ValueError('read-only database query failed')
              tokens=result.stdout.splitlines()
              report['eligible_probe_count']=len(tokens)
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs): raise ValueError('redirect refused')
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              known=[('ip_policy',('ip','IP','白名单','地区','区域','ASN')),('inactive_user',('disabled','禁用','封禁','未激活')),('invalid_token',('token','Token','令牌','密钥')),('quota',('quota','额度','余额')),('group',('group','分组')),('login',('登录','login','unauthorized','认证'))]
              cheap=('gpt-4.1-nano','gpt-4o-mini','gpt-4.1-mini')
              for index,token in enumerate(tokens):
                  if not re.fullmatch('[A-Za-z0-9_-]{16,128}',token): raise ValueError('unsafe database token')
                  row={'candidate_rank':index+1}
                  for name,origin in [('public','https://api.lmm.best'),('local','http://127.0.0.1:3000')]:
                      request=urllib.request.Request(origin+'/v1/models',headers={'Authorization':'Bearer sk-'+token,'User-Agent':'lmm-api/acceptance','Cache-Control':'no-cache'})
                      try:
                          response=opener.open(request,timeout=12)
                      except urllib.error.HTTPError as error:
                          response=error
                      with response:
                          raw=response.read(1048577)
                          if len(raw)>1048576: raise ValueError('oversized response')
                          entry={'status':response.code}
                          try:
                              payload=json.loads(raw)
                              models=payload.get('data')
                              entry['models_array']=isinstance(models,list)
                              if isinstance(models,list):
                                  entry['model_count']=len(models)
                                  ids={model.get('id') for model in models if isinstance(model,dict)}
                                  entry['available_probe_models']=[model for model in cheap if model in ids]
                              text=str(payload.get('message',''))+' '+str(payload.get('error',''))
                              entry['error_classes']=[label for label,words in known if any(word in text for word in words)]
                          except (ValueError,AttributeError): entry['json']=False
                          row[name]=entry
                  report['auth_probes'].append(row)
              tokens=[]
              token=''
          except Exception as error:
              report['diagnostic_error']=type(error).__name__
          print(json.dumps(report,indent=2,sort_keys=True))
          if 'diagnostic_error' in report: raise SystemExit(1)
          PY
