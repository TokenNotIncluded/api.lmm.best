name: Native OAuth integration verification
on:
  push:
    branches: [feat/codewhale-native-openai-oauth]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Apply and commit the reviewed route changes
        run: |
          python3 .native-oauth-edit.py
          gofmt -w apps/api-go/service/oauth_openai.go apps/api-go/service/oauth_openai_test.go apps/api-go/middleware/oauth_openai.go apps/api-go/router/oauth_native_openai_test.go apps/api-go/controller/oauth_catalog.go apps/api-go/middleware/oauth_resource.go apps/api-go/router/oauth_server.go apps/api-go/router/oauth_server_test.go apps/api-go/router/relay-router.go
          git diff --check
          mkdir -p "$RUNNER_TEMP/native-results"
          git diff --binary > "$RUNNER_TEMP/native-results/changes.patch"
          git rm .native-oauth-edit.py .github/workflows/native-oauth-review.yml
          git add apps/api-go
          git -c user.name=LIghtJUNction -c user.email=lightjunction.me@gmail.com commit -m 'feat(oauth): serve group-bound models to native OpenAI-compatible clients'
          git push origin HEAD:feat/codewhale-native-openai-oauth
          git rev-parse HEAD > "$RUNNER_TEMP/native-results/commit.txt"
      - name: Exercise OAuth authorization, model binding and billing
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go test -p 2 ./service ./middleware ./router -run OAuth -count=1 -json 2>&1 | tee "$RUNNER_TEMP/native-results/tests.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-oauth-verification
          path: ${{ runner.temp }}/native-results
          retention-days: 3
