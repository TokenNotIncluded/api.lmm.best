name: Assistant integration check
on:
  push:
    branches: [improve/assistant-token-efficiency]
    paths: [.github/workflows/assistant-integration-check.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Integrate fixed main revision without discarding either side
        run: |
          mkdir -p "$RUNNER_TEMP/integration"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 11da1f1ccfb95558ae311f3292acf25de8829b87 || test -n "$(git diff --name-only --diff-filter=U)"
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, os
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          missing = object()
          def merge(base, ours, theirs):
              if ours == theirs: return ours
              if ours == base: return theirs
              if theirs == base: return ours
              if all(isinstance(v, dict) for v in (base, ours, theirs)):
                  result = {}
                  for key in dict.fromkeys([*base, *ours, *theirs]):
                      value = merge(base.get(key, missing), ours.get(key, missing), theirs.get(key, missing))
                      if value is not missing: result[key] = value
                  return result
              raise ValueError('conflicting edit requires manual review')
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          Path(os.environ['RUNNER_TEMP'] + '/integration/conflicts.txt').write_text('\n'.join(conflicts))
          for name in conflicts:
              if name.startswith('apps/web/src/i18n/locales/') and name.endswith('.json'):
                  versions = [json.loads(git('show', f':{i}:{name}')) for i in (1,2,3)]
                  combined = merge(*versions)
                  Path(name).write_text(json.dumps(combined, ensure_ascii=False, indent=2) + '\n')
              elif name == 'CHANGELOG.md':
                  base, ours, theirs = [git('show', f':{i}:{name}') for i in (1,2,3)]
                  import difflib
                  def insertions(value):
                      changes = []
                      base_lines, value_lines = base.splitlines(True), value.splitlines(True)
                      for tag, a, b, c, d in difflib.SequenceMatcher(a=base_lines, b=value_lines, autojunk=False).get_opcodes():
                          if tag == 'equal': continue
                          if tag != 'insert': raise ValueError('non-additive changelog conflict requires review')
                          changes.append((a, value_lines[c:d]))
                      return changes
                  additions = {}
                  for pos, lines in insertions(theirs) + insertions(ours):
                      additions.setdefault(pos, []).append(lines)
                  output = []
                  original = base.splitlines(True)
                  for pos in range(len(original) + 1):
                      seen = set()
                      for lines in additions.get(pos, []):
                          block = ''.join(lines)
                          if block not in seen: output.extend(lines); seen.add(block)
                      if pos < len(original): output.append(original[pos])
                  Path(name).write_text(''.join(output))
              else:
                  raise ValueError(f'unsupported source conflict: {name}')
              subprocess.run(['git','add','--',name], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          PY
          git diff --check
          git diff --cached --check
      - name: Verify merged Go source
        env:
          GOMAXPROCS: '2'
        run: |
          cd apps/api-go
          go test -p 2 ./internal/agent ./setting -count=1 2>&1 | tee "$RUNNER_TEMP/integration/go-unit.log"
          go test -p 2 ./controller -run '^TestAssistant' -count=1 2>&1 | tee "$RUNNER_TEMP/integration/go-assistant.log"
          go vet ./internal/agent ./setting ./controller
      - name: Verify merged frontend
        run: |
          bun install --frozen-lockfile
          cd apps/web
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/integration/web-types.log"
          bun x --no-install oxlint -c .oxlintrc.json src/features/assistant/assistant-tool-calls.tsx src/features/assistant/assistant-tool-calls.test.ts 2>&1 | tee "$RUNNER_TEMP/integration/web-lint.log"
          failed=0
          while IFS= read -r file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee -a "$RUNNER_TEMP/integration/web-tests.log" || failed=1
          done < <(find ./src/features/assistant -name '*.test.ts' -o -name '*.test.tsx' | sort)
          exit "$failed"
      - name: Capture evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/integration"
          git status --short > "$RUNNER_TEMP/integration/status.txt"
          git diff HEAD --binary > "$RUNNER_TEMP/integration/integration.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-integration
          path: ${{ runner.temp }}/integration
          retention-days: 3
      - name: Commit verified integration to the feature branch only
        run: |
          git rm .github/workflows/assistant-integration-check.yml
          git diff --cached --check
          git commit -m 'chore(assistant): integrate current main and retain both changelog entries'
          git push origin HEAD:refs/heads/improve/assistant-token-efficiency
