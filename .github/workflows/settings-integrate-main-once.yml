name: Integrate settings with console navigation
on:
  push:
    branches: [design/settings-workspace-20260922]
    paths: [.github/workflows/settings-integrate-main-once.yml]
permissions:
  contents: write
concurrency:
  group: settings-integrate-main-once
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile reviewed shared-component changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 83ea7cdeecf5f21770c073f26c1a3d0b2aced328 || {
            python3 - <<'PY'
          import subprocess
          allowed = {'apps/web/src/components/layout/components/section-page-layout.tsx', 'apps/web/src/features/system-settings/components/settings-section.tsx'}
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          assert conflicts and conflicts <= allowed, f'Unexpected merge conflicts: {conflicts}'
          PY
          }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '83ea7cdeecf5f21770c073f26c1a3d0b2aced328'
          layout = Path('apps/web/src/components/layout/components/section-page-layout.tsx')
          text = subprocess.check_output(['git', 'show', f'{base}:{layout}'], text=True)
          assert '  fixedContent?: boolean' in text and '<Main>' in text
          text = text.replace('  fixedContent?: boolean', '  fixedContent?: boolean\n  className?: string').replace('<Main>', '<Main className={props.className}>')
          layout.write_text(text)
          section = Path('apps/web/src/features/system-settings/components/settings-section.tsx')
          text = subprocess.check_output(['git', 'show', f'{base}:{section}'], text=True)
          assert 'console-settings-section flex flex-col gap-5' in text
          section.write_text(text.replace('console-settings-section flex flex-col gap-5', 'settings-section console-settings-section flex flex-col gap-5'))
          css = Path('apps/web/src/features/system-settings/components/settings-workspace.css')
          text = css.read_text()
          assert '.console-section-header h2' in text
          css.write_text(text.replace('.console-section-header h2', '.console-section-header :is(h1, h2)'))
          review = Path('apps/web/scripts/visual-review/settings_review.py')
          text = review.read_text()
          assert "page.locator('h2').first" in text
          review.write_text(text.replace("page.locator('h2').first", "page.locator('.console-section-header :is(h1, h2)').first"))
          PY
          git add apps/web/src/components/layout/components/section-page-layout.tsx apps/web/src/features/system-settings/components/settings-section.tsx apps/web/src/features/system-settings/components/settings-workspace.css apps/web/scripts/visual-review/settings_review.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/settings-integrate-main-once.yml
          git diff --cached --check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:web
      - name: Settings regression tests
        working-directory: apps/web
        shell: bash
        run: |
          while IFS= read -r test; do
            bun test "$test"
          done < <(find src/features/system-settings -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
      - name: Build
        run: bun run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Record integrated real browser interactions
        run: |
          mkdir -p output/settings-review
          python apps/web/scripts/visual-review/settings_review.py
      - name: Commit validated integration without changing main
        run: |
          git commit -m 'merge(web): preserve console navigation while integrating settings redesign'
          git rev-parse HEAD > output/settings-review/commit.txt
          git archive --format=tar.gz --output=output/settings-review/validated-source.tar.gz HEAD
          git push origin HEAD:refs/heads/design/settings-workspace-20260922
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-integrated-visual-review
          path: output/settings-review
          retention-days: 7
