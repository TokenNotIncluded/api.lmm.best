name: Console page review

on:
  pull_request:
    paths:
      - ".github/workflows/console-page-review.yml"
      - "apps/web/scripts/console-page-review.mjs"

permissions:
  contents: read

concurrency:
  group: console-page-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Export tracked source for isolated review
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/console-page-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/console-page-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/console-page-source/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-page-source
          path: ${{ runner.temp }}/console-page-source
          retention-days: 1
          compression-level: 0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Package reproducible development dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/console-page-dependencies"
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/console-page-dependencies/dependencies.tar.gz"
          gzip -c "$(command -v bun)" > "$RUNNER_TEMP/console-page-dependencies/bun.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-page-dependencies
          path: ${{ runner.temp }}/console-page-dependencies
          retention-days: 1
          compression-level: 0
