name: Console refresh isolated validation
on:
  push:
    branches: [work/console-refresh-validation-20260916]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Export tracked source for offline review
        run: |
          mkdir -p /tmp/console-review
          git archive --format=tar.gz HEAD > /tmp/console-review/source.tar.gz
          git rev-parse HEAD > /tmp/console-review/SOURCE_SHA.txt
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-review-source
          path: /tmp/console-review
          retention-days: 3
          if-no-files-found: error
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Export dependency tooling for offline checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/console-tools
          cp "$(command -v bun)" /tmp/console-tools/bun
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/console-tools/dependencies.tar.gz
      - name: Upload dependency tooling
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-review-tooling
          path: /tmp/console-tools
          retention-days: 3
          if-no-files-found: error
