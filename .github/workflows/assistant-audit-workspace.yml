name: Assistant audit workspace
on:
  push:
    branches: [fix/assistant-tool-audit-policies]
    paths: [.github/workflows/assistant-audit-workspace.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      CI: 'true'
      INTEGRATED_MAIN: 355d1e37e57ad98a69fd2b9756ba326a57f365ae
    steps:
      - name: Checkout published assistant fixes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Integrate latest main without changing its features
        run: |
          git config user.name 'LIghtJUNction'
          git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
          git rm .github/workflows/assistant-audit-workspace.yml
          git commit -m 'chore: remove temporary assistant verification workflow'
          git merge --no-edit "$INTEGRATED_MAIN"
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Refresh operation definitions from current source
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Go tests
        id: go_tests
        continue-on-error: true
        working-directory: apps/api-go
        run: go test -p 2 ./controller ./model ./router ./setting/... ./internal/agent ./internal/marketprovider ./oauthserver -count=1 -json 2>&1 | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Go static analysis
        id: go_vet
        continue-on-error: true
        working-directory: apps/api-go
        run: go vet ./controller ./model ./router ./setting/... ./internal/agent ./internal/marketprovider ./oauthserver 2>&1 | tee "$RUNNER_TEMP/go-vet.log"
      - name: Web production build and route generation
        id: web_build
        continue-on-error: true
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/web-build.log"
      - name: Web types, lint, notices and bundle size
        id: web_checks
        continue-on-error: true
        run: |
          bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/web-types.log"
          bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
          bun run --filter @lmm/web copyright:check 2>&1 | tee "$RUNNER_TEMP/web-copyright.log"
          bun run --filter @lmm/web bundle:check 2>&1 | tee "$RUNNER_TEMP/web-bundle.log"
      - name: Isolated frontend regression tests
        id: web_tests
        continue-on-error: true
        working-directory: apps/web
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, os, sys
          roots = ['src/features/assistant', 'src/features/legal', 'src/features/system-settings', 'src/components/ai-elements/openui', 'src/features/tool-market']
          files = sorted({p for root in roots for p in pathlib.Path(root).rglob('*') if p.name.endswith(('.test.ts', '.test.tsx'))})
          failures = []
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-tests.log', 'w') as log:
              for p in files:
                  result = subprocess.run(['bun', 'test', '--preload', './scripts/test-preload.mjs', '--timeout', '15000', './' + str(p)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  log.write(f'\nFILE {p}\n{result.stdout}\n'); log.flush()
                  print(f'{"PASS" if result.returncode == 0 else "FAIL"} {p}', flush=True)
                  if result.returncode: failures.append(str(p))
              log.write(f'\nFILES {len(files)}, FAILURES {len(failures)}\n')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          PY
      - name: Workflow contract and clean diff
        id: contracts
        continue-on-error: true
        run: |
          node --test scripts/workflow-topology.test.mjs 2>&1 | tee "$RUNNER_TEMP/workflow-contracts.log"
          git diff --check
          test -z "$(find . -maxdepth 1 -name '.assistant-audit-*' -print)"
      - name: Require all checks
        env:
          RESULTS: '${{ steps.go_tests.outcome }} ${{ steps.go_vet.outcome }} ${{ steps.web_build.outcome }} ${{ steps.web_checks.outcome }} ${{ steps.web_tests.outcome }} ${{ steps.contracts.outcome }}'
        run: |
          printf '%s\n' "$RESULTS" | tee "$RUNNER_TEMP/check-results.txt"
          for result in $RESULTS; do test "$result" = success; done
      - name: Commit generated definitions and push tested merge
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {'apps/api-go/controller/assistant_admin_operation_contracts.json', 'apps/web/src/routeTree.gen.ts', 'apps/api-go/controller/assistant_openui_prompt.txt'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert not changed - allowed, changed - allowed
          subprocess.run(['git', 'add', '-A'], check=True)
          PY
          if ! git diff --cached --quiet; then git commit -m 'test(assistant): regenerate admin operation definitions for latest main'; fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/validated-tree.txt"
          git push origin HEAD:fix/assistant-tool-audit-policies 2>&1 | tee "$RUNNER_TEMP/push.log"
      - name: Export candidate source and verification evidence
        if: always()
        run: |
          git add -A
          tree=$(git write-tree)
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-candidate.tar.gz" "$tree"
          git diff --stat "$INTEGRATED_MAIN" > "$RUNNER_TEMP/candidate-stat.txt"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-latest-main-validation
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/check-results.txt
            ${{ runner.temp }}/validated-sha.txt
            ${{ runner.temp }}/validated-tree.txt
            ${{ runner.temp }}/candidate-stat.txt
            ${{ runner.temp }}/assistant-candidate.tar.gz
          retention-days: 3
