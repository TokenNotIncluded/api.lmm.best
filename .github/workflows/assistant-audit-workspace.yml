name: Assistant audit workspace
on:
  push:
    branches: [fix/assistant-tool-audit-policies]
    paths: [.github/workflows/assistant-audit-workspace.yml]
permissions:
  contents: write
concurrency:
  group: assistant-tool-audit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      CI: 'true'
      INTEGRATED_MAIN: b009976199d4441f4e8b465db2c623e9008ba056
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Apply reviewed patch and preserve concurrent main changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          parts = [pathlib.Path(f'.assistant-audit-patch.{i}') for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '822acbd0b3c3234814e669f93b9020dfa933427c8a6d5e94915941092418499f'
          (temp / 'assistant.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(temp / 'assistant.patch')], check=True)
          subprocess.run(['git', 'apply', str(temp / 'assistant.patch')], check=True)
          for p in parts: p.unlink()
          pathlib.Path('.github/workflows/assistant-audit-workspace.yml').unlink()
          def replace(path, old, new):
              p = pathlib.Path(path); text = p.read_text(); assert old in text, path
              p.write_text(text.replace(old, new))
          replace('apps/web/src/features/system-settings/content/assistant-tool-configuration.tsx', 'if (rulesSupported && !disabled) onChange(updateAssistantToolRule(policy, tool.name, { ...rule, ...values }))', 'if (rulesSupported && !disabled) { onChange(updateAssistantToolRule(policy, tool.name, { ...rule, ...values })) }')
          for path in ['apps/web/src/features/legal/refund-policy.tsx', 'apps/web/src/routes/refund-policy.tsx']:
              replace(path, '\nexport ', '\n\nexport ')
          replace('apps/web/src/features/system-settings/content/assistant-tool-policy-editor.test.tsx', 'JSON.parse(rendered.changes.at(-1)!)', "JSON.parse(rendered.changes.at(-1) ?? '{}')")
          path = pathlib.Path('apps/api-go/setting/assistant_tool_policy.go')
          text = path.read_text(); start = text.index('\t{"site_policies"'); end = text.index('\t{"service_help"', start)
          group = text[start:end]; text = text[:start] + text[end:]; end = text.index('\n}\n', start)
          path.write_text(text[:end] + '\n' + group.rstrip('\n') + text[end:])
          subprocess.run(['git', 'config', 'user.name', 'LIghtJUNction'], check=True)
          subprocess.run(['git', 'config', 'user.email', '106986785+LIghtJUNction@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(assistant): restore tool configuration and add guarded policy tools'], check=True)
          subprocess.run(['git', 'merge', '--no-commit', '--no-ff', os.environ['INTEGRATED_MAIN']])
          subprocess.run(['python3', '.assistant-audit-resolve.py'], check=True)
          pathlib.Path('.assistant-audit-resolve.py').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).strip()
          subprocess.run(['git', 'commit', '-m', 'merge main: retain assistant discovery and resolve policy tool contracts'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['INTEGRATED_MAIN']], text=True).splitlines()
          changed += ['apps/web/src/routeTree.gen.ts', 'apps/api-go/controller/assistant_admin_operation_contracts.json']
          (temp / 'allowed-files.txt').write_text('\n'.join(changed))
          PY
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Refresh generated operation contracts
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Format only modified source
        run: |
          git diff --name-only "$INTEGRATED_MAIN" -- '*.go' | xargs -r gofmt -w
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unrelated = [p for p in changed if p not in allowed]
          if unrelated:
              print('Restore unrelated formatting:', unrelated)
              subprocess.run(['git', 'restore', '--worktree', '--', *unrelated], check=True)
          PY
      - name: Go tests for affected packages
        id: go_tests
        continue-on-error: true
        working-directory: apps/api-go
        run: go test -p 2 ./controller ./model ./router ./setting/... ./internal/agent -count=1 -json 2>&1 | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Go static analysis
        id: go_vet
        continue-on-error: true
        working-directory: apps/api-go
        run: go vet ./controller ./model ./router ./setting/... ./internal/agent 2>&1 | tee "$RUNNER_TEMP/go-vet.log"
      - name: Web production build and route generation
        id: web_build
        continue-on-error: true
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/web-build.log"
      - name: Web type checking
        id: web_types
        continue-on-error: true
        run: bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/web-types.log"
      - name: Web lint
        id: web_lint
        continue-on-error: true
        run: bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
      - name: Web copyright notices
        id: web_notices
        continue-on-error: true
        run: bun run --filter @lmm/web copyright:check 2>&1 | tee "$RUNNER_TEMP/web-copyright.log"
      - name: Web assistant, policy, settings and OpenUI regression tests
        id: web_tests
        continue-on-error: true
        working-directory: apps/web
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          roots = ['src/features/assistant', 'src/features/legal', 'src/features/system-settings', 'src/components/ai-elements/openui']
          files = sorted({p for root in roots for p in pathlib.Path(root).rglob('*') if p.name.endswith(('.test.ts', '.test.tsx'))})
          failures = []
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-tests.log', 'w') as log:
              for p in files:
                  result = subprocess.run(['bun', 'test', '--preload', './scripts/test-preload.mjs', '--timeout', '15000', './' + str(p)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  log.write(f'\nFILE {p}\n{result.stdout}\n'); log.flush()
                  print(f'{"PASS" if result.returncode == 0 else "FAIL"} {p}', flush=True)
                  if result.returncode: failures.append(str(p))
              log.write(f'\nFILES {len(files)}, FAILURES {len(failures)}\n')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          PY
      - name: Check bundle and repository boundaries
        id: contracts
        continue-on-error: true
        run: |
          bun run --filter @lmm/web bundle:check 2>&1 | tee "$RUNNER_TEMP/web-bundle.log"
          node --test scripts/workflow-topology.test.mjs 2>&1 | tee "$RUNNER_TEMP/workflow-contracts.log"
          git diff --check
      - name: Require all validation steps
        env:
          RESULTS: '${{ steps.go_tests.outcome }} ${{ steps.go_vet.outcome }} ${{ steps.web_build.outcome }} ${{ steps.web_types.outcome }} ${{ steps.web_lint.outcome }} ${{ steps.web_notices.outcome }} ${{ steps.web_tests.outcome }} ${{ steps.contracts.outcome }}'
        run: |
          printf '%s\n' "$RESULTS" | tee "$RUNNER_TEMP/check-results.txt"
          for result in $RESULTS; do test "$result" = success; done
      - name: Commit and push validated source only
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert not changed - allowed, changed - allowed
          assert not list(pathlib.Path('.').glob('.assistant-audit-*'))
          assert not pathlib.Path('.github/workflows/assistant-audit-workspace.yml').exists()
          subprocess.run(['git', 'add', '-A'], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'test(assistant): refresh generated contracts and formatted regression coverage'
          fi
          git push origin HEAD:fix/assistant-tool-audit-policies
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-sha.txt"
      - name: Export tracked candidate for inspection
        if: always()
        run: |
          git add -A
          tree=$(git write-tree)
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-candidate.tar.gz" "$tree"
          git diff --stat "$INTEGRATED_MAIN" > "$RUNNER_TEMP/candidate-stat.txt"
      - name: Upload test evidence and source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-audit-final-validation
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/check-results.txt
            ${{ runner.temp }}/validated-sha.txt
            ${{ runner.temp }}/candidate-stat.txt
            ${{ runner.temp }}/assistant-candidate.tar.gz
          retention-days: 3
