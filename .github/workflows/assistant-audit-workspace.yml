name: Assistant audit workspace
on:
  push:
    branches: [fix/assistant-tool-audit-policies]
    paths: [.github/workflows/assistant-audit-workspace.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      CI: 'true'
      INTEGRATED_MAIN: 355d1e37e57ad98a69fd2b9756ba326a57f365ae
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Integrate latest main and fix its seven frontend lint errors
        run: |
          git config user.name 'LIghtJUNction'
          git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
          git rm .github/workflows/assistant-audit-workspace.yml
          git commit -m 'chore: remove temporary assistant verification workflow'
          git merge --no-edit "$INTEGRATED_MAIN"
          python3 .assistant-market-lint-fix.py
          git rm .assistant-market-lint-fix.py
          git add -N .
          git diff --name-only > "$RUNNER_TEMP/allowed-files.txt"
          printf '%s\n' 'apps/api-go/controller/assistant_admin_operation_contracts.json' 'apps/web/src/routeTree.gen.ts' >> "$RUNNER_TEMP/allowed-files.txt"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Regenerate operation definitions
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Install and format changed frontend files only
        run: |
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import pathlib, os, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unrelated = [p for p in changed if p not in allowed]
          if unrelated: subprocess.run(['git', 'restore', '--worktree', '--', *unrelated], check=True)
          PY
      - name: Web production build
        id: build
        continue-on-error: true
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/web-build.log"
      - name: Verify Go source is byte-identical to the complete passing test run
        id: go_identity
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, os
          names = sorted(subprocess.check_output(['git', 'ls-files', 'apps/api-go'], text=True).splitlines())
          digest = hashlib.sha256()
          for name in names:
              p = pathlib.Path(name)
              digest.update(name.encode() + b'\0' + hashlib.sha256(p.read_bytes()).digest())
          actual = digest.hexdigest()
          expected = 'c7aca5f7900621d4fab07073679c53d1e333cb668f3b520c4c67bdb966c36a90'
          assert len(names) == 2576, len(names)
          assert actual == expected, actual
          proof = f'Go source SHA256: {actual}\nFiles: {len(names)}\nIdentical to artifact 11648841542 of run 37999674312.\nThat run completed 6190 passing Go test cases including subtests, 205 skipped, zero failures, and Go vet.\nThis run changes frontend lint issues only and verifies identity instead of claiming to rerun the Go tests.\n'
          print(proof)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'go-proof.txt').write_text(proof)
          PY
      - name: Web types, lint, notices and bundle size
        id: checks
        continue-on-error: true
        run: |
          bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/web-types.log"
          bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
          bun run --filter @lmm/web copyright:check 2>&1 | tee "$RUNNER_TEMP/web-copyright.log"
          bun run --filter @lmm/web bundle:check 2>&1 | tee "$RUNNER_TEMP/web-bundle.log"
      - name: All affected frontend tests in isolated processes
        id: tests
        continue-on-error: true
        working-directory: apps/web
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, os, sys
          roots = ['src/features/assistant', 'src/features/legal', 'src/features/system-settings', 'src/components/ai-elements/openui', 'src/features/tool-market']
          files = sorted({p for root in roots for p in pathlib.Path(root).rglob('*') if p.name.endswith(('.test.ts', '.test.tsx'))})
          failures = []
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-tests.log', 'w') as log:
              for p in files:
                  result = subprocess.run(['bun', 'test', '--preload', './scripts/test-preload.mjs', '--timeout', '15000', './' + str(p)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  log.write(f'\nFILE {p}\n{result.stdout}\n'); log.flush()
                  print(f'{"PASS" if result.returncode == 0 else "FAIL"} {p}', flush=True)
                  if result.returncode: failures.append(str(p))
              log.write(f'\nFILES {len(files)}, FAILURES {len(failures)}\n')
          if failures: print('\n'.join(failures)); sys.exit(1)
          PY
      - name: Workflow contracts and diff
        id: contracts
        continue-on-error: true
        run: |
          node --test scripts/workflow-topology.test.mjs 2>&1 | tee "$RUNNER_TEMP/workflow-contracts.log"
          git diff --check
          test -z "$(find . -maxdepth 1 -name '.assistant-*' -print)"
      - name: Require all validation checks
        env:
          RESULTS: '${{ steps.build.outcome }} ${{ steps.go_identity.outcome }} ${{ steps.checks.outcome }} ${{ steps.tests.outcome }} ${{ steps.contracts.outcome }}'
        run: |
          printf '%s\n' "$RESULTS" | tee "$RUNNER_TEMP/check-results.txt"
          for result in $RESULTS; do test "$result" = success; done
      - name: Commit and push validated source
        run: |
          git add -A
          git commit -m 'fix(web): resolve marketplace lint and preserve language-sensitive translations'
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/validated-tree.txt"
          git push origin HEAD:fix/assistant-tool-audit-policies 2>&1 | tee "$RUNNER_TEMP/push.log"
      - name: Export source and evidence
        if: always()
        run: |
          git add -A
          tree=$(git write-tree)
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-candidate.tar.gz" "$tree"
          git diff --stat "$INTEGRATED_MAIN" > "$RUNNER_TEMP/candidate-stat.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-merge-validation
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/go-proof.txt
            ${{ runner.temp }}/check-results.txt
            ${{ runner.temp }}/validated-sha.txt
            ${{ runner.temp }}/validated-tree.txt
            ${{ runner.temp }}/candidate-stat.txt
            ${{ runner.temp }}/assistant-candidate.tar.gz
          retention-days: 3
