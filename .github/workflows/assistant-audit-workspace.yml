name: Assistant audit workspace

on:
  push:
    branches:
      - fix/assistant-tool-audit-policies
    paths:
      - .github/workflows/assistant-audit-workspace.yml

permissions:
  contents: write

concurrency:
  group: assistant-tool-audit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      CI: 'true'
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify and apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          parts = [pathlib.Path(f'.assistant-audit-patch.{i}') for i in range(4)]
          data = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == '822acbd0b3c3234814e669f93b9020dfa933427c8a6d5e94915941092418499f'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'assistant.patch'
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for p in parts:
              p.unlink()
          pathlib.Path('.github/workflows/assistant-audit-workspace.yml').unlink()
          subprocess.run(['git', 'add', '-N', '.'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          paths.append('apps/web/src/routeTree.gen.ts')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').write_text('\n'.join(paths))
          PY
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Format only modified source
        run: |
          git diff --name-only -- '*.go' | xargs -r gofmt -w
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unrelated = [p for p in changed if p not in allowed]
          if unrelated:
              subprocess.run(['git', 'restore', '--worktree', '--', *unrelated], check=True)
          PY
      - name: Go tests for affected packages
        id: go_tests
        continue-on-error: true
        working-directory: apps/api-go
        run: go test -p 2 ./controller ./model ./router ./setting/... ./internal/agent -count=1 -json 2>&1 | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Go static analysis
        id: go_vet
        continue-on-error: true
        working-directory: apps/api-go
        run: go vet ./controller ./model ./router ./setting/... ./internal/agent 2>&1 | tee "$RUNNER_TEMP/go-vet.log"
      - name: Web production build and route generation
        id: web_build
        continue-on-error: true
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/web-build.log"
      - name: Web type checking
        id: web_types
        continue-on-error: true
        run: bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/web-types.log"
      - name: Web lint and notices
        id: web_lint
        continue-on-error: true
        run: |
          bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
          bun run --filter @lmm/web copyright:check 2>&1 | tee "$RUNNER_TEMP/web-copyright.log"
      - name: Web assistant, policy and settings regression tests
        id: web_tests
        continue-on-error: true
        working-directory: apps/web
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          roots = ['src/features/assistant', 'src/features/legal', 'src/features/system-settings']
          files = sorted({p for root in roots for p in pathlib.Path(root).rglob('*') if p.name.endswith(('.test.ts', '.test.tsx'))})
          failures = []
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-tests.log', 'w') as log:
              for p in files:
                  result = subprocess.run(['bun', 'test', '--preload', './scripts/test-preload.mjs', '--timeout', '15000', './' + str(p)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  log.write(f'\nFILE {p}\n{result.stdout}\n')
                  log.flush()
                  print(f'{"PASS" if result.returncode == 0 else "FAIL"} {p}', flush=True)
                  if result.returncode:
                      failures.append(str(p))
              log.write(f'\nFILES {len(files)}, FAILURES {len(failures)}\n')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          PY
      - name: Check bundle and repository boundaries
        id: contracts
        continue-on-error: true
        run: |
          bun run --filter @lmm/web bundle:check 2>&1 | tee "$RUNNER_TEMP/web-bundle.log"
          node --test scripts/workflow-topology.test.mjs 2>&1 | tee "$RUNNER_TEMP/workflow-contracts.log"
          git diff --check
      - name: Require all validation steps
        env:
          RESULTS: '${{ steps.go_tests.outcome }} ${{ steps.go_vet.outcome }} ${{ steps.web_build.outcome }} ${{ steps.web_types.outcome }} ${{ steps.web_lint.outcome }} ${{ steps.web_tests.outcome }} ${{ steps.contracts.outcome }}'
        run: |
          printf '%s\n' "$RESULTS" | tee "$RUNNER_TEMP/check-results.txt"
          for result in $RESULTS; do test "$result" = success; done
      - name: Commit and push validated source only
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert not changed - allowed, changed - allowed
          assert not list(pathlib.Path('.').glob('.assistant-audit-patch.*'))
          assert not pathlib.Path('.github/workflows/assistant-audit-workspace.yml').exists()
          subprocess.run(['git', 'add', '-A', '--', *sorted(changed)], check=True)
          PY
          git config user.name 'LIghtJUNction'
          git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
          git commit -m 'fix(assistant): restore tool configuration, admin reads and guarded site policy tools'
          git push origin HEAD:fix/assistant-tool-audit-policies
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-sha.txt"
      - name: Export tracked candidate for inspection
        if: always()
        run: |
          git add -A -- apps/api-go apps/web docs .github/workflows/assistant-audit-workspace.yml .assistant-audit-patch.*
          tree=$(git write-tree)
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-candidate.tar.gz" "$tree"
          git diff --stat HEAD > "$RUNNER_TEMP/candidate-stat.txt"
      - name: Upload test evidence and source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-audit-validation
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/check-results.txt
            ${{ runner.temp }}/validated-sha.txt
            ${{ runner.temp }}/candidate-stat.txt
            ${{ runner.temp }}/assistant-candidate.tar.gz
          retention-days: 3
