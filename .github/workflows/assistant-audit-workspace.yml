name: Assistant audit workspace
on:
  push:
    branches: [fix/assistant-tool-audit-policies]
    paths: [.github/workflows/assistant-audit-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply verified candidate and inspect integration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess, json, tarfile
          root = pathlib.Path('.')
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          parts = [root / f'.assistant-audit-patch.{i}' for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '822acbd0b3c3234814e669f93b9020dfa933427c8a6d5e94915941092418499f'
          (temp / 'assistant.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(temp / 'assistant.patch')], check=True)
          subprocess.run(['git', 'apply', str(temp / 'assistant.patch')], check=True)
          for p in parts: p.unlink()
          pathlib.Path('.github/workflows/assistant-audit-workspace.yml').unlink()
          def replace(path, old, new):
              p = pathlib.Path(path); text = p.read_text(); assert old in text, path
              p.write_text(text.replace(old, new))
          replace('apps/web/src/features/system-settings/content/assistant-tool-configuration.tsx', 'if (rulesSupported && !disabled) onChange(updateAssistantToolRule(policy, tool.name, { ...rule, ...values }))', 'if (rulesSupported && !disabled) { onChange(updateAssistantToolRule(policy, tool.name, { ...rule, ...values })) }')
          for path in ['apps/web/src/features/legal/refund-policy.tsx', 'apps/web/src/routes/refund-policy.tsx']:
              replace(path, '\nexport ', '\n\nexport ')
          replace('apps/web/src/features/system-settings/content/assistant-tool-policy-editor.test.tsx', 'JSON.parse(rendered.changes.at(-1)!)', "JSON.parse(rendered.changes.at(-1) ?? '{}')")
          # Keep existing group order; the new policy group belongs at the end.
          path = pathlib.Path('apps/api-go/setting/assistant_tool_policy.go')
          text = path.read_text(); start = text.index('\t{"site_policies"'); end = text.index('\t{"service_help"', start)
          group = text[start:end]; text = text[:start] + text[end:]; end = text.index('\n}\n', start)
          path.write_text(text[:end] + '\n' + group.rstrip('\n') + text[end:])
          subprocess.run(['git', 'config', 'user.name', 'LIghtJUNction'], check=True)
          subprocess.run(['git', 'config', 'user.email', '106986785+LIghtJUNction@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Local assistant integration candidate; not published'], check=True)
          base = 'b009976199d4441f4e8b465db2c623e9008ba056'
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(temp / 'main-source.tar.gz'), base], check=True)
          subprocess.run(['git', 'merge', '--no-commit', '--no-ff', base])
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          stages = {}
          for name in paths:
              stages[name] = {str(i): subprocess.check_output(['git', 'show', f':{i}:{name}'], text=True) for i in [1,2,3]}
          (temp / 'merge-stages.json').write_text(json.dumps(stages, ensure_ascii=False))
          (temp / 'conflicts.txt').write_text('\n'.join(paths))
          with tarfile.open(temp / 'assistant-integrated-source.tar.gz', 'w:gz') as archive:
              for name in sorted(set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())):
                  p = pathlib.Path(name)
                  if p.is_file() and not p.is_symlink(): archive.add(p, arcname=name)
          (temp / 'integration-meta.txt').write_text('Integrated main: ' + base + '\nNo remote source edits or pushes from this run.\n')
          PY
      - name: Upload integration source and conflicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-integration-inspection
          path: |
            ${{ runner.temp }}/main-source.tar.gz
            ${{ runner.temp }}/assistant-integrated-source.tar.gz
            ${{ runner.temp }}/merge-stages.json
            ${{ runner.temp }}/conflicts.txt
            ${{ runner.temp }}/integration-meta.txt
          retention-days: 1
