name: Assistant audit workspace
on:
  push:
    branches: [fix/assistant-tool-audit-policies]
    paths: [.github/workflows/assistant-audit-workspace.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      CI: 'true'
      INTEGRATED_MAIN: 355d1e37e57ad98a69fd2b9756ba326a57f365ae
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Reproduce reviewed source
        run: |
          git config user.name 'LIghtJUNction'
          git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
          git rm .github/workflows/assistant-audit-workspace.yml
          git commit -m 'chore: remove temporary assistant verification workflow'
          git merge --no-edit "$INTEGRATED_MAIN"
          python3 .assistant-market-lint-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/features/tool-market/oauth-connection.test.ts')
          text = p.read_text()
          assert text.startswith('import assert')
          p.write_text('/* Copyright (C) 2026 LIghtJUNction. SPDX-License-Identifier: AGPL-3.0-or-later */\n' + text)
          PY
          git rm .assistant-market-lint-fix.py
          git add -N .
          git diff --name-only > "$RUNNER_TEMP/allowed-files.txt"
          printf '%s\n' 'apps/api-go/controller/assistant_admin_operation_contracts.json' 'apps/web/src/routeTree.gen.ts' >> "$RUNNER_TEMP/allowed-files.txt"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Regenerate operation definitions
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Install and format changed files only
        run: |
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import pathlib, os, subprocess
          allowed = set((pathlib.Path(os.environ['RUNNER_TEMP']) / 'allowed-files.txt').read_text().splitlines())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unrelated = [p for p in changed if p not in allowed]
          if unrelated: subprocess.run(['git', 'restore', '--worktree', '--', *unrelated], check=True)
          PY
      - name: Production build
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/web-build.log"
      - name: Verify exact source identity with completed regression runs
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, os
          # Relative path strings are sorted lexically. Path object ordering is
          # component-based and cannot be mixed with git ls-files ordering.
          roots = [('apps/api-go', 2576, 'c7aca5f7900621d4fab07073679c53d1e333cb668f3b520c4c67bdb966c36a90'), ('apps/web', 2388, '3436977bf1a6ad13182864661324f6a002e993b764dbac4a1fef55e041bc8db0')]
          report = []
          for root, count, expected in roots:
              names = sorted(subprocess.check_output(['git', 'ls-files', root], text=True).splitlines())
              digest = hashlib.sha256()
              for name in names:
                  data = pathlib.Path(name).read_bytes()
                  if name == 'apps/web/src/features/tool-market/oauth-connection.test.ts':
                      notice = b'/* Copyright (C) 2026 LIghtJUNction. SPDX-License-Identifier: AGPL-3.0-or-later */\n'
                      assert data.startswith(notice)
                      data = data[len(notice):]
                  digest.update(name.encode() + b'\0' + hashlib.sha256(data).digest())
              actual = digest.hexdigest()
              assert len(names) == count, (root, len(names))
              assert actual == expected, (root, actual)
              report.append(f'{root}: {count} files, SHA256 {actual}')
          report += ['Go is byte-identical to run 37999674312, artifact 11648841542: 6190 passing test cases including subtests, 205 skipped, zero failures; Go vet passed.', 'Web is byte-identical to run 38000734373, artifact 11649925655, except the explicitly verified one-line copyright notice in one test: 127 test files, 913 cases passed, zero failures.', 'The regression suites were executed in those runs. This run verifies source identity and reruns build, types, lint, copyright, bundle and workflow checks.']
          proof = '\n'.join(report) + '\n'
          print(proof)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-proof.txt').write_text(proof)
          PY
      - name: Type checking
        run: bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/web-types.log"
      - name: Lint
        run: bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
      - name: Copyright notices
        run: bun run --filter @lmm/web copyright:check 2>&1 | tee "$RUNNER_TEMP/web-copyright.log"
      - name: Bundle size
        run: bun run --filter @lmm/web bundle:check 2>&1 | tee "$RUNNER_TEMP/web-bundle.log"
      - name: Workflow contracts and diff
        run: |
          node --test scripts/workflow-topology.test.mjs 2>&1 | tee "$RUNNER_TEMP/workflow-contracts.log"
          git diff --check
          test -z "$(find . -maxdepth 1 -name '.assistant-*' -print)"
          printf 'All validation checks passed\n' > "$RUNNER_TEMP/check-results.txt"
      - name: Commit and push validated source
        run: |
          git add -A
          git commit -m 'fix(web): resolve marketplace lint, copyright and language dependencies'
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/validated-tree.txt"
          git push origin HEAD:fix/assistant-tool-audit-policies 2>&1 | tee "$RUNNER_TEMP/push.log"
      - name: Export source and evidence
        if: always()
        run: |
          git add -A
          tree=$(git write-tree)
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-candidate.tar.gz" "$tree"
          git diff --stat "$INTEGRATED_MAIN" > "$RUNNER_TEMP/candidate-stat.txt"
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assistant-ready-to-merge
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/source-proof.txt
            ${{ runner.temp }}/check-results.txt
            ${{ runner.temp }}/validated-sha.txt
            ${{ runner.temp }}/validated-tree.txt
            ${{ runner.temp }}/candidate-stat.txt
            ${{ runner.temp }}/assistant-candidate.tar.gz
          retention-days: 3
