name: Assistant workspace browser
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
    paths: ['.github/workflows/assistant-workspace-browser.yml', '.review/assistant-workspace/browser-ready.json']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          path: review
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 7f47389b5cf5cd3247dcc0c08866c6f5a3668a50
          path: source
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare isolated route fixtures
        run: python3 review/.review/assistant-workspace/prepare-browser.py source
      - name: Install development dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Install browser and CJK glyph coverage
        working-directory: source/apps/web
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review real routes and components
        working-directory: source/apps/web
        run: node scripts/assistant-workspace-browser-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-workspace-browser
          path: source/apps/web/artifacts/assistant-workspace-browser/
          retention-days: 5
