name: Assistant workspace browser
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
    paths: ['.github/workflows/assistant-workspace-browser.yml', '.review/assistant-workspace/browser-ready.json']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LMM_ENABLE_PERSONA_DEBUG: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          path: review
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: bc2638041abedcae35341956b9ad72bc7c1a87c1
          path: source
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare isolated route fixtures
        run: |
          python3 review/.review/assistant-workspace/prepare-browser.py source
          python3 - <<'PY'
          from pathlib import Path
          file=Path('source/apps/web/scripts/assistant-workspace-browser-review.mjs')
          text=file.read_text().replace(", '--strict-port'",'').replace(",'--strict-port'",'').replace('/desktop?','/dashboard/overview?')
          before="await page.locator('[data-testid=\"assistant-launcher\"]').click()"
          assert text.count(before)==1
          text=text.replace(before,"await page.keyboard.press('Control+Shift+A')")
          file.write_text(text)
          PY
      - name: Install development dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Install isolated browser runner and CJK glyph coverage
        working-directory: source/apps/web
        run: |
          npm install --prefix /tmp/assistant-browser-runner --no-save @playwright/test@1.56.1
          mkdir -p node_modules
          ln -s /tmp/assistant-browser-runner/node_modules/@playwright node_modules/@playwright
          /tmp/assistant-browser-runner/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review real routes and components
        working-directory: source/apps/web
        run: node scripts/assistant-workspace-browser-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-workspace-browser
          path: source/apps/web/artifacts/assistant-workspace-browser/
          retention-days: 5
