name: HumanGrant web integration

on:
  pull_request:
    branches: [wip/rust-core-go-extensions]
    paths:
      - apps/web/**
      - services/core/src/humangrant/**
      - .github/workflows/humangrant-web.yml

permissions:
  contents: read

concurrency:
  group: humangrant-web-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting and ownership notices
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Run web tests
        run: bun run --filter @lmm/web test

      - name: Build production assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
