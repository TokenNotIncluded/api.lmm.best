name: Extore readaptation edge validation
on:
  push:
    branches: [codex/extore-readapt-20261009]
    paths: [.github/workflows/extore-readapt-validation.yml]
permissions:
  contents: read
jobs:
  edge:
    if: github.ref == 'refs/heads/codex/extore-readapt-20261009'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply exact callback map correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .codex/extore-edge-fix.py
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/extore-edge-changed.json'))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm .codex/extore-edge-fix.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(edge): use an http map for Extore callback response policy'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/codex/extore-readapt-20261009
          git diff --exit-code 60431d207aca9f8bbf1a4d6629e69b88f6a902f5 HEAD -- apps/api-go apps/web
          git rev-parse HEAD
      - name: Install nginx
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx
      - name: Real HTTP, callback headers and sensitive-log regressions
        run: |
          set -euo pipefail
          python3 -B scripts/test-render-frontend-proxy-overlay.py
          node --test scripts/nginx-store-pickup.test.mjs
          git diff --check
          git status --short
          git rev-parse HEAD
