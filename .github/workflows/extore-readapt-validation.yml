name: Extore readaptation validation
on:
  push:
    branches: [codex/extore-readapt-20261009]
    paths: [.codex/extore-readapt.py, .github/workflows/extore-readapt-validation.yml]
permissions:
  contents: write
concurrency:
  group: extore-readapt-20261009
  cancel-in-progress: false
jobs:
  adapt-and-verify:
    if: github.ref == 'refs/heads/codex/extore-readapt-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/extore-readapt-20261009
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Install pinned Bun
        run: |
          npm install --prefix "$RUNNER_TEMP/extore-bun" bun@1.3.14
          echo "$RUNNER_TEMP/extore-bun/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Baseline protocol checks
        if: hashFiles('.codex/extore-readapt.py') != ''
        run: |
          set -euo pipefail
          (cd apps/api-go && go test -race -count=1 ./internal/extore)
          cd apps/web
          bun test --preload ./scripts/test-preload.mjs --timeout 15000 ./src/features/store/extore-import-protocol.test.ts
          bun test --preload ./scripts/test-preload.mjs --timeout 15000 ./src/features/store/extore-import.test.tsx
      - name: Apply bounded changes
        if: hashFiles('.codex/extore-readapt.py') != ''
        run: python3 .codex/extore-readapt.py
      - name: Format and commit only adaptation files
        if: hashFiles('.codex/extore-readapt.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths=json.load(open('/tmp/extore-changed.json'))
          subprocess.run(['gofmt','-w',*[p for p in paths if p.endswith('.go')]],check=True)
          web=[p.removeprefix('apps/web/') for p in paths if p.startswith('apps/web/') and pathlib.Path(p).suffix in {'.ts','.tsx','.js','.mjs','.html'}]
          subprocess.run(['bun','x','oxfmt','--write',*web],cwd='apps/web',check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm .codex/extore-readapt.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(store): readapt Extore fields, encryption and callback isolation'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/codex/extore-readapt-20261009
          git rev-parse HEAD
      - name: Go protocol and store regressions
        working-directory: apps/api-go
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/extore
          go test -p 2 ./controller ./service ./router ./middleware -run 'Extore|MerchantStore|ProtectedFetch|LoggedRequest' -count=1 -timeout=300s
      - name: Frontend checks
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --test scripts/extore-callback.test.mjs
          bun run typecheck
          for test in src/features/store/*.test.ts src/features/store/*.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./$test"
          done
          bun run build
      - name: Install edge-test dependency
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx
      - name: Edge configuration regressions
        run: |
          set -euo pipefail
          python3 -B scripts/test-render-frontend-proxy-overlay.py
          node --test scripts/nginx-store-pickup.test.mjs
          git diff --check
          git status --short
