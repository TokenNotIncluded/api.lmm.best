name: Backend journey repair workbench
on:
  push:
    branches: [codex/backend-journey-workbench-20260922]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/backend-journey-workbench-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Export the pinned worktree for offline review
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/backend-journey-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-journey-source
          path: ${{ runner.temp }}/backend-journey-source.tar.gz
          retention-days: 2
