name: Live public browser acceptance

on:
  push:
    branches: [release/acceptance-20260916]
    paths: [.github/workflows/public-browser-release.yml]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout accepted public probe
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 13b22e03ea2c88fa118814c34f780aa6e77af723
          path: source
          persist-credentials: false
      - name: Checkout reviewed anonymous browser harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 94c86dc148e65820af017a428573efe20eba74fa
          path: review
          sparse-checkout: .github/release-review
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - name: Inspect live version and assets without assuming upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B source/scripts/verify-public-production.py | tee evidence/public.json
      - name: Render real public pages in isolated Chromium
        env:
          BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium)
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/lmm-anonymous-chrome" about:blank \
            >"$RUNNER_TEMP/lmm-chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null; then break; fi
            sleep 0.5
          done
          node --check review/.github/release-review/public-browser.mjs
          node review/.github/release-review/public-browser.mjs
      - name: Retain anonymous acceptance evidence only
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-public-browser-${{ github.run_attempt }}
          path: evidence/
          retention-days: 2
