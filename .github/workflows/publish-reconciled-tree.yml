name: Publish reconciled integration candidate

on:
  push:
    branches: [ci/source-snapshot-20260916-1322]
    paths: [.github/workflows/publish-reconciled-tree.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 93ebc0644874ef71bfc9639e9140bf0b7c1e3bed
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble exact reviewed Git objects without executing repository code
        run: |
          git -c credential.helper= fetch https://github.com/TokenNotIncluded/api.lmm.best.git e11985a8af7a75572af49c65b7b9a1d2fea7d73f 7201650fc6742043e3d6cd436cc9d45c57ed5dd3
          python3 - <<'PY'
          import base64, subprocess, zlib
          packed = ''
          patch = zlib.decompress(base64.b64decode(packed, validate=True))
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          expected = {
              '.github/CI_QUALITY.md': '4cf08437c8bbe9500a978a8b00ac8452fa19b089',
              '.github/workflows/ci.yml': '04283e5301402e669ef0e1a57a1d58607aeda2fc',
              'apps/api-go/go.sum': '041a23a6ed0c25ecfd50c5bbba211b03f57ea40b',
              'apps/api-go/service/text_quota_missing_usage_test.go': '6185843c7424b58dc5710bbade3f9a9d25d32f55',
              'apps/web/src/components/brand-logo-recovery.test.tsx': '8f98acda1b5c411346c961c45e337b0d3aa87ccb',
              'apps/web/src/components/brand-logo.tsx': 'fa3c4160f87e553401a78aede6a1f4ee1ecd39ad',
              'apps/web/src/components/lmm-brand-mark.tsx': '9d1cbed812c580d3318d847643c0747c6581df30',
              'apps/web/src/features/assistant/assistant-panel.test.tsx': 'd53d5882b8bc7b66bd52cff1aa1414b0185efc76',
              'apps/web/src/features/assistant/assistant-panel.tsx': 'a541a7fd3b5cacdf91b3d51c7f2478e50dfe9296',
              'apps/web/src/features/forge/forge-public-shell.tsx': '53593175bf5a30319fc4b68d417dc194c22898ca',
              'apps/web/src/features/home/VISUAL-REVIEW.md': '28f188f0d83a65fe8493b66cee88b375567abb31',
              'scripts/check-go-format.sh': 'affbdbd6941d9daf23cfb48b88ec770d7e36c1a6',
              'scripts/check-static-go-binary.sh': 'c434d3bfe601d2cf849eabd1cf611b8484601b98',
              'scripts/ci_quality_gate.py': '7de49cc4424e4fb52fa1fddd8ad2fce2a11e954d',
              'scripts/test_ci_quality_gate.py': 'c4dd1b5643416c838f11857a9ec3a8d83519da1c',
          }
          for path, sha in expected.items():
              kind = subprocess.check_output(['git', 'cat-file', '-t', sha], text=True).strip()
              if kind != 'blob':
                  raise SystemExit(f'Not a blob: {path}')
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', f'100644,{sha},{path}'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != '7040d4b1fefc50f4d3c0fe705641e517340271f6':
              raise SystemExit(f'Refusing unreviewed tree: {tree}')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print(f'Exact reviewed tree: {tree}')
          PY
      - name: Publish an isolated candidate without overwriting concurrent branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=ci/reviewed-integration-20260916-1340
          test -z "$(git ls-remote origin "refs/heads/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          test "$tree" = 7040d4b1fefc50f4d3c0fe705641e517340271f6
          commit=$(printf '%s\n' 'merge: preserve concurrent integration, current CI fixes and registration regressions' '' 'Retain xAI parity, production acceptance, motion lifecycle and serial web runner from 93ebc064. Add current logo recovery, 28-test CI guard suite and both registration-state refresh and legacy-token regression tests. Preserve original PR ancestry and main. No temporary repair workflows, forced pushes or relaxed gates. Local validation: 13 motion/static tests, 28 CI gate tests and 8 public acceptance harness tests passed; complete current-head CI remains required.' | git commit-tree "$tree" -p 93ebc0644874ef71bfc9639e9140bf0b7c1e3bed -p e11985a8af7a75572af49c65b7b9a1d2fea7d73f -p 7201650fc6742043e3d6cd436cc9d45c57ed5dd3)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push origin "$commit:refs/heads/$target"
          printf 'Candidate: `%s`\nTree: `%s`\n' "$commit" "$tree" >> "$GITHUB_STEP_SUMMARY"
