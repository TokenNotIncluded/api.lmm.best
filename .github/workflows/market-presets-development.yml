name: Marketplace development source

on:
  push:
    branches: [codex/market-provider-presets-20261009]
    paths: [.github/workflows/market-presets-development.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-development-source
          path: source.tar.gz
          retention-days: 1
