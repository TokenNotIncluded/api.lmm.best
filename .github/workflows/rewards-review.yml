name: Rewards review
on:
  push:
    branches: [fix/referral-stages-weekly-coupons]
    paths: ['.github/workflows/rewards-review.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apply-reviewed-patch:
    if: github.ref == 'refs/heads/fix/referral-stages-weekly-coupons'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: apply
        name: Apply the reviewed follow-up patch
        run: |
          set -euo pipefail
          if test -f .github/rewards-followup.diff; then
            echo '92a11a31b5f1f44db176e65eda58f3fb4ba42e0e55379c6dfce2ecb58a392be7  .github/rewards-followup.diff' | sha256sum -c -
            git apply --unidiff-zero --check .github/rewards-followup.diff
            git apply --unidiff-zero .github/rewards-followup.diff
            rm .github/rewards-followup.diff
            git add apps/api-go apps/web .github/rewards-followup.diff
            git diff --cached --check
            git config user.name 'LIghtJUNction'
            git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
            git commit -m 'fix: migrate unpaid referral orders and validate reward views'
            git push origin HEAD:refs/heads/fix/referral-stages-weekly-coupons
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend:
    needs: apply-reviewed-patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      TEST_POSTGRES_DSN: postgres://reward_test:reward_test@localhost:5432/reward_test?sslmode=disable
      TEST_POSTGRES_ISOLATED_SCHEMA: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reward_test
          POSTGRES_PASSWORD: reward_test
          POSTGRES_DB: reward_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply-reviewed-patch.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Referral, coupon and assistant regression tests
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go test -json -p 2 -count=1 ./model ./controller -run 'Test.*(Referral|WeeklyDiscount|Coupon|Invitation|Registration|Promotion|AssistantCurrency|AssistantGift)' | tee "$RUNNER_TEMP/rewards-go.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewards-backend-results
          path: ${{ runner.temp }}/rewards-go.jsonl
          retention-days: 3
  frontend:
    needs: apply-reviewed-patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply-reviewed-patch.outputs.revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend type check
        working-directory: apps/web
        run: bun run typecheck
      - name: Reward settings regression
        if: success() || failure()
        working-directory: apps/web
        run: bun test --preload ./scripts/test-preload.mjs --timeout 15000 ./src/features/system-settings/general/quota-settings-section.test.tsx
      - name: Reward card regression
        if: success() || failure()
        working-directory: apps/web
        run: bun test --preload ./scripts/test-preload.mjs --timeout 15000 ./src/features/wallet/components/affiliate-rewards-card.test.tsx
      - name: Reward history regression
        if: success() || failure()
        working-directory: apps/web
        run: bun test --preload ./scripts/test-preload.mjs --timeout 15000 ./src/features/wallet/components/referral-history-dialog.test.tsx
