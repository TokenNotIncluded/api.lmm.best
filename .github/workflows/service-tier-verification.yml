name: Service tier verification
on:
  push:
    branches: [fix/service-tier-safe-pricing]
permissions:
  contents: read
concurrency:
  group: service-tier-feature-verification
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/fix/service-tier-safe-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply reviewed feature integrations
        run: |
          set -euo pipefail
          if [[ -f .service-tier-integrations.patch ]]; then
            git apply --check .service-tier-integrations.patch
            git apply .service-tier-integrations.patch
            rm .service-tier-integrations.patch
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('.service-tier-locales.json')
          if source.exists():
              additions = json.loads(source.read_text())
              for path in Path('apps/web/src/i18n/locales').glob('*.json'):
                  data = json.loads(path.read_text())
                  for key, zh in additions.items():
                      data['translation'].setdefault(key, zh if path.stem == 'zh' else key)
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
              source.unlink()
          PY
          git diff --name-only 5d640b70752a8ed6b28c44f2a013ec3bda866402 -- '*.go' | xargs -r gofmt -w
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt
          rustfmt +1.91.0 --edition 2024 apps/api-rust/src/routes/relay_openai.rs
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
      - name: Commit only feature files to the isolated branch
        id: commit
        run: |
          set -euo pipefail
          git diff --check
          git add apps/api-go apps/api-rust/src/routes/relay_openai.rs apps/api-rust/src/routes/relay_openai/service_tier.rs apps/web/src/features/system-settings/models apps/web/src/i18n/locales docs/service-tier-pricing.md
          git add -u -- .service-tier-integrations.patch .service-tier-locales.json || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: integrate guarded service-tier pricing and shared settings'
            git push origin HEAD:refs/heads/fix/service-tier-safe-pricing
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD > /tmp/service-tier-tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: service-tier-tested-source
          path: /tmp/service-tier-tested-source.tar.gz
          retention-days: 1
  go:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify domain and request boundary under race detector
        working-directory: apps/api-go
        run: go test -race ./pkg/servicetier ./relay/helper ./relay/common
      - name: Verify affected billing and relay callers
        working-directory: apps/api-go
        run: go test ./relay/channel/... ./relay ./service ./controller ./setting/... ./types
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lmm/web typecheck
      - working-directory: apps/web
        run: bun test --preload ./scripts/test-preload.mjs src/features/system-settings/models/service-tier-api.test.ts
      - run: bun run --filter @lmm/web lint
  rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal
      - working-directory: apps/api-rust
        run: cargo +1.91.0 test --locked -p lmm-api-rs routes::relay_openai::service_tier --lib
