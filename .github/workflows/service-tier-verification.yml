name: Service tier verification
on:
  push:
    branches: [fix/service-tier-safe-pricing]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public pricing documentation
        run: |
          mkdir -p /tmp/tier-docs
          curl --fail --silent --show-error --max-time 30 https://developers.openai.com/api/docs/pricing.md -o /tmp/tier-docs/pricing.md
          curl --fail --silent --show-error --max-time 30 https://developers.openai.com/api/docs/models/gpt-6-astra.md -o /tmp/tier-docs/model.md
      - uses: actions/upload-artifact@v4
        with:
          name: tier-docs
          path: /tmp/tier-docs
          retention-days: 1
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - run: go test ./relay/helper ./relay/common ./setting/... ./types
        working-directory: apps/api-go
