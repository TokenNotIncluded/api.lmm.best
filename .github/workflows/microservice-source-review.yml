name: Microservice source review
on:
  push:
    branches: [work/microservice-docs-review-20261010]
    paths: [.github/workflows/microservice-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72667564c0431754d4856dc2e0db55f360bd2745
          persist-credentials: false
      - name: Export tracked source only
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/microservice-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/tested-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: microservice-source-72667564
          path: |
            ${{ runner.temp }}/microservice-source.tar.gz
            ${{ runner.temp }}/tested-sha.txt
          retention-days: 1
          if-no-files-found: error
