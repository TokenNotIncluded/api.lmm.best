name: L0 final source review
on:
  push:
    branches: [work/l0-l1-integration-20261009]
    paths: [.github/workflows/l0-final-review.yml]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: candidate
          ref: f32e6ee949a66089a3ba91857d568d00f2327164
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Finish copy and keep unrelated dashboard source unchanged
        working-directory: candidate
        env:
          L0_REPO: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l0-final"
          python3 ../transport/.review/finalize-l0.py
          bun install --frozen-lockfile
          (cd apps/web && bun run format)
          git restore --source=18a92dd49b1a7eda470bd27dd5d649699c45f785 --staged --worktree -- apps/web/src/features/dashboard/dashboard-editorial.css apps/web/src/features/dashboard/index.tsx apps/web/src/features/dashboard/lib/model-usage.test.ts apps/web/src/features/dashboard/model-usage-i18n.ts
          git add apps/web/src/features/onboarding apps/web/src/i18n/locales
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove stale review translations and keep L0 upgrade changes scoped'
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/l0-final/commit.txt"
          git diff 18a92dd49b1a7eda470bd27dd5d649699c45f785 --stat > "$RUNNER_TEMP/l0-final/stat.txt"
          git diff 18a92dd49b1a7eda470bd27dd5d649699c45f785 --binary > "$RUNNER_TEMP/l0-final/final.patch"
          test "$(git rev-parse HEAD:apps/api-go)" = "$(git rev-parse f32e6ee949a66089a3ba91857d568d00f2327164:apps/api-go)"
          git push origin "HEAD:refs/heads/work/l0-l1-final-${{ github.run_id }}"
          git bundle create "$RUNNER_TEMP/l0-final/final.bundle" HEAD ^f32e6ee949a66089a3ba91857d568d00f2327164
      - name: Verify changed-file format without altering unrelated main formatting
        working-directory: candidate
        run: |
          set -euo pipefail
          (cd apps/web && bun run format) > "$RUNNER_TEMP/l0-final/format.log" 2>&1
          git diff --name-only > "$RUNNER_TEMP/l0-final/baseline-format.txt"
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={f'apps/web/src/features/dashboard/{p}' for p in ['dashboard-editorial.css','index.tsx','lib/model-usage.test.ts','model-usage-i18n.ts']}
          assert actual == expected, actual
          subprocess.run(['git','restore','--worktree','--',*sorted(actual)],check=True)
          PY
          test -z "$(git status --porcelain)"
      - name: Check types, lint, copyright, build and focused regressions
        working-directory: candidate/apps/web
        run: |
          set -uo pipefail
          failures=0
          for check in typecheck lint copyright:check build bundle:check; do
            bun run "$check" > "$RUNNER_TEMP/l0-final/${check//:/-}.log" 2>&1 || failures=$((failures+1))
          done
          python3 - <<'PY' > "$RUNNER_TEMP/l0-final/web-tests.log" 2>&1
          from pathlib import Path
          import subprocess
          roots=['src/features/onboarding','src/features/assistant','src/features/todos','src/features/support-ticket','src/routes/_authenticated/todos','src/lib','src/stores']
          files=sorted({str(p) for root in roots for p in Path(root).rglob('*') if p.name.endswith(('.test.ts','.test.tsx'))})
          assert files
          failures=[]
          for p in files:
            result=subprocess.run(['bun','test','--preload',str(Path('scripts/test-preload.mjs').resolve()),'--timeout','15000',p])
            if result.returncode: failures.append(p)
          print('Test files:',len(files),'Failures:',failures,flush=True)
          assert not failures
          PY
          test "$?" -eq 0 || failures=$((failures+1))
          git diff --exit-code
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l0-final-reviewed-source
          path: ${{ runner.temp }}/l0-final
          retention-days: 3
