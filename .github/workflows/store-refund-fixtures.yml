name: Correct isolated store review fixtures
on:
  push:
    branches: [fix/store-claim-refund-sync-20261010]
    paths: ['.github/workflows/store-refund-fixtures.yml']
permissions:
  contents: read
jobs:
  fixtures:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/fix/store-claim-refund-sync-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - run: bun install --frozen-lockfile
      - name: Apply exact fixture changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, s.count(old))
              p.write_text(s.replace(old, new))
          replace('apps/web/src/features/forge/home-directory-gesture.test.ts',
              "options: ConstructorParameters<typeof view.WheelEvent>[1] = {},",
              "options: Omit<WheelEventInit, 'view'> = {},")
          replace('apps/web/src/features/forge/home-directory-gesture.test.ts',
              '    target.dispatchEvent(event)\n    return event',
              "    // Happy DOM omits wheel modifiers. Set the browser fields explicitly.\n    for (const key of ['ctrlKey', 'altKey', 'metaKey', 'shiftKey'] as const) {\n      Object.defineProperty(event, key, { value: options[key] ?? false })\n    }\n    target.dispatchEvent(event)\n    return event")
          replace('apps/web/src/features/store/interactions.test.tsx',
              "`/sign-in?redirect=${encodeURIComponent(window.location.pathname)}`",
              "`/sign-in?redirect=${encodeURIComponent(window.location.pathname)}&reauth=1`")
          replace('apps/web/scripts/store-refund-login-review.mjs',
              ".getByRole('link', { name: 'Sign in', exact: true })",
              ".locator('a[href^=\"/sign-in?redirect=\"]')")
          PY
      - name: Format changed fixtures
        working-directory: apps/web
        run: |
          PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" oxfmt -c .oxfmtrc.json --write src/features/forge/home-directory-gesture.test.ts scripts/store-refund-login-review.mjs
          git diff --check
      - name: Commit only tested-surface fixture corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --binary > "$RUNNER_TEMP/store-fixture-corrections.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/forge/home-directory-gesture.test.ts apps/web/src/features/store/interactions.test.tsx apps/web/scripts/store-refund-login-review.mjs
          git commit -m 'test(store): align account-return fixture and browser link selector'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin HEAD:refs/heads/fix/store-claim-refund-sync-20261010
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-fixture-corrections
          path: ${{ runner.temp }}/store-fixture-corrections.patch
          retention-days: 1
