name: Agent Rust SSE parity patch

on:
  push:
    branches:
      - agent/rust-sse-no-transform-291

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-sse-no-transform-291
          fetch-depth: 0

      - name: Apply parity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all_exact(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          openai = "apps/api-rust/src/routes/relay_openai.rs"
          replace_once(
              openai,
              '                .insert(header::CACHE_CONTROL, HeaderValue::from_static("no-cache"));',
              '                .insert(\n                    header::CACHE_CONTROL,\n                    HeaderValue::from_static("no-cache, no-transform"),\n                );',
          )
          replace_once(
              openai,
              '    copy_safe_headers(&result.headers, response.headers_mut());\n    attach_legacy_headers(state, request_id, &mut response);',
              '    copy_safe_headers(&result.headers, response.headers_mut());\n    enforce_sse_response_headers(&mut response);\n    attach_legacy_headers(state, request_id, &mut response);',
          )
          replace_once(
              openai,
              'fn copy_safe_headers(source: &HeaderMap, target: &mut HeaderMap) {',
              '''fn enforce_sse_response_headers(response: &mut Response) {
    let is_event_stream = response
        .headers()
        .get(header::CONTENT_TYPE)
        .and_then(|value| value.to_str().ok())
        .and_then(|value| value.split(';').next())
        .is_some_and(|value| value.trim().eq_ignore_ascii_case("text/event-stream"));
    if is_event_stream {
        response.headers_mut().insert(
            header::CACHE_CONTROL,
            HeaderValue::from_static("no-cache, no-transform"),
        );
        response.headers_mut().insert(
            HeaderName::from_static("x-accel-buffering"),
            HeaderValue::from_static("no"),
        );
    }
}

fn copy_safe_headers(source: &HeaderMap, target: &mut HeaderMap) {''',
          )

          anthropic = "apps/api-rust/src/routes/relay_anthropic_gemini.rs"
          replace_once(
              anthropic,
              'always applies its safe `Cache-Control: no-cache` policy.',
              'always applies its safe `Cache-Control: no-cache, no-transform` policy.',
          )
          replace_all_exact(
              anthropic,
              'HeaderValue::from_static("no-cache")',
              'HeaderValue::from_static("no-cache, no-transform")',
              2,
          )

          misc = "apps/api-rust/src/routes/relay_misc.rs"
          replace_once(
              misc,
              '''    {
        response.headers_mut().insert(
            header::HeaderName::from_static("x-accel-buffering"),
            header::HeaderValue::from_static("no"),
        );
    }
    response
}''',
              '''    {
        response.headers_mut().insert(
            header::CACHE_CONTROL,
            header::HeaderValue::from_static("no-cache, no-transform"),
        );
        response.headers_mut().insert(
            header::HeaderName::from_static("x-accel-buffering"),
            header::HeaderValue::from_static("no"),
        );
    }
    response
}''',
          )
          replace_once(
              misc,
              '        assert_eq!(response.headers()["x-accel-buffering"], "no");',
              '        assert_eq!(response.headers()[header::CACHE_CONTROL], "no-cache, no-transform");\n        assert_eq!(response.headers()["x-accel-buffering"], "no");',
          )

          openai_test = "apps/api-rust/tests/relay_openai.rs"
          replace_once(
              openai_test,
              '''    assert_eq!(
        response.headers()["x-accel-buffering"],
        "no",
        "streaming responses must opt out of reverse-proxy buffering"
    );''',
              '''    assert_eq!(
        response.headers()[header::CACHE_CONTROL],
        "no-cache, no-transform",
        "streaming responses must forbid intermediary transforms"
    );
    assert_eq!(
        response.headers()["x-accel-buffering"],
        "no",
        "streaming responses must opt out of reverse-proxy buffering"
    );''',
          )
          replace_once(
              openai_test,
              '    assert_eq!(response.headers()["x-accel-buffering"], "no");\n}\n\n#[tokio::test]\nasync fn invalid_token_failure_keeps_legacy_openai_error_shape()',
              '    assert_eq!(response.headers()[header::CACHE_CONTROL], "no-cache, no-transform");\n    assert_eq!(response.headers()["x-accel-buffering"], "no");\n}\n\n#[tokio::test]\nasync fn invalid_token_failure_keeps_legacy_openai_error_shape()',
          )

          anthropic_test = "apps/api-rust/tests/relay_anthropic_gemini.rs"
          text = Path(anthropic_test).read_text()
          count = text.count('response.headers()["cache-control"], "no-cache"')
          if count < 1:
              raise SystemExit(f"{anthropic_test}: expected cache-control SSE assertion")
          Path(anthropic_test).write_text(
              text.replace(
                  'response.headers()["cache-control"], "no-cache"',
                  'response.headers()["cache-control"], "no-cache, no-transform"',
              )
          )

          provider = "apps/api-rust/tests/behavior-oracle/fixtures/relay_openai_provider.py"
          replace_once(
              provider,
              'class Fixture(http.server.BaseHTTPRequestHandler):\n    def timeout_stream(self, request: Mapping[str, object]) -> None:',
              '''class Fixture(http.server.BaseHTTPRequestHandler):
    def header_stream(self) -> None:
        frame = b'data: {"id":"chatcmpl-header-fixture","choices":[{"delta":{"content":"hello"},"index":0}]}\\n\\ndata: [DONE]\\n\\n'
        self.send_response(200)
        self.send_header("content-type", "text/event-stream")
        # Deliberately conflict with the gateway policy: the relay must not
        # forward a cacheable/transformable SSE policy to its client.
        self.send_header("cache-control", "public, max-age=3600")
        self.send_header("x-request-id", "provider-header-stream")
        self.end_headers()
        try:
            self.wfile.write(frame)
            self.wfile.flush()
        except (BrokenPipeError, ConnectionResetError):
            pass

    def timeout_stream(self, request: Mapping[str, object]) -> None:''',
          )
          replace_once(
              provider,
              '''            if body.get("stream") and body.get("messages") in (
                [{"role": "user", "content": "relay-timeout:stream"}],''',
              '''            if body.get("stream") and body.get("messages") == [
                {"role": "user", "content": "relay-header:sse"}
            ]:
                self.header_stream()
                return
            if body.get("stream") and body.get("messages") in (
                [{"role": "user", "content": "relay-timeout:stream"}],''',
          )

          differential = "apps/api-rust/tests/behavior-oracle/tests/relay-openai-listener-differential.sh"
          replace_once(
              differential,
              '''call_multipart() {
  local engine=$1 name=$2 path=$3 token=${4:-} port prefix''',
              '''call_stream() {
  local engine=$1 name=$2 path=$3 body=$4 token=${5:-} port prefix
  [[ $engine == go ]] && port=$go_port || port=$rust_port
  prefix="$runtime/$engine.$name"
  curl -sS -D "$prefix.headers" -o "$prefix.body" -w '%{http_code}' -X POST \\
    -H 'content-type: application/json' -H 'accept: text/event-stream' \\
    ${token:+-H "authorization: Bearer $token"} --data-binary "$body" \\
    "http://127.0.0.1:$port$path" >"$prefix.status"
}

header_value() {
  local file=$1 name=$2
  awk -v wanted="${name,,}" '
    BEGIN { IGNORECASE=1 }
    index($0, ":") { key=$0; sub(/:.*/, "", key); if (tolower(key) == wanted) { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\\r$/, ""); print; exit } }
  ' "$file"
}

call_multipart() {
  local engine=$1 name=$2 path=$3 token=${4:-} port prefix''',
          )
          replace_once(
              differential,
              '''done

jq -s -e '
  length == 14''',
              '''done

stream_body='{"model":"gpt-test","stream":true,"messages":[{"role":"user","content":"relay-header:sse"}]}'
call_stream go stream-header /v1/chat/completions "$stream_body" sk-relayprobe
call_stream rust stream-header /v1/chat/completions "$stream_body" sk-relayprobe
diff -u "$runtime/go.stream-header.status" "$runtime/rust.stream-header.status"
diff -u "$runtime/go.stream-header.body" "$runtime/rust.stream-header.body"
for engine in go rust; do
  [[ $(header_value "$runtime/$engine.stream-header.headers" cache-control) == 'no-cache, no-transform' ]] || {
    echo "$engine SSE Cache-Control parity failure" >&2
    cat "$runtime/$engine.stream-header.headers" >&2
    exit 1
  }
  [[ $(header_value "$runtime/$engine.stream-header.headers" x-accel-buffering) == 'no' ]] || {
    echo "$engine SSE X-Accel-Buffering parity failure" >&2
    cat "$runtime/$engine.stream-header.headers" >&2
    exit 1
  }
done
cases=$((cases + 2))

jq -s -e '
  length == 16''',
          )
          replace_once(
              differential,
              '''  and (group_by(.path) | all(length == 2 and .[0].body == .[1].body and .[0].content_type == .[1].content_type))
' "$hits" >/dev/null

# Exercise the valid multipart branch''',
              '''  and (group_by(.path) | all(length == 2 and .[0].body == .[1].body and .[0].content_type == .[1].content_type))
' "$hits" >/dev/null

# Exercise the valid multipart branch''',
          )
          # The later provider-hit assertion includes the two new stream calls.
          replace_once(differential, '  length == 18\n  and all(.[];', '  length == 20\n  and all(.[];')
          replace_once(
              differential,
              'provider_hits:18,anonymous_and_valid_token_parity:true',
              'provider_hits:20,anonymous_and_valid_token_parity:true,sse_cache_control_no_transform_parity:true',
          )
          PY

      - name: Format and validate focused Rust slice
        run: |
          cargo fmt --manifest-path apps/api-rust/Cargo.toml --all
          cargo fmt --manifest-path apps/api-rust/Cargo.toml --all -- --check
          cargo test --manifest-path apps/api-rust/Cargo.toml -p lmm-api-rs --test relay_openai --test relay_anthropic_gemini
          cargo test --manifest-path apps/api-rust/Cargo.toml -p lmm-api-rs filtered_upstream_response
          python3 -m py_compile apps/api-rust/tests/behavior-oracle/fixtures/relay_openai_provider.py
          bash -n apps/api-rust/tests/behavior-oracle/tests/relay-openai-listener-differential.sh
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api-rust/src/routes/relay_openai.rs \
                  apps/api-rust/src/routes/relay_anthropic_gemini.rs \
                  apps/api-rust/src/routes/relay_misc.rs \
                  apps/api-rust/tests/relay_openai.rs \
                  apps/api-rust/tests/relay_anthropic_gemini.rs \
                  apps/api-rust/tests/behavior-oracle/fixtures/relay_openai_provider.py \
                  apps/api-rust/tests/behavior-oracle/tests/relay-openai-listener-differential.sh
          git diff --cached --quiet && { echo 'patch produced no changes' >&2; exit 1; }
          git commit -m '[agent-patched] fix(rust): match Go SSE no-transform headers'
          git push origin HEAD:agent/rust-sse-no-transform-291
