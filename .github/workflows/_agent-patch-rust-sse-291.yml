name: Agent Rust SSE parity patch

on:
  push:
    branches:
      - agent/rust-sse-no-transform-291

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-sse-no-transform-291
          fetch-depth: 0

      - name: Apply parity patch
        run: python3 scripts/ci/_agent_patch_rust_sse_291.py

      - name: Format and validate focused Rust slice
        run: |
          cargo fmt --manifest-path apps/api-rust/Cargo.toml --all
          cargo fmt --manifest-path apps/api-rust/Cargo.toml --all -- --check
          cargo test --manifest-path apps/api-rust/Cargo.toml -p lmm-api-rs --test relay_openai --test relay_anthropic_gemini
          cargo test --manifest-path apps/api-rust/Cargo.toml -p lmm-api-rs filtered_upstream_response
          python3 -m py_compile apps/api-rust/tests/behavior-oracle/fixtures/relay_openai_provider.py
          bash -n apps/api-rust/tests/behavior-oracle/tests/relay-openai-listener-differential.sh
          git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api-rust/src/routes/relay_openai.rs \
                  apps/api-rust/src/routes/relay_anthropic_gemini.rs \
                  apps/api-rust/src/routes/relay_misc.rs \
                  apps/api-rust/tests/relay_openai.rs \
                  apps/api-rust/tests/relay_anthropic_gemini.rs \
                  apps/api-rust/tests/behavior-oracle/fixtures/relay_openai_provider.py \
                  apps/api-rust/tests/behavior-oracle/tests/relay-openai-listener-differential.sh
          git diff --cached --quiet && { echo 'patch produced no changes' >&2; exit 1; }
          git commit -m '[agent-patched] fix(rust): match Go SSE no-transform headers'
          git push origin HEAD:agent/rust-sse-no-transform-291
