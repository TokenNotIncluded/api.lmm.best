name: Mobile workspace review

on:
  push:
    branches: [codex/mobile-immersive-settings]
    paths: [.github/workflows/mobile-workspace-review.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/mobile-immersive-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/mobile-immersive-settings
          fetch-depth: 0
      - name: Verify and apply the final reader patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code eef31587538775343db907ac23787da900e800d8 HEAD -- apps/web
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.review/reader.fixes').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd387f5ec1ae03e95b3fe2741686c8d261e676c7a0cca15e08830d06f8410dbfa'
          Path(os.environ['RUNNER_TEMP'], 'mobile.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/mobile.patch"
          git apply --index "$RUNNER_TEMP/mobile.patch"
          git diff --cached --name-only | grep -q '^apps/web/'
          if git diff --cached --name-only | grep -v '^apps/web/'; then exit 1; fi
          git diff --cached --check
      - name: Commit only the feature branch source changes
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): apply document spacing once and verify chapter density'
          git push origin HEAD:refs/heads/codex/mobile-immersive-settings
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  review:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        area: [quality, public, console]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Prepare review evidence
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-review"
          git rev-parse HEAD > "$RUNNER_TEMP/mobile-review/revision.txt"
      - name: Independent quality checks
        if: matrix.area == 'quality'
        shell: bash
        run: |
          failed=0
          for check in copyright:check lint typecheck test format:check; do
            if bun run --filter @lmm/web "$check" > "$RUNNER_TEMP/mobile-review/${check//:/-}.log" 2>&1; then
              printf '%s: PASS\n' "$check" | tee -a "$RUNNER_TEMP/mobile-review/quality.txt"
            else
              failed=1
              printf '%s: FAIL\n' "$check" | tee -a "$RUNNER_TEMP/mobile-review/quality.txt"
              tail -n 30 "$RUNNER_TEMP/mobile-review/${check//:/-}.log"
            fi
          done
          exit "$failed"
      - name: Prepare isolated browser tooling
        if: matrix.area != 'quality'
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/mobile-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build production public app and check bundle budget
        if: matrix.area == 'public'
        run: |
          bun run --filter @lmm/web build > "$RUNNER_TEMP/mobile-review/build.log" 2>&1
          bun run --filter @lmm/web bundle:check >> "$RUNNER_TEMP/mobile-review/build.log" 2>&1
      - name: Run responsive and touch assertions
        if: matrix.area != 'quality'
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/mobile-browser/node_modules/playwright/index.mjs
          MOBILE_REVIEW_OUTPUT: ${{ runner.temp }}/mobile-review
          REVIEW_AREA: ${{ matrix.area }}
        run: |
          if [ "$REVIEW_AREA" = console ]; then
            export MOBILE_CONSOLE_ORIGIN=http://127.0.0.1:4174
            export MOBILE_REVIEW_CASES=console
            LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$RUNNER_TEMP/mobile-review/server.log" 2>&1 &
            port=4174
          else
            bun run preview --port 4175 > "$RUNNER_TEMP/mobile-review/server.log" 2>&1 &
            port=4175
          fi
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 120); do
            if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/mobile-experience-review.mjs > "$RUNNER_TEMP/mobile-review/browser.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-${{ matrix.area }}-review
          path: ${{ runner.temp }}/mobile-review
          retention-days: 7
