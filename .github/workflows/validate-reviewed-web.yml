name: Read-only reviewed frontend validation

on:
  push:
    branches: [ci/source-snapshot-20260916-1322]
    paths: [.github/workflows/validate-reviewed-web.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1dc03f7a23c0d0ed31dfc19c0d16c9e37ee4cc85
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install exact workspace dependencies
        run: bun install --frozen-lockfile
      - name: Format with the repository's protected-header formatter
        run: |
          bun run --filter @lmm/web format
          git diff --check
          git diff --name-only > "$RUNNER_TEMP/formatted-paths.txt"
          test "$(cat "$RUNNER_TEMP/formatted-paths.txt")" = apps/web/src/components/brand-logo-recovery.test.tsx
          mkdir -p "$RUNNER_TEMP/web-format-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/web-format-evidence/base.txt"
          git diff --binary > "$RUNNER_TEMP/web-format-evidence/format.patch"
          cp apps/web/src/components/brand-logo-recovery.test.tsx "$RUNNER_TEMP/web-format-evidence/brand-logo-recovery.test.tsx"
          git bundle create "$RUNNER_TEMP/web-format-evidence/review.bundle" HEAD
          sha256sum "$RUNNER_TEMP/web-format-evidence/"* > "$RUNNER_TEMP/web-format-SHA256SUMS"
          mv "$RUNNER_TEMP/web-format-SHA256SUMS" "$RUNNER_TEMP/web-format-evidence/SHA256SUMS"
      - name: Upload exact formatting output and original source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-web-format-1dc03f7
          path: ${{ runner.temp }}/web-format-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Validate formatting and copyright
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
      - name: Lint and typecheck formatted candidate
        if: ${{ !cancelled() }}
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
      - name: Run complete frontend tests
        if: ${{ !cancelled() }}
        run: bun run --filter @lmm/web test
      - name: Build and validate unchanged production resource budgets
        if: ${{ !cancelled() }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
