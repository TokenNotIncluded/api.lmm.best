name: Format only HumanGrant source
on:
  push:
    branches: [feat/humangrant-main-20261012]
    paths: [.github/workflows/humangrant-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Format Go and app frontend with repository formatter
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w apps/api-go/service/humangrant.go
          (
            cd apps/web
            bun run format
          )
          git add apps/api-go/service/humangrant.go
          git add apps/web/src/features/auth/components/humangrant-button.tsx
          git add apps/web/src/features/auth/components/oauth-providers.tsx
          git add apps/web/src/features/system-settings/auth/humangrant-section.tsx
          git add apps/web/src/features/system-settings/auth/section-registry.tsx
          # Restore only formatter-induced, unrelated edits in this fresh runner.
          git restore --worktree -- apps/web
          git diff --cached --check
      - name: Commit formatted HumanGrant files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/humangrant-format.yml
          git diff --cached --check
          git commit -m 'style(auth): format HumanGrant files with repository tooling'
          git push origin HEAD:feat/humangrant-main-20261012
