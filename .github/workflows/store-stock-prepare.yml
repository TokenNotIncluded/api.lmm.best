name: Prepare reviewed stock fix files
on:
  push:
    branches: [review/store-stock-finish-20261010]
    paths: [.github/workflows/store-stock-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/review/store-stock-finish-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Prepare exact files and store content-addressed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_PREPARE_OUTPUT: ${{ runner.temp }}/stock-prepared
        run: |
          node scripts/prepare-stock-finish.mjs
          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          output = Path(os.environ['STOCK_PREPARE_OUTPUT'])
          entries = json.loads((output / 'manifest.json').read_text())
          with tarfile.open(output / 'prepared.tar.gz', 'w:gz') as archive:
              for entry in entries:
                  archive.add(entry['path'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-stock-files
          path: ${{ runner.temp }}/stock-prepared
          retention-days: 3
          if-no-files-found: error
