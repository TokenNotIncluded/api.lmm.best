name: Market OAuth baseline
on:
  push:
    branches: [review/market-oauth-20261010]
    paths: [.github/workflows/market-baseline-tmp.yml]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 11da1f1ccfb95558ae311f3292acf25de8829b87
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Existing market and OAuth regression tests
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          go test -json -p 2 ./oauthserver ./model ./service ./controller ./router ./middleware -run 'ToolMarket|MarketRemote|MarketProvider|OAuth|IdentityStorage' -count=1 -timeout=8m | tee "$RUNNER_TEMP/results/baseline.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-baseline-results
          path: ${{ runner.temp }}/results
          retention-days: 3
