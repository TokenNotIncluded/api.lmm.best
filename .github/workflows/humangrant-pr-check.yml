name: HumanGrant complete integration checks
on:
  push:
    branches: [feat/humangrant-main-20261012]
    paths: [.github/workflows/humangrant-pr-check.yml]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache: true
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify format, static checks, and all Go tests
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l humangrant/*.go model/humangrant.go router/humangrant.go service/humangrant.go)"
          go vet ./...
          go test -p 2 ./... -count=1
      - name: Verify HumanGrant browser proof
        run: node --test apps/api-go/humangrant/web/client.test.mjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, test, and build frontend
        run: |
          # Main contains unrelated pre-existing formatter findings; only task files were formatted.
          status=0
          bun run --filter @lmm/web lint || status=1
          bun run --filter @lmm/web typecheck || status=1
          bun run --filter @lmm/web test || status=1
          bun run --filter @lmm/web build || status=1
          bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh || status=1
          exit "$status"
