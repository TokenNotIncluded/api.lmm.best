name: Store integration review

on:
  push:
    branches: [codex/store-extore-native-import]
    paths: [.github/workflows/store-extore-review.yml]

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Apply reviewed source patch on this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/store-extore-native-import
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          repository = 'TokenNotIncluded/api.lmm.best'
          blobs = ['00056251a8a0d0043388bf74cacb5e5706fc23ef', 'd727c2b6d301a04d16bdf958e70247cc8ab111dc', 'c573a3fd4379a6237aed52942e860ac46ba27df0']
          parts = []
          for sha in blobs:
              response = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/git/blobs/{sha}']))
              parts.append(base64.b64decode(response['content']))
          encoded = b''.join(parts)
          assert hashlib.sha256(encoded).hexdigest() == 'e7fd7d4650c4798efb23a2961de24561ed2611a9846da6a0239c797dc88ab492'
          patch = pathlib.Path('/tmp/store-extore.patch')
          patch.write_bytes(lzma.decompress(base64.b64decode(encoded, validate=True)))
          allowed = ('apps/api-go/', 'apps/web/src/features/store/', 'apps/web/src/i18n/locales/', 'docs/development/store-extore-import.md')
          rows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()
          assert len(rows) == 24
          assert all(row.split('\t')[-1].startswith(allowed) for row in rows)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          PY
          git diff --check
          git add apps/api-go apps/web/src/features/store apps/web/src/i18n/locales/en.json apps/web/src/i18n/locales/zh.json docs/development/store-extore-import.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(store): simplify storefront and add native Extore catalog import'
          git push origin HEAD:refs/heads/codex/store-extore-native-import
          git rev-parse HEAD > "$RUNNER_TEMP/store-tested-commit.txt"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify Extore and existing store backend paths
        shell: bash
        working-directory: apps/api-go
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go test -p 2 ./internal/extore ./controller ./service ./router -run 'Extore|MerchantStore|ProtectedFetch' -count=1 -timeout=240s 2>&1 | tee "$RUNNER_TEMP/store-backend-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-backend-verification
          path: |
            ${{ runner.temp }}/store-backend-tests.log
            ${{ runner.temp }}/store-tested-commit.txt
          retention-days: 3
