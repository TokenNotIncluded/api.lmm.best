name: Store integration review

on:
  push:
    branches: [codex/store-extore-native-import]
    paths: [.github/workflows/store-extore-review.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked review dependencies
        run: bun install --frozen-lockfile
      - name: Export local test runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/store-review"
          tar -czf "$RUNNER_TEMP/store-review/node-runtime.tar.gz" node_modules apps/web/node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/store-review/bun"
      - uses: actions/upload-artifact@v4
        with:
          name: store-review-runtime
          path: ${{ runner.temp }}/store-review
          retention-days: 1
      - name: Run existing store tests serially
        shell: bash
        working-directory: apps/web
        run: |
          set -o pipefail
          failed=0
          for test in src/features/store/*.test.ts src/features/store/*.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./$test" >> "$RUNNER_TEMP/store-baseline.log" 2>&1 || failed=1
          done
          tail -40 "$RUNNER_TEMP/store-baseline.log"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-review-baseline
          path: ${{ runner.temp }}/store-baseline.log
          retention-days: 1
