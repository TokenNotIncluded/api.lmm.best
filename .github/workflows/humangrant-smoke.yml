name: HumanGrant focused release validation
on:
  push:
    branches: [feat/humangrant-main-20261012]
    paths: [.github/workflows/humangrant-smoke.yml]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache: true
          cache-dependency-path: apps/api-go/go.sum
      - name: Compile and test auth, router, model and service
        working-directory: apps/api-go
        run: |
          go vet ./humangrant ./model ./service ./middleware ./router
          go test -p 2 ./humangrant ./model ./service ./middleware ./router -count=1
      - name: Browser protocol and JS safety tests
        run: node --test apps/api-go/humangrant/web/client.test.mjs
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Frontend lint
        run: bun run --filter @lmm/web lint
      - name: Frontend types
        run: bun run --filter @lmm/web typecheck
      - name: Build production frontend
        run: bun run --filter @lmm/web build
      - name: Verify frontend API path map
        run: bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh
