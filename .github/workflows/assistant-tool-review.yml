name: Assistant tool review
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lmm/web typecheck
      - name: Assistant baseline tests
        working-directory: apps/web
        run: |
          while IFS= read -r file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" || exit 1
          done < <(find src/features/assistant src/features/system-settings src/features/dashboard -name '*.test.ts' -o -name '*.test.tsx' | sort)
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Assistant baseline tests
        working-directory: apps/api-go
        env:
          GOMAXPROCS: '2'
        run: go test -p 2 ./setting ./model ./controller -run 'TestAssistant|TestWeeklyDiscount|TestNewUserGift' -count=1
