name: Assistant tool review
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
    paths: ['.github/workflows/assistant-tool-review.yml', '.review/assistant-workspace/ready.json']
permissions:
  contents: read
concurrency:
  group: assistant-workspace-review
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          python3 .review/assistant-workspace/recover.py
          python3 .review/assistant-workspace/finish.py
          python3 .review/assistant-workspace/finish-post.py
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Generate contracts and format changed Go sources
        run: |
          cd apps/api-go
          go generate ./controller
          cd ../..
          git diff --name-only --diff-filter=ACM HEAD -- apps/api-go | grep '\.go$' | xargs -r gofmt -w
      - name: Assistant and market regression tests
        working-directory: apps/api-go
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          go test -json -p 2 ./setting ./model ./controller -run 'TestAssistant|TestWeeklyDiscount|TestNewUserGift|TestToolMarket' -count=1 2>&1 | tee /tmp/go-tests.log
      - name: Export Go source and logs
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp /tmp/go-tests.log /tmp/evidence/ 2>/dev/null || true
          git add -N apps/api-go
          git diff --full-index HEAD -- apps/api-go > /tmp/evidence/go-source.patch
          sha256sum /tmp/evidence/go-source.patch > /tmp/evidence/go-source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-go-review
          path: /tmp/evidence/
          retention-days: 3
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          python3 .review/assistant-workspace/recover.py
          python3 .review/assistant-workspace/finish.py
          python3 .review/assistant-workspace/finish-post.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Format and check frontend
        working-directory: apps/web
        run: |
          set -o pipefail
          node scripts/add-missing-keys.mjs --assistant-workspace-only
          bun run i18n:sync 2>&1 | tee /tmp/web-i18n.log
          bun run format 2>&1 | tee /tmp/web-format.log
          mapfile -t changed < <(git diff --name-only --diff-filter=ACM HEAD -- src scripts | sed 's#^apps/web/##' | grep -E '\.(tsx?|mjs)$')
          if ((${#changed[@]})); then
            bunx --no-install oxlint -c .oxlintrc.json --fix "${changed[@]}"
          fi
          bun run format >> /tmp/web-format.log 2>&1
          bun run copyright:check 2>&1 | tee /tmp/web-copyright.log
          bun run typecheck 2>&1 | tee /tmp/web-typecheck.log
          bun run lint 2>&1 | tee /tmp/web-lint.log
      - name: Frontend regression tests
        working-directory: apps/web
        run: |
          set -o pipefail
          failed=0
          while IFS= read -r file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" >> /tmp/web-tests.log 2>&1 || failed=1
          done < <(find src/features/assistant src/features/system-settings src/features/dashboard -name '*.test.ts' -o -name '*.test.tsx' | sort)
          tail -n 80 /tmp/web-tests.log
          exit "$failed"
      - name: Production build
        working-directory: apps/web
        run: |
          bun run build 2>&1 | tee /tmp/web-build.log
          bun run bundle:check 2>&1 | tee /tmp/web-bundle.log
      - name: Export frontend source and logs
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp /tmp/web-*.log /tmp/evidence/ 2>/dev/null || true
          git add -N apps/web/src apps/web/scripts docs
          git diff --full-index HEAD -- apps/web/src apps/web/scripts docs > /tmp/evidence/web-source.patch
          sha256sum /tmp/evidence/web-source.patch > /tmp/evidence/web-source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-web-review
          path: /tmp/evidence/
          retention-days: 3
