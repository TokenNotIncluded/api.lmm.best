name: Assistant tool review
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
    paths: ['.github/workflows/assistant-tool-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/assistant-source
          git archive 7ccd63413cba38b5212c416bba69c12c7e4a7638 | gzip > /tmp/assistant-source/main.tar.gz
          git archive HEAD .review | gzip > /tmp/assistant-source/review.tar.gz
          git diff ed3cb848c733c7ba16704f6ef964cecd132bf686 7ccd63413cba38b5212c416bba69c12c7e4a7638 -- apps/api-go apps/web/src > /tmp/assistant-source/main-changes.patch
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-recovery-source
          path: /tmp/assistant-source/
          retention-days: 2
