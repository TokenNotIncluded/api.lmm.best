name: Market OAuth isolated review
on:
  push:
    branches: [review/market-oauth-20261010]
    paths: [.github/workflows/market-review-tmp.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect source and exact merge diagnostics
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-source"
          git rev-parse origin/main > "$RUNNER_TEMP/market-source/main-sha.txt"
          git archive --format=tar.gz origin/main > "$RUNNER_TEMP/market-source/main.tar.gz"
          git archive --format=tar.gz adfa2a7f8eef84c992fa776eaf2bb3bd54cb62a3 > "$RUNNER_TEMP/market-source/pr670.tar.gz"
          git merge-base origin/main adfa2a7f8eef84c992fa776eaf2bb3bd54cb62a3 > "$RUNNER_TEMP/market-source/base-sha.txt"
          git archive --format=tar.gz "$(cat "$RUNNER_TEMP/market-source/base-sha.txt")" > "$RUNNER_TEMP/market-source/base.tar.gz"
          git merge-tree --write-tree origin/main adfa2a7f8eef84c992fa776eaf2bb3bd54cb62a3 > "$RUNNER_TEMP/market-source/merge.txt" || test "$?" = 1
          tree=$(head -n 1 "$RUNNER_TEMP/market-source/merge.txt")
          git archive --format=tar.gz "$tree" > "$RUNNER_TEMP/market-source/merge.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-source-review
          path: ${{ runner.temp }}/market-source
          retention-days: 1
