name: Rust RSA remediation once

on: push

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/codex/rust-rustsec-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/rust-rustsec-audit
          fetch-depth: 0

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
          rustup default 1.91.0
          rustc --version --verbose

      - name: Apply, verify, and commit remediation
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: bash .github/scripts/rust-rsa-remediation-once.sh
