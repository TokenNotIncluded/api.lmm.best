name: Prepare reviewed integration

on:
  push:
    branches: [review/upstream-migration-1834]
    paths: [.github/workflows/prepare-reviewed-integration.yml]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 4d0cc1dfa54499260f454e9ec43ed1f26dd691a6
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce exact reviewed upstream and fork reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cp .github/review/reconcile-upstream.py "$RUNNER_TEMP/reconcile-upstream.py"
          git fetch --no-tags origin '+refs/pull/346/head:refs/remotes/review/346'
          test "$(git rev-parse refs/remotes/review/346)" = 69f86afe8060d4c06bf87e4261dbb49298b003ae
          git checkout --detach 3530a14230bc5fa74b12a448077cf20bfd6c4090
          git config user.name LIghtJUNction
          git config user.email lightjunction.me@gmail.com
          if git merge --no-commit --no-ff 69f86afe; then
            echo 'Expected reviewed conflicts were absent' >&2
            exit 1
          fi
          python3 -B "$RUNNER_TEMP/reconcile-upstream.py"
          test "$(git write-tree)" = b04e9d52997a11f2c3e1a428f5fb17da048fcec3
      - name: Run migration contracts without production access
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test-server-ops.py
          python3 -B scripts/test-server-repair-startup.py
          python3 -B scripts/test-server-ops-commit-request.py
          python3 -B -m unittest discover -s scripts -p test_ci_quality_gate.py
          node --test scripts/workflow-topology.test.mjs
          git diff --check
          git diff --cached --check
      - name: Store immutable reviewed Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, subprocess
          from pathlib import Path
          repo = 'TokenNotIncluded/api.lmm.best'
          def api(endpoint, payload):
              result = subprocess.run(['gh','api','--method','POST',f'repos/{repo}/git/{endpoint}','--input','-'], input=json.dumps(payload), capture_output=True, text=True, check=True, timeout=30)
              return json.loads(result.stdout)
          entries=[]
          paths=subprocess.check_output(['git','diff','--cached','--name-only','HEAD'],text=True).splitlines()
          for path in paths:
              record=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()
              if not record:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              mode, expected, stage = record[:3]
              assert stage == '0' and mode in ('100644','100755'), path
              blob=api('blobs',{'content':Path(path).read_text(),'encoding':'utf-8'})
              assert blob['sha'] == expected, path
              entries.append({'path':path,'mode':mode,'type':'blob','sha':expected})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=api('trees',{'base_tree':base,'tree':entries})
          assert tree['sha']=='b04e9d52997a11f2c3e1a428f5fb17da048fcec3',tree['sha']
          print('Stored reviewed tree:',tree['sha'])
          print('No branch, PR, tag, release, server or production setting was changed.')
          PY
