name: Prepare reviewed integration

on:
  push:
    branches: [release/acceptance-20260916]
    paths: [.github/workflows/prepare-reviewed-integration.yml]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 47087d37408919526945a5ef18941f75fc4e0719
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the locally reviewed upstream and fork merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/release-review/prepare-pr346.py)" = 6f44f48ddaa72a56cd4a26f6b556df41356d2402
          cp .github/release-review/prepare-pr346.py /tmp/prepare-pr346.py
          git fetch --no-tags origin '+refs/pull/346/head:refs/remotes/review/346'
          test "$(git rev-parse refs/remotes/review/346)" = 69f86afe8060d4c06bf87e4261dbb49298b003ae
          git checkout --detach 3530a14230bc5fa74b12a448077cf20bfd6c4090
          git config user.name LIghtJUNction
          git config user.email lightjunction.me@gmail.com
          if git merge --no-commit --no-ff refs/remotes/review/346; then
            echo 'Expected conflicts were absent; review the inputs again.' >&2
            exit 1
          fi
          python3 /tmp/prepare-pr346.py
          git diff --check
          git diff --cached --check
          test "$(git write-tree)" = 84c7e50527564428ad31f16909db2ca3140b6cde
      - name: Run migration, authorization and release acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-server-ops.py
          python3 scripts/test-server-ops-commit-request.py
          python3 scripts/test-server-repair-startup.py
          python3 -B -m unittest discover -s scripts -p test_ci_quality_gate.py
          python3 -B -m unittest discover -s scripts -p test_release_work_items.py
          python3 -B -m unittest discover -s scripts -p test_public_production.py
          node --test scripts/workflow-topology.test.mjs
          node --test scripts/check-i18n.test.mjs
          test "$(git write-tree)" = 84c7e50527564428ad31f16909db2ca3140b6cde
      - name: Store reviewed Git blobs and tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repository = os.environ['REPOSITORY']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repository}/git/{path}', '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True, timeout=30)
              return json.loads(result.stdout)
          assert git('write-tree') == '84c7e50527564428ad31f16909db2ca3140b6cde'
          paths = git('diff', '--cached', '--name-only', 'HEAD').splitlines()
          assert len(paths) == 16, paths
          entries = []
          for path in paths:
              record = git('ls-files', '--stage', '--', path)
              if not record:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, stage = record.split('\t', 1)[0].split()
              assert stage == '0' and mode in ('100644','100755'), record
              text = subprocess.check_output(['git','show',':'+path], text=True)
              blob = api('blobs', {'content': text, 'encoding': 'utf-8'})
              assert blob['sha'] == expected, path
              entries.append({'path':path, 'mode':mode, 'type':'blob','sha':blob['sha']})
          tree = api('trees', {'base_tree':'04df6d82781f00cc862ee70e15f7c13c95b0b8cf','tree':entries})
          assert tree['sha'] == '84c7e50527564428ad31f16909db2ca3140b6cde'
          print('Reviewed source tree:',tree['sha'])
          print('No branch, release, production service, credential or transaction changed.')
          PY
