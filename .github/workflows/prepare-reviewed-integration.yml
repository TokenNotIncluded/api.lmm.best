name: Prepare reviewed integration

on:
  push:
    branches: [review/upstream-migration-1834]
    paths: [.github/workflows/prepare-reviewed-integration.yml]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e37d1918c877eab853c5ee2dee1dcd8ca17bb145
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce both migration reviews and merged incident recovery
        shell: bash
        run: |
          set -euo pipefail
          cp .github/review/consolidate-migrations.py "$RUNNER_TEMP/consolidate-migrations.py"
          git checkout --detach f34fbe6a8b71e1312372814cbab60bb9f9a1ffcb
          git config user.name LIghtJUNction
          git config user.email lightjunction.me@gmail.com
          python3 -B "$RUNNER_TEMP/consolidate-migrations.py"
          test "$(git write-tree)" = a6a741c0fb49858a300d514549ed2c963a10728f
      - name: Run all targeted migration contracts without production access
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test-server-ops.py
          python3 -B scripts/test-server-repair-startup.py
          python3 -B scripts/test-server-ops-commit-request.py
          python3 -B scripts/test-server-ops-helper-payload.py
          python3 -B -m unittest discover -s scripts -p test_ci_quality_gate.py
          python3 -B scripts/test_release_work_items.py
          python3 -B scripts/test_public_production.py
          node --test scripts/workflow-topology.test.mjs
          node --test scripts/check-i18n.test.mjs
          git diff --check
          git diff --cached --check
      - name: Store immutable reviewed source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, subprocess
          from pathlib import Path
          repo='TokenNotIncluded/api.lmm.best'
          base='c54d399d08f2c1681cd1ea620eb367bff8711fdd'
          paths=subprocess.check_output(['git','diff','--cached','--no-renames','--name-only',base],text=True).splitlines()
          entries=[]
          for path in paths:
              record=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()
              if not record:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,expected,stage=record[:3]
              assert stage=='0' and mode in ('100644','100755'),path
              payload={'content':Path(path).read_text(),'encoding':'utf-8'}
              result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=json.dumps(payload),capture_output=True,text=True,check=True,timeout=30)
              assert json.loads(result.stdout)['sha']==expected,path
              entries.append({'path':path,'mode':mode,'type':'blob','sha':expected})
          print(json.dumps({'base':base,'expected_tree':'a6a741c0fb49858a300d514549ed2c963a10728f','entries':entries},indent=2))
          print('Only immutable source blobs stored. No branch, tag, release, secret or production operation changed.')
          PY
