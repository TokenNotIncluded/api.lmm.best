name: Isolated L0 welcome review
on:
  push:
    branches: [review/l0-welcome-free-chat]
permissions:
  contents: write
jobs:
  web-review:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/review/l0-welcome-free-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: review/l0-welcome-free-chat
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Establish baseline before editing
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/l0-review"
          if test ! -f src/features/onboarding/l0-upgrade-copy.test.ts; then
            failed=0
            for file in l0-paid-access.test.ts l0-paid-welcome.test.tsx getting-started.test.tsx; do
              bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/onboarding/$file" > "$RUNNER_TEMP/l0-review/baseline-$file.log" 2>&1 || failed=1
            done
            echo "Baseline exit: $failed" | tee "$RUNNER_TEMP/l0-review/baseline-result.txt"
          fi
      - name: Apply source change and update regressions and locale resources
        run: python3 scripts/prepare-l0-review.py
      - name: Save isolated review source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(web): clarify free onboarding and simplify mobile welcome'
            git push origin HEAD:refs/heads/review/l0-welcome-free-chat
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/l0-review/revision.txt"
          git diff --stat 4399bb60f22b7f18cc4a95c9c6cb6b4cb3c40873 -- apps/web > "$RUNNER_TEMP/l0-review/change-stat.txt"
          git diff 4399bb60f22b7f18cc4a95c9c6cb6b4cb3c40873 -- apps/web > "$RUNNER_TEMP/l0-review/source.patch"
      - name: Run onboarding regressions independently
        working-directory: apps/web
        run: |
          failed=0
          for file in l0-paid-access.test.ts l0-paid-welcome.test.tsx getting-started.test.tsx l0-upgrade-copy.test.ts; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/onboarding/$file" 2>&1 | tee "$RUNNER_TEMP/l0-review/$file.log" || failed=1
          done
          exit "$failed"
      - name: Lint
        if: success() || failure()
        run: bun run --filter @lmm/web lint 2>&1 | tee "$RUNNER_TEMP/l0-review/lint.log"
      - name: Type check
        if: success() || failure()
        run: bun run --filter @lmm/web typecheck 2>&1 | tee "$RUNNER_TEMP/l0-review/typecheck.log"
      - name: Build production frontend
        if: success() || failure()
        run: bun run --filter @lmm/web build 2>&1 | tee "$RUNNER_TEMP/l0-review/build.log"
      - name: Save source snapshot
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/l0-review"
          git archive --format=tar.gz -o "$RUNNER_TEMP/l0-review/source.tar.gz" HEAD apps/web package.json bun.lock
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-welcome-review
          path: ${{ runner.temp }}/l0-review
          retention-days: 7
          if-no-files-found: error
