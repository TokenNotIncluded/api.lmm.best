name: Settings design review

on:
  push:
    branches: [design/settings-workspace-20260922]

permissions:
  contents: write

concurrency:
  group: settings-design-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/settings-workspace-20260922
      - name: Import integrity-checked settings changes
        shell: bash
        run: |
          if [ -f .settings-review/part-1.txt ]; then
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(''.join(Path(f'.settings-review/part-{i}.txt').read_text() for i in range(1, 4))))
          assert hashlib.sha256(raw).hexdigest() == '81484bc63e66c874d50a130cf8196f2ac3254ca786fff00842444eb156736d8d', 'Transport integrity mismatch'
          prepared = []
          for change in json.loads(raw):
              path = Path(change['path'])
              assert str(path).startswith('apps/web/') and not path.is_absolute() and '..' not in path.parts
              old = path.read_text() if path.exists() else ''
              if change['sha256'] is None:
                  assert not path.exists(), f'New path exists: {path}'
              else:
                  assert hashlib.sha256(old.encode()).hexdigest() == change['sha256'], f'Base mismatch: {path}'
              lines = old.splitlines(keepends=True)
              for start, end, text in reversed(change['edits']):
                  lines[start:end] = [text]
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == change['result'], f'Result mismatch: {path}'
              prepared.append((path, new))
          for path, new in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(new)
          print(f'Applied {len(prepared)} verified frontend files')
          PY
          git add apps/web
          git rm -r .settings-review
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(web): redesign settings workspace with progressive forms and visual review'
          git push origin HEAD:refs/heads/design/settings-workspace-20260922
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:web
      - name: Settings regression tests
        working-directory: apps/web
        run: |
          bun test src/features/system-settings/content/assistant-settings-section.test.tsx
          bun test src/features/system-settings/components/settings-disclosure.test.tsx
      - name: Build
        run: bun run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Record real browser interactions
        run: |
          mkdir -p output/settings-review
          git rev-parse HEAD > output/settings-review/commit.txt
          python apps/web/scripts/visual-review/settings_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-visual-review
          path: output/settings-review
          retention-days: 7
