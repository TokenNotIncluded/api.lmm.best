name: Market native OAuth integration review
on:
  push:
    branches: [review/market-oauth-20261010]
    paths: [.github/workflows/market-verify-tmp.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply reviewed changes to the pinned integrated source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = review/market-oauth-20261010
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! test -f .market-review/applied; then
            git merge --no-commit --no-ff 11da1f1ccfb95558ae311f3292acf25de8829b87 || test "$?" = 1
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          path='apps/api-go/service/tool_market_paid_e2e_test.go'
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert conflicts == [path], conflicts
          q=Path(path);s=q.read_text()
          s=''.join(line for line in s.splitlines(keepends=True) if not line.startswith(('<<<<<<<','=======','>>>>>>>')))
          assert hashlib.sha256(s.encode()).hexdigest() == '358bce464a8bf28f40e98c6e39ac01b671ce04d45f13d9972382ce756768be13'
          q.write_text(s)
          subprocess.run(['git','add',path],check=True)
          PY
            git commit -m 'merge: retain current main while integrating marketplace OAuth'
            python3 .market-review/go-changes.py
            python3 .market-review/http-changes.py
            python3 .market-review/go-tests.py
            python3 .market-review/web-changes.py
            git add apps/api-go apps/web
            git diff --cached --name-only > .market-review/touched.txt
            while IFS= read -r path; do
              case "$path" in *.go) gofmt -w "$path";; esac
            done < .market-review/touched.txt
            touch .market-review/applied
          fi
      - name: Format only modified Web files with existing header protection
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          paths=[Path(p) for p in Path('.market-review/touched.txt').read_text().splitlines() if p.startswith('apps/web/') and p.endswith(('.ts','.tsx','.mjs'))]
          headers={}
          for p in paths:
              match=re.match(r'^/\*\nCopyright \(C\)[\s\S]*?QuantumNous[\s\S]*?\*/\n+',p.read_text())
              if match:
                  headers[p]=match.group(0)
                  p.write_text(p.read_text()[match.end():])
          try:
              subprocess.run(['bun','x','--no-install','oxfmt','--write',*[str(p.relative_to('apps/web')) for p in paths]],cwd='apps/web',check=True)
          finally:
              for p,header in headers.items(): p.write_text(header+p.read_text())
          PY
      - name: Save exact candidate commit
        id: commit
        run: |
          set -euo pipefail
          git add apps/api-go apps/web .market-review/applied .market-review/touched.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(tool-market): expose metamcp and support native browser OAuth clients'
          fi
          git push origin HEAD:refs/heads/review/market-oauth-20261010
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/candidate/commit.txt"
          git diff 11da1f1ccfb95558ae311f3292acf25de8829b87 -- apps docs .github/workflows/tool-market-provider-verify.yml > "$RUNNER_TEMP/candidate/changes.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/candidate/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-verified-candidate-source
          path: ${{ runner.temp }}/candidate
          retention-days: 3
  go:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOMAXPROCS: '2'
      OAUTH_SERVER_TEST_POSTGRES_DSN: postgres://market_test:isolated_test_only@127.0.0.1:5432/market_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Provider and OAuth core tests on SQLite and PostgreSQL
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          go test -json -p 2 ./internal/marketprovider ./oauthserver -count=1 -timeout=6m | tee "$RUNNER_TEMP/results/core-tests.json"
      - name: Marketplace and OAuth integration tests with vet
        if: always()
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          go test -json -p 2 ./model ./service ./controller ./router ./middleware -run 'ToolMarket|MarketRemote|MarketProvider|OAuth|IdentityStorage' -count=1 -timeout=8m | tee "$RUNNER_TEMP/results/integration-tests.json"
      - name: Build all Go packages
        if: always()
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go build -p 2 ./... 2>&1 | tee "$RUNNER_TEMP/results/go-build.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-native-go-results
          path: ${{ runner.temp }}/results
          retention-days: 3
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Web typecheck and all marketplace tests
        working-directory: apps/web
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          result=0
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/results/web-typecheck.txt" || result=1
          for test in src/features/tool-market/*.test.ts src/features/tool-market/*.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" >> "$RUNNER_TEMP/results/web-tests.txt" 2>&1 || result=1
          done
          cat "$RUNNER_TEMP/results/web-tests.txt"
          exit "$result"
      - name: Production Web build
        if: always()
        working-directory: apps/web
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$RUNNER_TEMP/results/web-build.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-native-web-results
          path: ${{ runner.temp }}/results
          retention-days: 3
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked application and isolated browser tooling
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/market-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/market-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile meta-tool and OAuth review
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/market-browser/node_modules/playwright/index.mjs
          CONSOLE_REVIEW_OUTPUT: ${{ runner.temp }}/market-browser-results
        run: |
          set -euo pipefail
          mkdir -p "$CONSOLE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$CONSOLE_REVIEW_OUTPUT/commit.txt"
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$CONSOLE_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/tool-market-provider-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-native-browser-results
          path: ${{ runner.temp }}/market-browser-results
          retention-days: 3
