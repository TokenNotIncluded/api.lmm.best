name: L1 cleanup final copy check
on:
  push:
    branches: [work/l1-cleanup-audit-20261009]
    paths: [.github/workflows/l1-cleanup-copy.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CI: 'true'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 58f25cbd4f1080d50a0be86e2ffe20d4c3c7f1c3
          fetch-depth: 0
      - name: Replace legacy recovery instructions, keep stable error-code compatibility
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          old='The AI recommendation expired. Ask the assistant to prepare it again, or continue editing it yourself.'
          new='Describe what you need. The assistant can enable L1 directly.'
          p=Path('apps/web/src/lib/server-error-message.ts');s=p.read_text()
          assert s.count(old)==2;s=s.replace(old,new)
          needle='  DEVELOPER_ACCESS_AI_CONFIRMATION_INVALID:'
          assert s.count(needle)==1
          s=s.replace(needle,"  DEVELOPER_ACCESS_LETTER_RETIRED:\n    '"+new+"',\n"+needle)
          p.write_text(s)
          p=Path('apps/web/src/lib/server-error-message.test.ts');s=p.read_text()
          start=s.index("  test('maps an expired AI recommendation to a recoverable edit path'")
          end=s.index('\n  })',start)+len('\n  })')
          s=s[:start]+"""  test('retired L1 errors point to current activation, never letter editing', () => {
            for (const code of [
              'DEVELOPER_ACCESS_LETTER_RETIRED',
              'DEVELOPER_ACCESS_AI_CONFIRMATION_INVALID',
              'DEVELOPER_ACCESS_AI_CONFIRMATION_MISMATCH',
            ]) {
              assert.equal(
                getServerErrorMessageKey({ response: { data: { code } } }),
                'Describe what you need. The assistant can enable L1 directly.'
              )
            }
          })"""+s[end:]
          p.write_text(s)
          retired=[
            'AI recommendation',
            'Submitting replaces this application and sends it for review again. The previous review note is cleared; the AI recommendation is retained.',
            old,
          ]
          for p in Path('apps/web/src/i18n/locales').glob('*.json'):
              s=p.read_text();before=json.loads(s)
              expected=json.loads(s)
              for key in retired:
                  assert key in expected['translation'],(p,key)
                  del expected['translation'][key]
                  pattern=r'^\s*'+re.escape(json.dumps(key,ensure_ascii=False))+r':.*\n'
                  s,count=re.subn(pattern,'',s,flags=re.M)
                  assert count==1,(p,key,count)
              assert json.loads(s)==expected,p
              p.write_text(s)
          p=Path('apps/web/src/features/users/components/retired-l1-surfaces.test.ts');s=p.read_text()
          needle="      'Recommendation letter',"
          assert s.count(needle)==1
          s=s.replace(needle,'\n'.join('      '+json.dumps(key,ensure_ascii=False)+',' for key in retired)+'\n'+needle)
          p.write_text(s)
          forbidden=re.compile(r'推荐信|申请信|recommendation.?letter|recommendation.?archive',re.I)
          remaining=[]
          for p in Path('apps/web/src').rglob('*'):
              if p.is_file() and p.suffix in ('.ts','.tsx','.json') and '.test.' not in p.name:
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      if forbidden.search(line):remaining.append(f'{p}:{i}: {line}')
          assert not remaining,'\n'.join(remaining)
          print('No retired letter or archive display copy remains in Web production sources or locales.')
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: |
          bun install --frozen-lockfile
          bun run --filter @lmm/web format
      - name: Save source-only candidate and prove backend unchanged
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git diff --check
          git diff --exit-code 58f25cbd4f1080d50a0be86e2ffe20d4c3c7f1c3 -- apps/api-go
          git diff > "$RUNNER_TEMP/evidence/final-copy.patch"
          git add apps/web/src/lib/server-error-message.ts apps/web/src/lib/server-error-message.test.ts apps/web/src/features/users/components/retired-l1-surfaces.test.ts apps/web/src/i18n/locales
          git config user.name 'LIghtJUNction'
          git config user.email '106986785+LIghtJUNction@users.noreply.github.com'
          git commit -m 'fix: remove remaining retired L1 recovery messages and translations'
          git push origin "HEAD:refs/heads/work/l1-cleanup-final-${GITHUB_RUN_ID}"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/revision.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/evidence/source.tar.gz"
          git diff --stat 43be129a2120254eac260f61fe60f22f09995b66 HEAD > "$RUNNER_TEMP/evidence/summary.txt"
      - name: Verify formatting, types, error handling, activation, todos, user management, and production output
        run: |
          set -euo pipefail
          {
            bun run --filter @lmm/web format:check
            bun run --filter @lmm/web copyright:check
            bun run --filter @lmm/web typecheck
            bun run --filter @lmm/web lint
            cd apps/web
            python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          selected=[]
          for p in Path('src').rglob('*'):
              path=str(p)
              if p.is_file() and (path.endswith('.test.ts') or path.endswith('.test.tsx')) and any(part in path for part in ['/features/assistant/','/features/onboarding/','/features/todos/','/features/users/','/features/system-settings/content/','/features/debug/','/lib/server-error-message','/lib/http-client','/lib/api-client','/lib/__tests__/console-activation','/features/webmcp/areas/auth-onboarding','/features/forge/forge-home']):selected.append(path)
          assert len(selected)>40,len(selected)
          failures=[]
          for path in sorted(selected):
              r=subprocess.run(['bun','test','--preload','./scripts/test-preload.mjs','--timeout','15000',path])
              if r.returncode:failures.append(path)
          report={'passed_files':len(selected)-len(failures),'failed':failures,'files':sorted(selected)}
          (Path(os.environ['RUNNER_TEMP'])/'evidence'/'tests.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2));assert not failures,failures
          PY
            cd ../..
            bun run --filter @lmm/web build
            bun run --filter @lmm/web bundle:check
          } 2>&1 | tee "$RUNNER_TEMP/evidence/checks.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-final-copy-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 3
