name: Overview pinned source snapshot
on:
  push:
    branches: [workbench/overview-tooling-20261009]
    paths: [.github/workflows/overview-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c9475c96b5a6d9601444cb9f2ccfbbfdc3b1f663
          persist-credentials: false
      - name: Archive source only; no tests, builds or deployment
        run: |
          mkdir -p "$RUNNER_TEMP/overview-source"
          git rev-parse HEAD > "$RUNNER_TEMP/overview-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/overview-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overview-pinned-source
          path: ${{ runner.temp }}/overview-source
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
