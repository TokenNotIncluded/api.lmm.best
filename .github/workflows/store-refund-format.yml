name: Finish store refund review sources
on:
  push:
    branches: [fix/store-claim-refund-sync-20261010]
    paths: ['.github/workflows/store-refund-format.yml']
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/fix/store-claim-refund-sync-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - run: bun install --frozen-lockfile
      - name: Correct exact future-capability fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api-go/internal/appcli/deploy_merchant_store_capsule_test.go')
          s = p.read_text()
          old = 'c.Writer.Candidate.Capability = 8\n\t\t\tc.Candidate.MerchantStoreWriterCapability = 8'
          assert s.count(old) == 1
          s = s.replace(old, old.replace('= 8', '= 9'))
          anchor = '\tcases := map[string]func(*productionMerchantStoreCapsule){'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '\tphaseEight := cloneMerchantCapsule(good)\n\tphaseEight.Writer.Candidate.Capability = 8\n\tphaseEight.Candidate.MerchantStoreWriterCapability = 8\n\tif err := validateMerchantStoreCapsule(phaseEight, paths); err != nil {\n\t\tt.Fatalf("supported reviewed refund-sync candidate: %v", err)\n\t}\n' + anchor)
          p.write_text(s)
          PY
      - name: Format only changed frontend code and retain protected headers
        working-directory: apps/web
        run: |
          PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          names = subprocess.check_output(['git', 'diff', '--name-only', '7f09e17d68a27c4dd7ada3e43fe0474795f71f6e', 'HEAD', '--', '.'], text=True).splitlines()
          files = [Path('../../')/name for name in names if name.startswith('apps/web/') and Path(name).suffix in ('.ts', '.tsx', '.mjs')]
          files = [p for p in files if p.is_file()]
          pattern = re.compile(r'^/\*\nCopyright \(C\)[\s\S]*?QuantumNous[\s\S]*?\*/\n+')
          headers = {}
          try:
              for p in files:
                  s = p.read_text(); match = pattern.match(s)
                  if match:
                      headers[p] = match.group(0); p.write_text(s[match.end():])
              subprocess.run(['oxfmt', '-c', '.oxfmtrc.json', '--write', *map(str, files)], check=True)
          finally:
              for p, header in headers.items():
                  p.write_text(header + p.read_text().lstrip('\n'))
          PY
          git diff --check
      - name: Commit only reviewed source corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --binary > "$RUNNER_TEMP/store-source-format.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web apps/api-go/internal/appcli/deploy_merchant_store_capsule_test.go
          git commit -m 'style(store): format pickup and refund sources and qualify capability eight'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin HEAD:refs/heads/fix/store-claim-refund-sync-20261010
          git archive --format=zip --output="$RUNNER_TEMP/store-current-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-current-source
          path: |
            ${{ runner.temp }}/store-source-format.patch
            ${{ runner.temp }}/store-current-source.zip
          retention-days: 1
