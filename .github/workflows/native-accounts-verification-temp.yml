name: Native accounts isolated verification
on:
  push:
    branches: [verify/native-accounts-20261009]
    paths: ['.github/workflows/native-accounts-verification-temp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/native_accounts_test?sslmode=disable
      TEST_POSTGRES_ISOLATED_SCHEMA: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: native_accounts_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d native_accounts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api-go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 8190dbff59af02e97d329687cc37608a1f698074
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Print exact native constraint contracts
        run: |
          cat > model/native_account_diagnostic_test.go <<'GO'
          package model
          import "testing"
          func TestNativeAccountDiagnosticPostgres(t *testing.T) {
            s, _ := nativeAccountFixture(t, true)
            schema, err := currentPostgresSchema(s.db)
            if err != nil { t.Fatal(err) }
            inventory, err := buildPostgresSchemaInventory(s.db, schema, nativeAccountModels())
            if err != nil { t.Fatal(err) }
            snapshot, err := loadPostgresCatalogSnapshot(s.db, schema)
            if err != nil { t.Fatal(err) }
            for _, expected := range inventory.Constraints {
              actual := snapshot.Constraints[postgresCatalogKey{Table: expected.Table, Name: expected.Names[0]}]
              if !postgresConstraintSpecsEqual(expected, actual) {
                t.Logf("EXPECTED: %+v\nACTUAL: %+v", expected, actual)
              }
            }
          }
          GO
          go test -v -p 2 ./model -run '^TestNativeAccountDiagnosticPostgres$' -count=1 -timeout=2m
