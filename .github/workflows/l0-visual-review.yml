name: Isolated L0 browser review
on:
  push:
    branches: [review/l0-welcome-visual]
permissions:
  contents: write
jobs:
  browser-review:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/review/l0-welcome-visual'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: review/l0-welcome-visual
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Correct route header sizing found in screenshot review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          base = root / 'apps/web'
          p = base / 'src/features/onboarding/l0-welcome.css'
          s = p.read_text()
          if '.console-page.l0-getting-started' not in s:
              s = s.replace('.l0-getting-started .console-section-header {', '.console-editorial .console-page.l0-getting-started .console-section-header {', 1)
              s = s.replace('.l0-getting-started .console-page-heading {\n  flex-wrap: nowrap;\n}', '.console-editorial .l0-getting-started .console-page-heading {\n  align-items: center;\n  flex-wrap: nowrap;\n  gap: 12px;\n}\n.console-editorial .l0-getting-started .console-page-heading > .console-page-actions {\n  flex: 0 0 auto;\n  justify-content: flex-end;\n}', 1)
              s = s.replace('.l0-getting-started .console-page-title {\n  font-size: 16px;\n}', '.console-editorial .l0-getting-started .console-page-title {\n  font-size: 16px;\n  line-height: 1.4;\n  white-space: nowrap;\n}', 1)
              s = s.replace('.l0-getting-started .console-section-content {', '.console-editorial .console-page.l0-getting-started .console-section-content {', 1)
              p.write_text(s)
          formatter = next(p for p in (base / 'node_modules/.bin/oxfmt', root / 'node_modules/.bin/oxfmt') if p.exists())
          subprocess.run([str(formatter), '-c', '.oxfmtrc.json', '--write', 'src/features/onboarding/l0-welcome.css'], cwd=base, check=True)
          p = root / 'scripts/l0-visual-review.mjs'
          s = p.read_text()
          if 'title: rect(' not in s:
              old = "input: rect('#l0-question'), content: rect('.console-section-content'),"
              assert s.count(old) == 1
              s = s.replace(old, old + "\n            title: rect('.console-page-title'), routeActions: rect('.console-page-actions'),")
              old = 'const g = entry.geometry'
              assert s.count(old) == 1
              s = s.replace(old, old + "\n        assert.ok(g.title.height <= 30, 'route title must remain horizontal')\n        assert.ok(g.title.right <= g.routeActions.x + 1, 'title and pricing must not overlap')")
              p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/onboarding/l0-welcome.css scripts/l0-visual-review.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(web): prevent shared mobile header rules from collapsing onboarding title'
            git push origin HEAD:refs/heads/review/l0-welcome-visual
          fi
          mkdir -p "$RUNNER_TEMP/l0-visual"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-visual/revision.txt"
          git diff 4399bb60f22b7f18cc4a95c9c6cb6b4cb3c40873 -- apps/web > "$RUNNER_TEMP/l0-visual/source.patch"
          git archive --format=tar.gz -o "$RUNNER_TEMP/l0-visual/source.tar.gz" HEAD apps/web package.json bun.lock
      - name: Re-run source checks and production build
        working-directory: apps/web
        run: |
          for file in l0-paid-access.test.ts l0-paid-welcome.test.tsx getting-started.test.tsx l0-upgrade-copy.test.ts; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/onboarding/$file" 2>&1 | tee "$RUNNER_TEMP/l0-visual/$file.log"
          done
          bun run lint 2>&1 | tee "$RUNNER_TEMP/l0-visual/lint.log"
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/l0-visual/typecheck.log"
          bun run build 2>&1 | tee "$RUNNER_TEMP/l0-visual/build.log"
      - name: Check formatting of changed source without rewriting unrelated files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path.cwd()
          base = root / 'apps/web'
          paths = subprocess.check_output(['git', 'diff', '--name-only', '4399bb60f22b7f18cc4a95c9c6cb6b4cb3c40873', '--', 'apps/web'], text=True).splitlines()
          snapshots = {p: (root / p).read_bytes() for p in paths}
          headers = {}
          pattern = re.compile(r'^/\*\nCopyright \(C\)[\s\S]*?QuantumNous[\s\S]*?\*/\n+')
          try:
              for name in paths:
                  p = root / name
                  if p.suffix not in ('.ts', '.tsx'): continue
                  s = p.read_text()
                  match = pattern.match(s)
                  if match:
                      headers[name] = match[0]
                      p.write_text(s[match.end():])
              formatter = next(p for p in (base / 'node_modules/.bin/oxfmt', root / 'node_modules/.bin/oxfmt') if p.exists())
              subprocess.run([str(formatter), '-c', '.oxfmtrc.json', '--write', *[str((root / p).relative_to(base)) for p in paths]], cwd=base, check=True)
              for name, header in headers.items():
                  p = root / name
                  p.write_text(header + p.read_text().lstrip('\n'))
              changed = [p for p, content in snapshots.items() if (root / p).read_bytes() != content]
              assert not changed, f'Changed-source formatting failures: {changed}'
              print(f'Changed-source formatting passed: {len(paths)} files')
          finally:
              for name, content in snapshots.items(): (root / name).write_bytes(content)
          PY
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/l0-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/l0-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Supply exact credits and Chinese preset labels to the synthetic L0 fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/features/debug/persona-runtime.ts')
          s = p.read_text()
          old = '    paid_amount: level === 0 ? 0 : 50,'
          assert s.count(old) == 1
          s = s.replace(old, old + "\n    paid_credits: level === 0 ? '0' : '25000000',")
          old = '      paid_activation_min_amount: 1,'
          assert old in s
          s = s.replace(old, old + "\n      paid_activation_min_credits: '500000',")
          for old, new in [('Browse models and pricing', '查看模型与价格'), ('Connect my client', '接入我的客户端'), ('Request L1 access', '免费对话升级'), ('Explore open-source bounties', '探索开源任务')]:
              s = s.replace("label: '" + old + "'", "label: '" + new + "'")
          p.write_text(s)
          PY
          git diff > "$RUNNER_TEMP/l0-visual/synthetic-fixture.patch"
      - name: Review actual route in eight viewport-theme combinations
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/l0-browser/node_modules/playwright/index.mjs
          L0_REVIEW_OUTPUT: ${{ runner.temp }}/l0-visual
        run: |
          cd apps/web
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$L0_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node ../../scripts/l0-visual-review.mjs 2>&1 | tee "$L0_REVIEW_OUTPUT/browser.log"
      - name: Upload screenshots and assertions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-visual-review
          path: ${{ runner.temp }}/l0-visual
          retention-days: 7
          if-no-files-found: error
