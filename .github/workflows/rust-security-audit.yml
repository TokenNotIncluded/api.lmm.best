name: Rust security audit

on:
  push:
    paths:
      - 'apps/api-rust/Cargo.toml'
      - 'apps/api-rust/Cargo.lock'
      - '.github/workflows/rust-security-audit.yml'
  pull_request:
    paths:
      - 'apps/api-rust/Cargo.toml'
      - 'apps/api-rust/Cargo.lock'
      - '.github/workflows/rust-security-audit.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: rust-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24 support
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/api-rust
          # RUSTSEC-2026-0235 currently has no resolved workspace path:
          # `cargo tree --locked --target all -i rkyv` is empty. The stale
          # rkyv 0.7 lock entry comes from rust_decimal <=1.42 carrying the
          # optional dependency in every lockfile; rust_decimal 1.43 removes
          # that dependency. Keep this exact exception visible until #276
          # upgrades the lock and removes the stale entry. Do not add the RSA
          # advisory here: rsa private-key signing is reachable at runtime.
          ignore: RUSTSEC-2026-0235
