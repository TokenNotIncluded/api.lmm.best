name: rust 313 patch staging

on:
  push:
    branches: [automation/rust-313-preoutput-failover]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/rust313_patch.py
      - name: Format and verify patch
        run: |
          cargo fmt --all --manifest-path apps/api-rust/Cargo.toml
          git diff --check
      - name: Commit implementation and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_rust313_patch.yml .github/rust313_patch.py
          git add apps/api-rust/src/routes/relay_openai.rs apps/api-rust/tests/relay_openai_specific_channel_pg.rs
          git commit -m "fix(rust): retry pre-output timeouts on next channel"
          git push origin HEAD:automation/rust-313-preoutput-failover
