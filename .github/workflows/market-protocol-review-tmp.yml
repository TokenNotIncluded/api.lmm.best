name: Market MCP protocol acceptance
on:
  push:
    branches: [review/market-oauth-20261010]
    paths: [.github/workflows/market-protocol-review-tmp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOMAXPROCS: '2'
      OAUTH_SERVER_TEST_POSTGRES_DSN: postgres://market_test:isolated_test_only@127.0.0.1:5432/market_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Complete protocol requests and assert real preflight coverage
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = review/market-oauth-20261010
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api-go/router/oauth_server_mcp_test.go')
          s=p.read_text()
          old='"MCP-Protocol-Version": "2026-07-28"}'
          assert s.count(old)==2
          s=s.replace(old,'"MCP-Protocol-Version": "2026-07-28", "Mcp-Method": "tools/list", "Origin": "https://client.example"}',1)
          s=s.replace(old,'"MCP-Protocol-Version": "2026-07-28", "Mcp-Method": "tools/call", "Mcp-Name": "metamcp", "Origin": "https://client.example"}',1)
          marker='\trequire.Equal(t, "metamcp", list.Result.Tools[0].Name)'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'''
          	// A browser must be allowed to send all standard modern MCP headers.
          	preflight := h.request("OPTIONS", "/mcp/market?mode=compact", "", map[string]string{"Origin": "https://client.example", "Access-Control-Request-Method": "POST", "Access-Control-Request-Headers": "authorization,content-type,mcp-protocol-version,mcp-method,mcp-name"})
          	require.Equal(t, 204, preflight.Code)
          	require.Equal(t, "*", preflight.Header().Get("Access-Control-Allow-Origin"))
          	require.Empty(t, preflight.Header().Get("Access-Control-Allow-Credentials"))
          	allowed := strings.ToLower(preflight.Header().Get("Access-Control-Allow-Headers"))
          	for _, name := range []string{"authorization", "content-type", "mcp-protocol-version", "mcp-method", "mcp-name"} {
          		require.Contains(t, allowed, name)
          	}
          	// The SDK still enforces the mirrored method, rather than trusting it.
          	mismatch := h.request("POST", "/mcp/market?mode=compact", `{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}`, map[string]string{"Authorization": "Bearer " + token.AccessToken, "Content-Type": "application/json", "Accept": "application/json, text/event-stream", "MCP-Protocol-Version": "2026-07-28", "Mcp-Method": "tools/call"})
          	require.Equal(t, 400, mismatch.Code, mismatch.Body.String())
          	require.Contains(t, mismatch.Body.String(), "-32020")
          ''')
          p.write_text(s)
          PY
          gofmt -w apps/api-go/router/oauth_server_mcp_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api-go/router/oauth_server_mcp_test.go
          git diff --cached --check
          git commit -m 'test(tool-market): validate modern MCP headers, preflight and header-body mismatch'
          git push origin HEAD:refs/heads/review/market-oauth-20261010
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          git diff HEAD^ HEAD -- apps/api-go > "$RUNNER_TEMP/results/test-changes.patch"
      - name: Provider and OAuth core tests on SQLite and PostgreSQL
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go test -json -p 2 ./internal/marketprovider ./oauthserver -count=1 -timeout=6m | tee "$RUNNER_TEMP/results/core-tests.json"
      - name: Marketplace and OAuth integration tests with vet
        if: always()
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          go test -json -p 2 ./model ./service ./controller ./router ./middleware -run 'ToolMarket|MarketRemote|MarketProvider|OAuth|IdentityStorage' -count=1 -timeout=8m | tee "$RUNNER_TEMP/results/integration-tests.json"
      - name: Build all Go packages
        if: always()
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go build -p 2 ./... 2>&1 | tee "$RUNNER_TEMP/results/go-build.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: market-protocol-final-go
          path: ${{ runner.temp }}/results
          retention-days: 3
