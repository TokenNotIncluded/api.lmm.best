name: Ledger source correction (temporary)
on:
  push:
    branches: [wip/mk-02-ledger]
    paths: [.github/workflows/ledger-format-once.yml]
permissions:
  contents: read
jobs:
  format:
    if: github.ref == 'refs/heads/wip/mk-02-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Install formatter
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply reviewed source corrections
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('apps/core-rust/src/billing/ledger/mod.rs')
          s = p.read_text()
          start = s.index('    async fn begin(&self)')
          end = s.index('    /// Idempotent provisioning', start)
          s = s[:start] + '''    async fn begin(&self) -> Result<Transaction<'static, Postgres>, Error> {
                  let mut tx = self.pool.begin().await?;
                  for statement in [
                      "SET TRANSACTION ISOLATION LEVEL READ COMMITTED",
                      "SET LOCAL lock_timeout = '3s'",
                      "SET LOCAL statement_timeout = '10s'",
                      "SET LOCAL synchronous_commit = on",
                  ] {
                      sqlx::query(statement).execute(&mut *tx).await?;
                  }
                  Ok(tx)
              }

          ''' + s[end:]
          p.write_text(s)
          p = Path('apps/core-rust/tests/ledger.rs')
          s, count = re.subn(r'(fund\(&ledger,[^\n;]*\));', r'\1.await;', p.read_text())
          assert count >= 14, count
          p.write_text(s)
          p = Path('apps/core-rust/schema/ledger.sql')
          s = p.read_text()
          old = "'status', 'posted', 'journal_id', journal_id, 'entries',"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "'status', 'posted', 'journal_id', post_ledger.journal_id, 'entries',"))
      - name: Format and commit only task-owned source files
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.0 fmt --manifest-path apps/core-rust/Cargo.toml --all
          git add -- apps/core-rust/src/billing/ledger/mod.rs apps/core-rust/schema/ledger.sql apps/core-rust/tests/ledger.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ledger): make posting futures Send, await funding fixtures and qualify SQL receipt'
          git push origin HEAD:refs/heads/wip/mk-02-ledger
