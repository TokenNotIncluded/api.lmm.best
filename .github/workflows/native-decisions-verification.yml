name: Native Decisions temporary integration verification

on:
  push:
    branches:
      - feat/native-openai-decisions

permissions:
  contents: read

concurrency:
  group: native-decisions-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-backend:
    name: Go compile, format, vet and all tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Install verified native-contract cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Bind cosign to the fixed native system path
        run: bash scripts/install-ci-native-cosign.sh
      - name: Install production contract inspection tools
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libarchive-tools nginx curl util-linux systemd
          test "$(command -v bsdtar)" = /usr/bin/bsdtar
      - name: Validate source formatting
        working-directory: apps/api-go
        run: bash ../../scripts/check-go-format.sh .
      - name: Vet and test all Go backend packages
        working-directory: apps/api-go
        run: |
          go vet ./...
          go test -p 2 ./...
      - name: Vet and test independent relaykit module
        working-directory: apps/api-go/relaykit
        run: |
          go vet ./...
          go test -p 2 ./...
