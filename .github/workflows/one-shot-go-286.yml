name: "One-shot Go 286 apply"

on:
  push:
    branches:
      - fix/billing-raw-unicode-286

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/billing-raw-unicode-286
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/relaykit/go.mod
          cache-dependency-path: apps/api-go/relaykit/go.sum

      - name: Apply raw JSON token-count normalization
        shell: bash
        env:
          HELPER_B64: 
          TEST_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1))

          request = "apps/api-go/relaykit/dto/openai_request.go"
          for field in ("Instructions", "Metadata", "Text", "ToolChoice", "Prompt", "Tools"):
              replace_once(request, f"texts = append(texts, string(r.{field}))", f"texts = append(texts, normalizeRawJSONForTokenCount(r.{field}))")

          compaction = "apps/api-go/relaykit/dto/openai_responses_compaction_request.go"
          replace_once(compaction, "parts = append(parts, string(r.Instructions))", "parts = append(parts, normalizeRawJSONForTokenCount(r.Instructions))")
          replace_once(compaction, "parts = append(parts, string(r.Tools))", "parts = append(parts, normalizeRawJSONForTokenCount(r.Tools))")
          replace_once(compaction, "*texts = append(*texts, string(raw))", "*texts = append(*texts, normalizeRawJSONForTokenCount(raw))")
          replace_once("apps/api-go/relaykit/dto/alpha_search_request.go", "combineText = string(r.RawBody)", "combineText = normalizeRawJSONForTokenCount(r.RawBody)")
          PY
          printf '%s' "$HELPER_B64" | base64 -d > apps/api-go/relaykit/dto/raw_json_token_text.go
          printf '%s' "$TEST_B64" | base64 -d > apps/api-go/relaykit/dto/raw_json_token_text_test.go
          rm .github/workflows/one-shot-go-286.yml
          gofmt -w apps/api-go/relaykit/dto/raw_json_token_text.go apps/api-go/relaykit/dto/raw_json_token_text_test.go apps/api-go/relaykit/dto/openai_request.go apps/api-go/relaykit/dto/openai_responses_compaction_request.go apps/api-go/relaykit/dto/alpha_search_request.go

      - name: Run focused Go tests
        working-directory: apps/api-go/relaykit
        run: go test ./dto

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "215191720+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(billing): normalize raw JSON unicode escapes"
          git push origin HEAD:fix/billing-raw-unicode-286
