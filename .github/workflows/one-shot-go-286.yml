name: One-shot Go #286 apply

on:
  push:
    branches:
      - fix/billing-raw-unicode-286

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/billing-raw-unicode-286
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Apply raw JSON token-count normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1))

          request = "apps/api-go/relaykit/dto/openai_request.go"
          for field in ("Instructions", "Metadata", "Text", "ToolChoice", "Prompt", "Tools"):
              replace_once(
                  request,
                  f"texts = append(texts, string(r.{field}))",
                  f"texts = append(texts, normalizeRawJSONForTokenCount(r.{field}))",
              )

          compaction = "apps/api-go/relaykit/dto/openai_responses_compaction_request.go"
          replace_once(
              compaction,
              "parts = append(parts, string(r.Instructions))",
              "parts = append(parts, normalizeRawJSONForTokenCount(r.Instructions))",
          )
          replace_once(
              compaction,
              "parts = append(parts, string(r.Tools))",
              "parts = append(parts, normalizeRawJSONForTokenCount(r.Tools))",
          )
          replace_once(
              compaction,
              "*texts = append(*texts, string(raw))",
              "*texts = append(*texts, normalizeRawJSONForTokenCount(raw))",
          )

          replace_once(
              "apps/api-go/relaykit/dto/alpha_search_request.go",
              "combineText = string(r.RawBody)",
              "combineText = normalizeRawJSONForTokenCount(r.RawBody)",
          )

          Path("apps/api-go/relaykit/dto/raw_json_token_text.go").write_text(r'''package dto

import (
	"encoding/json"
	"unicode/utf16"
	"unicode/utf8"
)

// normalizeRawJSONForTokenCount decodes JSON Unicode escapes only while
// scanning JSON string literals. It is intentionally used only at raw-JSON
// token-count boundaries: semantic strings have already been decoded by the
// JSON parser and must not be decoded a second time.
func normalizeRawJSONForTokenCount(raw json.RawMessage) string {
	if len(raw) == 0 {
		return ""
	}

	out := make([]byte, 0, len(raw))
	inString := false
	for i := 0; i < len(raw); {
		b := raw[i]
		if !inString {
			out = append(out, b)
			if b == '"' {
				inString = true
			}
			i++
			continue
		}

		if b == '"' {
			out = append(out, b)
			inString = false
			i++
			continue
		}
		if b != '\\' {
			out = append(out, b)
			i++
			continue
		}
		if i+1 >= len(raw) {
			out = append(out, b)
			i++
			continue
		}
		if raw[i+1] != 'u' {
			// Consume the escaped byte as a pair. This keeps escaped quotes from
			// toggling string state and keeps escaped backslashes from exposing a
			// following literal "uXXXX" sequence to this scanner.
			out = append(out, raw[i], raw[i+1])
			i += 2
			continue
		}

		codeUnit, ok := decodeJSONHex4(raw[i+2:])
		if !ok {
			out = append(out, raw[i], raw[i+1])
			i += 2
			continue
		}

		r := rune(codeUnit)
		if codeUnit >= 0xD800 && codeUnit <= 0xDBFF {
			if i+12 <= len(raw) && raw[i+6] == '\\' && raw[i+7] == 'u' {
				low, lowOK := decodeJSONHex4(raw[i+8:])
				if lowOK && low >= 0xDC00 && low <= 0xDFFF {
					out = utf8.AppendRune(out, utf16.DecodeRune(r, rune(low)))
					i += 12
					continue
				}
			}
			// Preserve malformed/lone surrogates instead of manufacturing the
			// replacement rune. Billing normalization must be deterministic.
			out = append(out, raw[i:i+6]...)
			i += 6
			continue
		}
		if codeUnit >= 0xDC00 && codeUnit <= 0xDFFF {
			out = append(out, raw[i:i+6]...)
			i += 6
			continue
		}

		out = utf8.AppendRune(out, r)
		i += 6
	}
	return string(out)
}

func decodeJSONHex4(raw []byte) (uint16, bool) {
	if len(raw) < 4 {
		return 0, false
	}
	var value uint16
	for _, b := range raw[:4] {
		value <<= 4
		switch {
		case b >= '0' && b <= '9':
			value |= uint16(b - '0')
		case b >= 'a' && b <= 'f':
			value |= uint16(b-'a') + 10
		case b >= 'A' && b <= 'F':
			value |= uint16(b-'A') + 10
		default:
			return 0, false
		}
	}
	return value, true
}
''')

          Path("apps/api-go/relaykit/dto/raw_json_token_text_test.go").write_text(r'''package dto

import (
	"encoding/json"
	"testing"

	"github.com/stretchr/testify/require"
)

func TestNormalizeRawJSONForTokenCount(t *testing.T) {
	tests := []struct {
		name string
		raw  string
		want string
	}{
		{name: "basic CJK", raw: `{"x":"\u4e2d"}`, want: `{"x":"中"}`},
		{name: "surrogate pair", raw: `{"x":"\uD83D\uDE00"}`, want: `{"x":"😀"}`},
		{name: "escaped backslash", raw: `{"x":"\\u4e2d"}`, want: `{"x":"\\u4e2d"}`},
		{name: "escaped quote before unicode", raw: `{"x":"a\\\"b\u4e2d"}`, want: `{"x":"a\\\"b中"}`},
		{name: "lone high surrogate", raw: `{"x":"\uD83D!"}`, want: `{"x":"\uD83D!"}`},
		{name: "lone low surrogate", raw: `{"x":"\uDE00"}`, want: `{"x":"\uDE00"}`},
		{name: "malformed hex", raw: `{"x":"\u12G4"}`, want: `{"x":"\u12G4"}`},
		{name: "truncated", raw: `{"x":"\u123"}`, want: `{"x":"\u123"}`},
		{name: "outside string", raw: `{"x":1,"raw":u4e2d}`, want: `{"x":1,"raw":u4e2d}`},
	}
	for _, tc := range tests {
		t.Run(tc.name, func(t *testing.T) {
			require.Equal(t, tc.want, normalizeRawJSONForTokenCount(json.RawMessage(tc.raw)))
		})
	}
}

func TestResponsesRawJSONUnicodeNormalization(t *testing.T) {
	rawUTF8 := OpenAIResponsesRequest{
		Instructions: json.RawMessage(`"你好"`),
		Metadata:     json.RawMessage(`{"label":"中文"}`),
		Text:         json.RawMessage(`{"format":{"description":"天气"}}`),
		ToolChoice:   json.RawMessage(`{"type":"function","name":"查询"}`),
		Prompt:       json.RawMessage(`{"id":"提示"}`),
		Tools:        json.RawMessage(`[{"type":"function","name":"天气"}]`),
	}
	escaped := OpenAIResponsesRequest{
		Instructions: json.RawMessage(`"\u4f60\u597d"`),
		Metadata:     json.RawMessage(`{"label":"\u4e2d\u6587"}`),
		Text:         json.RawMessage(`{"format":{"description":"\u5929\u6c14"}}`),
		ToolChoice:   json.RawMessage(`{"type":"function","name":"\u67e5\u8be2"}`),
		Prompt:       json.RawMessage(`{"id":"\u63d0\u793a"}`),
		Tools:        json.RawMessage(`[{"type":"function","name":"\u5929\u6c14"}]`),
	}
	require.Equal(t, rawUTF8.GetTokenCountMeta().CombineText, escaped.GetTokenCountMeta().CombineText)
}

func TestCompactionRawJSONUnicodeNormalization(t *testing.T) {
	rawUTF8 := OpenAIResponsesCompactionRequest{
		Instructions: json.RawMessage(`"摘要"`),
		Tools:        json.RawMessage(`[{"name":"工具"}]`),
		Input:        json.RawMessage(`[{"type":"function_call_output","output":"中文"}]`),
	}
	escaped := OpenAIResponsesCompactionRequest{
		Instructions: json.RawMessage(`"\u6458\u8981"`),
		Tools:        json.RawMessage(`[{"name":"\u5de5\u5177"}]`),
		Input:        json.RawMessage(`[{"type":"function_call_output","output":"\u4e2d\u6587"}]`),
	}
	require.Equal(t, rawUTF8.GetTokenCountMeta().CombineText, escaped.GetTokenCountMeta().CombineText)
}

func TestSemanticStringsAreNotRecursivelyDecoded(t *testing.T) {
	compact := OpenAIResponsesCompactionRequest{Input: json.RawMessage(`"\\u4e2d"`)}
	require.Equal(t, `\u4e2d`, compact.GetTokenCountMeta().CombineText)

	var chat GeneralOpenAIRequest
	require.NoError(t, json.Unmarshal([]byte(`{"messages":[{"role":"user","content":"\\u4e2d"}]}`), &chat))
	meta := chat.GetTokenCountMeta()
	require.Contains(t, meta.CombineText, `\u4e2d`)
	require.NotContains(t, meta.CombineText, "中")
}

func TestAlphaSearchRawJSONUnicodeNormalization(t *testing.T) {
	rawUTF8 := AlphaSearchRequest{RawBody: json.RawMessage(`{"query":"中文"}`)}
	escaped := AlphaSearchRequest{RawBody: json.RawMessage(`{"query":"\u4e2d\u6587"}`)}
	require.Equal(t, rawUTF8.GetTokenCountMeta().CombineText, escaped.GetTokenCountMeta().CombineText)
}
''')
          PY

          rm .github/workflows/one-shot-go-286.yml
          gofmt -w \
            apps/api-go/relaykit/dto/raw_json_token_text.go \
            apps/api-go/relaykit/dto/raw_json_token_text_test.go \
            apps/api-go/relaykit/dto/openai_request.go \
            apps/api-go/relaykit/dto/openai_responses_compaction_request.go \
            apps/api-go/relaykit/dto/alpha_search_request.go

      - name: Run focused Go tests
        working-directory: apps/api-go
        run: go test ./relaykit/dto

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "215191720+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(billing): normalize raw JSON unicode escapes"
          git push origin HEAD:fix/billing-raw-unicode-286
