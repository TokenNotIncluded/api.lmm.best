name: L0 candidate acceptance
on:
  push:
    branches: [work/l0-l1-retirement-20261009]
concurrency:
  group: l0-candidate-acceptance
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: l0_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d l0_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 60b9e6500084dc6ae4c4f734ffa353d7f4d13e6c
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.25.1'
          cache-dependency-path: candidate/apps/api-go/go.sum
      - name: Verify and prepare candidate source
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/l0-result"
          python3 workbench/.workbench/apply-l0.py candidate
          python3 workbench/.workbench/followup-l0.py candidate
          cp workbench/.workbench/support-conversation.test.tsx candidate/apps/web/src/features/support-ticket/support-conversation.test.tsx
          python3 workbench/.workbench/corrections-l0.py candidate
          git -C candidate add apps/web/src/features/support-ticket/support-conversation.test.tsx
          (cd candidate/apps/api-go && go generate ./controller)
          git -C candidate diff --cached --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('l0-paths.json')
          changed=subprocess.check_output(['git','diff','HEAD','--name-only'],cwd='candidate',text=True).splitlines()
          assert all(x.startswith(('apps/api-go/','apps/web/src/','docs/security/')) for x in changed)
          p.write_text(json.dumps(sorted(changed)))
          PY
      - name: Install locked dependencies
        id: dependencies
        working-directory: candidate
        run: bun install --frozen-lockfile
      - name: Format changed source
        id: format
        working-directory: candidate/apps/web
        run: |
          bun run format > "$RUNNER_TEMP/l0-result/format.log" 2>&1
          node scripts/add-copyright.mjs >> "$RUNNER_TEMP/l0-result/format.log" 2>&1
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('../..').resolve()
          allowed=set(json.loads((root.parent/'l0-paths.json').read_text()))
          for path in subprocess.check_output(['git','diff','--name-only'],cwd=root,text=True).splitlines():
              if path not in allowed:
                  subprocess.run(['git','restore','--worktree','--',path],cwd=root,check=True)
          changed=[p for p in allowed if p.endswith('.go') and (root/p).exists()]
          subprocess.run(['gofmt','-w',*changed],cwd=root,check=True)
          PY
          bun run format:check >> "$RUNNER_TEMP/l0-result/format.log" 2>&1
      - name: Frontend static checks
        id: static
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          failed=0
          for command in typecheck lint copyright:check; do
            file="${command//:/-}"
            if ! bun run "$command" > "$RUNNER_TEMP/l0-result/$file.log" 2>&1; then cat "$RUNNER_TEMP/l0-result/$file.log"; failed=1; fi
          done
          exit "$failed"
      - name: Frontend regression
        id: webtests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          failed=0
          for file in $(find src/features/onboarding src/features/todos src/features/assistant src/features/support-ticket src/routes/_authenticated/todos src/lib/__tests__ -name '*.test.ts' -o -name '*.test.tsx' | sort); do
            echo "FILE: $file" >> "$RUNNER_TEMP/l0-result/web-tests.log"
            if ! bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" >> "$RUNNER_TEMP/l0-result/web-tests.log" 2>&1; then failed=1; fi
          done
          if grep -Eq '^# fail [1-9]|^not ok |^[[:space:]]*[1-9][0-9]* fail' "$RUNNER_TEMP/l0-result/web-tests.log"; then failed=1; fi
          grep -B 8 -A 20 -E '^not ok |^\(fail\)|error:|AssertionError' "$RUNNER_TEMP/l0-result/web-tests.log" || true
          exit "$failed"
      - name: Baseline Go regressions
        id: baseline
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: workbench/apps/api-go
        env:
          TEST_POSTGRES_DSN: postgres://test:isolated-test-only@127.0.0.1:5432/l0_test?sslmode=disable
        run: |
          set +e
          go test -p 2 ./middleware ./router ./model ./controller -run 'Test(.*Assistant.*|.*Registration.*|.*DeveloperAccess.*|.*UnifiedTodo.*|.*ConsoleAccess.*|.*PreActivation.*|.*Paid.*)' -count=1 -timeout=10m > "$RUNNER_TEMP/l0-result/go-baseline.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/l0-result/go-baseline-exit.txt"
          grep -A 10 '^--- FAIL:' "$RUNNER_TEMP/l0-result/go-baseline.log" || true
      - name: Candidate Go regressions
        id: gotests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: candidate/apps/api-go
        env:
          TEST_POSTGRES_DSN: postgres://test:isolated-test-only@127.0.0.1:5432/l0_test?sslmode=disable
        run: |
          set +e
          go test -p 2 ./middleware ./router ./model ./controller -run 'Test(.*Assistant.*|.*Registration.*|.*DeveloperAccess.*|.*UnifiedTodo.*|.*ConsoleAccess.*|.*PreActivation.*|.*Paid.*)' -count=1 -timeout=10m > "$RUNNER_TEMP/l0-result/go-tests.log" 2>&1
          result=$?
          grep -A 10 '^--- FAIL:' "$RUNNER_TEMP/l0-result/go-tests.log" || true
          exit "$result"
      - name: Production web build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          bun run build > "$RUNNER_TEMP/l0-result/build.log" 2>&1
          bun run bundle:check >> "$RUNNER_TEMP/l0-result/build.log" 2>&1
      - name: Export clean candidate branch for review only
        id: publish
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.build.outcome == 'success' }}
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith(('apps/api-go/','apps/web/src/','docs/security/')) for p in paths)
          PY
          git diff HEAD --check
          git add -A -- apps/api-go apps/web/src docs/security
          git -c user.name='ChatGPT' -c user.email='chatgpt@users.noreply.github.com' commit -m 'fix: simplify L0 activation and restore support access'
          askpass="$RUNNER_TEMP/l0-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token;; *) printf "%s\n" "$GH_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/fix/l0-first-turn-and-support-20261009
          rm -f "$askpass"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-result/published-commit.txt"
      - name: Save candidate and diagnostics
        if: ${{ always() && steps.source.outcome == 'success' }}
        working-directory: candidate
        run: |
          git diff 60b9e6500084dc6ae4c4f734ffa353d7f4d13e6c --binary > "$RUNNER_TEMP/l0-result/candidate.patch"
          git diff 60b9e6500084dc6ae4c4f734ffa353d7f4d13e6c --stat > "$RUNNER_TEMP/l0-result/diff-stat.txt"
          git add -A -- apps/api-go apps/web/src docs/security
          if ! git diff --cached --quiet; then git -c user.name='L0 review' -c user.email='review@example.invalid' commit -m 'isolated candidate snapshot'; fi
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/l0-result/candidate.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-result/source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l0-candidate-evidence
          path: ${{ runner.temp }}/l0-result/
          retention-days: 4
