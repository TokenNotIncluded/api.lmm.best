name: Format CoWeft identity implementation
on:
  push:
    branches: ['feat/coweft-oidc']
permissions:
  contents: read
jobs:
  format:
    # One-time bootstrap housekeeping. Only a trusted same-repository branch;
    # no pull-request event and no dependency scripts or application execution.
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coweft-oidc
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Apply Go formatting only to the new identity implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced; do not alter another revision.'
            exit 0
          fi
          gofmt -w apps/api-go/oidcprovider/*.go \
            apps/api-go/service/oidc_provider.go \
            apps/api-go/router/oidc_provider.go \
            apps/api-go/router/oauth_server.go
          git add -- apps/api-go/oidcprovider \
            apps/api-go/service/oidc_provider.go \
            apps/api-go/router/oidc_provider.go \
            apps/api-go/router/oauth_server.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(oidc): apply canonical Go formatting'
          git push origin HEAD:refs/heads/feat/coweft-oidc
