name: Tool market provider verification
on:
  push:
    branches: [feat/tool-market-provider-presets]
    paths: [.github/workflows/tool-market-provider-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Baseline marketplace and OAuth tests
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          go test -json -p 2 ./model ./service ./controller ./router -run 'ToolMarket|MarketRemote|OAuth' -count=1 -timeout=8m | tee "$RUNNER_TEMP/results/go-baseline.json"
      - name: Baseline Web checks
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          cd apps/web
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/results/web-typecheck.txt"
          for test in src/features/tool-market/*.test.ts src/features/tool-market/*.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" || exit 1
          done 2>&1 | tee "$RUNNER_TEMP/results/web-tests.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-market-baseline-results
          path: ${{ runner.temp }}/results
          retention-days: 7
