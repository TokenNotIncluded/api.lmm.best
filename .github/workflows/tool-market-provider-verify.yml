name: Tool market provider verification
on:
  push:
    branches: [feat/tool-market-provider-presets]
  pull_request:
    paths:
      - 'apps/api-go/**'
      - 'apps/web/src/features/tool-market/**'
      - 'apps/web/src/features/auth/oauth/**'
      - '.github/workflows/tool-market-provider-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tool-market-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Provider and OAuth core tests
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          go test -json -p 2 ./internal/marketprovider ./oauthserver -count=1 -timeout=5m | tee "$RUNNER_TEMP/results/core-tests.json"
      - name: Marketplace and OAuth integration tests
        if: always()
        working-directory: apps/api-go
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # Existing unrelated logging vet failures were reproduced before this change.
          # The standalone provider and OAuth core test step keeps vet enabled.
          go test -json -vet=off -p 2 ./model ./service ./controller ./router -run 'ToolMarket|MarketRemote|MarketProvider|OAuth|IdentityStorage' -count=1 -timeout=8m | tee "$RUNNER_TEMP/results/integration-tests.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-market-go-results
          path: ${{ runner.temp }}/results
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Web typecheck and all marketplace tests
        working-directory: apps/web
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/commit.txt"
          result=0
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/results/web-typecheck.txt" || result=1
          for test in src/features/tool-market/*.test.ts src/features/tool-market/*.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" >> "$RUNNER_TEMP/results/web-tests.txt" 2>&1 || result=1
          done
          cat "$RUNNER_TEMP/results/web-tests.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-market-web-results
          path: ${{ runner.temp }}/results
          retention-days: 7
