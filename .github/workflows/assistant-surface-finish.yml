name: Finish assistant surface review
on:
  push:
    branches: [fix/assistant-single-surface-20260923]
    paths: ['.github/workflows/assistant-surface-finish.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refine local task navigation and history fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/features/onboarding/l0-welcome.tsx')
          s=p.read_text()
          edits=[
            ('  useEffect,\n', '  useCallback,\n  useEffect,\n'),
            ('  const cloudRef = useRef<HTMLDivElement>(null)', '  const helpMenu = useRef<HTMLDetailsElement>(null)\n  const cloudRef = useRef<HTMLDivElement>(null)'),
            ('    const openTask = (request: QueuedAssistantRequest) => {\n      setTaskRequest(request)', '    const openTask = (request: QueuedAssistantRequest) => {\n      helpMenu.current?.removeAttribute(\'open\')\n      setTaskRequest(request)'),
            ('  const returnToConversation = () => {', '  const returnToConversation = useCallback(() => {'),
            ('  }\n\n  useEffect(() => {\n    const focusConversation', '  }, [])\n\n  useEffect(() => {\n    const focusConversation'),
            ('  }, [])\n\n  const selectScene = (next: Scene, focus = false) => {\n    setScene(next)', '  }, [returnToConversation])\n\n  const selectScene = (next: Scene, focus = false) => {\n    setTaskRequest(null)\n    setScene(next)'),
            ("<details className='l0-help-menu' onKeyDown={closeDisclosure}>", "<details ref={helpMenu} className='l0-help-menu' onKeyDown={closeDisclosure}>")
          ]
          for old,new in edits:
              assert s.count(old)==1, old
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('apps/web/scripts/visual-review/assistant_surface_review.py')
          s=p.read_text()
          old="data = {'items': [], 'total': 0, 'page': 1, 'page_size': 20}"
          assert old in s
          s=s.replace(old,"data = {'conversations': [{'id': 7201, 'title': '客户端连接', 'last_message_preview': ANSWER, 'created_at': 1790100000, 'updated_at': 1790100000, 'archived_at': 0, 'owner': 'self', 'privacy_notice': ''}] if self.chats else []}")
          s=s.replace("assert await page.locator('#l0-question').evaluate('e => e === document.activeElement')", "await page.wait_for_function(\"document.activeElement?.id === 'l0-question'\")")
          p.write_text(s)
          PY
          git add apps/web/src/features/onboarding/l0-welcome.tsx apps/web/scripts/visual-review/assistant_surface_review.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format and commit scoped changes
        run: |
          bun run format:web
          git add apps/web/src/features/onboarding/l0-welcome.tsx apps/web/scripts/visual-review/assistant_surface_review.py
          git restore .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): preserve L0 navigation when opening inline support'
          git push origin HEAD:fix/assistant-single-surface-20260923
      - name: Lint changed assistant and layout components
        working-directory: apps/web
        run: |
          ../../node_modules/.bin/oxlint -c .oxlintrc.json src/features/onboarding/l0-welcome.tsx src/features/assistant/assistant-panel.tsx src/features/assistant/assistant-new-user-gift.tsx src/features/assistant/assistant-support-controls.tsx src/features/assistant/assistant-launcher.tsx src/components/layout/components/app-header.tsx src/components/layout/components/authenticated-layout.tsx
