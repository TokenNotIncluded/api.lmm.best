name: Finish assistant surface review
on:
  push:
    branches: [fix/assistant-single-surface-20260923]
    paths: ['.github/workflows/assistant-surface-finish.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Match the consumed-request API contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/features/onboarding/getting-started.test.tsx')
          s=p.read_text()
          old='assert.equal(consumeQueuedAssistantRequest(), null)'
          assert s.count(old)==1
          p.write_text(s.replace(old, 'assert.equal(consumeQueuedAssistantRequest(), undefined)'))
          PY
          git add apps/web/src/features/onboarding/getting-started.test.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(web): verify inline tasks consume their own queued request'
          git push origin HEAD:fix/assistant-single-surface-20260923
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify changed route and panel tests
        working-directory: apps/web
        run: |
          failed=0
          for test in src/features/assistant/assistant-panel.test.tsx src/features/onboarding/getting-started.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" >> /tmp/assistant-tests.log 2>&1 || failed=1
          done
          if grep -Eq '\(fail\)|^[[:space:]]*[1-9][0-9]* fail$' /tmp/assistant-tests.log; then failed=1; fi
          cat /tmp/assistant-tests.log
          exit "$failed"
