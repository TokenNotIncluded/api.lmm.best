name: Production A/B deployment tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-ab-tests.yml'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/actions/deploy-production/**'
      - 'scripts/*production*'
      - 'apps/api-go/internal/appcli/deploy*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Archive exact public source for reproducible deployment review
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/production-ab-source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-ab-source
          path: ${{ runner.temp }}/production-ab-source.tar.gz
          retention-days: 1
      - name: Run A/B deployment regression tests
        run: |
          if test -f scripts/test-production-ab.py; then
            python3 -B scripts/test-production-ab.py
          fi
