name: Store stock regressions

on:
  push:
    branches: [fix/store-stock-availability-20261010]
  pull_request:
    paths:
      - 'apps/api-go/model/merchant_store*'
      - 'apps/web/src/features/store/**'
      - 'apps/web/scripts/store-stock*'
      - '.github/workflows/store-stock-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-stock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Stock, sales quota and fixed-content database tests
        working-directory: apps/api-go
        run: go test -race -p 2 ./model -run 'TestMerchantStore(Catalogue|Sales|Remaining|Fixed|Stock)' -count=1 -timeout=10m

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record source and translation changes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stock-source"
          git rev-parse HEAD > "$RUNNER_TEMP/stock-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/stock-source/source.tar.gz" HEAD
          git archive --format=tar.gz -o "$RUNNER_TEMP/stock-source/base-locales.tar.gz" 3e825da797e4577d1263940763a72c089ed0f3b6 apps/web/src/i18n/locales
      - name: Upload reproducible review source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-stock-source
          path: ${{ runner.temp }}/stock-source
          retention-days: 3
          if-no-files-found: error
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Static checks
        working-directory: apps/web
        run: |
          bun run lint
          bun run typecheck
      - name: Stock unit and catalogue interaction tests
        working-directory: apps/web
        run: bun test src/features/store/stock-status.test.ts src/features/store/catalogue-interactions.test.tsx
      - name: Install isolated Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/stock-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/stock-browser/node_modules/playwright/cli.js" install --with-deps chromium
          browser_path=$(node -e "console.log(require(process.env.RUNNER_TEMP + '/stock-browser/node_modules/playwright').chromium.executablePath())")
          sudo ln -sf "$browser_path" /usr/bin/chromium
      - name: Desktop and mobile stock acceptance
        shell: bash
        working-directory: apps/web
        env:
          NODE_PATH: ${{ runner.temp }}/stock-browser/node_modules
          STOCK_REVIEW_OUTPUT: ${{ runner.temp }}/stock-review
          STOCK_REVIEW_URL: http://127.0.0.1:4189
        run: |
          mkdir -p "$STOCK_REVIEW_OUTPUT"
          git rev-parse HEAD > "$STOCK_REVIEW_OUTPUT/revision.txt"
          bun run build > "$STOCK_REVIEW_OUTPUT/build.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4189 > "$STOCK_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4189/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-stock-review.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-stock-review
          path: ${{ runner.temp }}/stock-review
          retention-days: 7
          if-no-files-found: warn
