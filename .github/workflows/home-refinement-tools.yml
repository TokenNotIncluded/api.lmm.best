name: Isolated homepage refinement tools
on:
  push:
    branches: [codex/home-review-tools-20260927]
    paths: [.github/workflows/home-refinement-tools.yml]
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin target and recipe
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/codex/home-review-tools-20260927 ]]
          cp .agents/home-refinement-recipe.json "$RUNNER_TEMP/recipe.json"
          git checkout --detach e2108c031d6d0aba90c65b9a9a137cb2cf0a03eb
          [[ $(git rev-parse origin/codex/home-polish-20260927) == $(git rev-parse HEAD) ]]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply bounded source changes
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          allowed = {
            'apps/web/scripts/home-design-review.mjs',
            'apps/web/src/features/forge/forge-home-mobile.test.ts',
            'apps/web/src/features/forge/forge-home.css',
            'apps/web/src/features/home/home-text-segmentation.test.ts',
            'apps/web/src/features/home/home-text-segmentation.ts',
          }
          recipe = json.loads((Path(os.environ['RUNNER_TEMP']) / 'recipe.json').read_text())
          assert {item['path'] for item in recipe} == allowed and len(recipe) == len(allowed)
          for item in recipe:
            path = Path(item['path'])
            assert path.is_file() and not path.is_symlink()
            before = path.read_bytes()
            assert hashlib.sha256(before).hexdigest() == item['before'], str(path)
            lines = before.decode().splitlines(True)
            previous = len(lines)
            for edit in reversed(item['edits']):
              start, stop = edit['start'], edit['stop']
              assert 0 <= start <= stop <= previous
              lines[start:stop] = [edit['text']]
              previous = start
            after = ''.join(lines).encode()
            assert hashlib.sha256(after).hexdigest() == item['after'], str(path)
            path.write_bytes(after)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lmm/web format
      - name: Publish only requested source refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          recipe = json.loads((Path(os.environ['RUNNER_TEMP']) / 'recipe.json').read_text())
          allowed = {item['path'] for item in recipe}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == allowed, sorted(changed ^ allowed)
          for path in sorted(changed):
            subprocess.run(['git','add','--',path], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): polish assistant focus and animated text wrapping'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/codex/home-polish-20260927
      - name: Build actual production bundle
        id: build
        run: bun run --filter @lmm/web build
      - name: Frontend quality gates
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web bundle:check
      - name: Install isolated browser
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/home-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/home-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review homepage in real Chromium
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p artifacts/home-review
          bun run preview --host 127.0.0.1 --port 4175 >artifacts/home-review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<60; attempt++)); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/home-browser/node_modules/playwright/index.mjs" node scripts/home-design-review.mjs
      - name: Preserve source revision and review evidence
        if: always()
        run: |
          mkdir -p apps/web/artifacts/home-review
          git rev-parse HEAD > apps/web/artifacts/home-review/revision.txt
          git archive --format=tar.gz --output=apps/web/artifacts/home-review/source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: homepage-refined-review
          path: apps/web/artifacts/home-review/
          retention-days: 7
          if-no-files-found: error
