name: Referral development workspace

on:
  push:
    branches: [codex/referral-first-topup-20260916]
    paths: [.github/workflows/referral-development.yml]

permissions:
  contents: write

jobs:
  source:
    if: github.ref == 'refs/heads/codex/referral-first-topup-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/referral-first-topup-20260916
      - name: Verify and apply reviewed patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = pathlib.Path('scripts/referral-development.patch.gz.b64').read_text()
          for before, after in [
              ('EXnqJfzZN/UK1URh72eZb6U9f82TTOvJZYEcN4PI6', 'EXnqJfzZN/UK1URh72eZ6U9f82TTOvJZYEcN4PI6'),
              ('xjdAgCaZGTfYJ2g2SGTKJrrDKbUA5uOKRRoub15Vt', 'xjdAgCaZGTfYJ2g2SGTKrrDKbUA5uOKRRoub15Vt'),
              ('yUElnHOG+Z7PKpRpYrbdq3oRWxsWyFKol3Kcnd4vV', 'yUElnHOG+Z7PKpRpYrbd3oRWxsWyFKol3Kcnd4vV'),
          ]:
              assert encoded.count(before) == 1
              encoded = encoded.replace(before, after)
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '3b1c0d441cfbbfbf7388b0da48a18ba7e8dd015cabd9b8b497ac30ceb1ff2bd9'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git config user.name 'LIghtJUNction'
          git config user.email 'lightjunction.me@gmail.com'
          git commit -m 'feat: award first paid referrals with audited clawbacks and debt recovery'
          git push origin HEAD:refs/heads/codex/referral-first-topup-20260916
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Referral and existing accounting tests
        working-directory: apps/api-go
        env:
          GOMAXPROCS: '2'
        run: go test -p 2 ./setting/operation_setting ./model ./controller -count=1
