name: Referral development workspace
on:
  push:
    branches: [codex/referral-first-topup-20260916]
    paths: [.github/workflows/referral-development.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Referral and accounting regression tests
        working-directory: apps/api-go
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          go test -p 2 ./setting/operation_setting ./model ./controller -count=1 2>&1 | tee ../../referral-tests.log
      - name: Export tested source
        if: always()
        run: git archive --format=tar.gz --output=referral-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: referral-tested-source
          path: |
            referral-source.tar.gz
            referral-tests.log
          retention-days: 1
