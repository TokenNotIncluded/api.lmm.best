name: L0-L1 isolated workbench
on:
  push:
    branches: [work/l0-l1-retirement-20261009]
    paths: [.github/workflows/l0-l1-workbench.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: l0_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d l0_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 60b9e6500084dc6ae4c4f734ffa353d7f4d13e6c
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: candidate/apps/api-go/go.mod
          cache-dependency-path: candidate/apps/api-go/go.sum
      - name: Load reviewed candidate
        id: load
        run: |
          mkdir -p "$RUNNER_TEMP/l0-result"
          python3 workbench/.workbench/apply-l0.py candidate
          git -C candidate diff --cached --check
      - name: Install locked dependencies
        id: install
        working-directory: candidate
        run: bun install --frozen-lockfile
      - name: Format changed frontend paths
        id: format
        working-directory: candidate/apps/web
        run: |
          bun run format > "$RUNNER_TEMP/l0-result/format.log" 2>&1
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('../..').resolve().parent
          allowed=set(json.loads((root.parent/'l0-paths.json').read_text()))
          dirty=subprocess.check_output(['git','diff','--name-only'],cwd=root,text=True).splitlines()
          for path in dirty:
              if path not in allowed:
                  subprocess.run(['git','restore','--worktree','--',path],cwd=root,check=True)
          PY
          bun run format:check >> "$RUNNER_TEMP/l0-result/format.log" 2>&1
      - name: Frontend types and lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          failed=0
          for command in typecheck lint copyright:check; do
            if ! bun run "$command" > "$RUNNER_TEMP/l0-result/$command.log" 2>&1; then cat "$RUNNER_TEMP/l0-result/$command.log"; failed=1; fi
          done
          exit "$failed"
      - name: Frontend regression
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          failed=0
          for file in $(find src/features/onboarding src/features/todos src/features/assistant src/features/support-ticket src/routes/_authenticated/todos src/lib/__tests__ -name '*.test.ts' -o -name '*.test.tsx' | sort); do
            echo "FILE: $file" >> "$RUNNER_TEMP/l0-result/web-tests.log"
            if ! bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" >> "$RUNNER_TEMP/l0-result/web-tests.log" 2>&1; then failed=1; fi
          done
          if grep -Eq '^# fail [1-9]|^not ok |^[[:space:]]*[1-9][0-9]* fail' "$RUNNER_TEMP/l0-result/web-tests.log"; then failed=1; fi
          tail -n 40 "$RUNNER_TEMP/l0-result/web-tests.log"
          exit "$failed"
      - name: Backend regression with PostgreSQL
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        working-directory: candidate/apps/api-go
        env:
          TEST_POSTGRES_DSN: postgres://test:isolated-test-only@127.0.0.1:5432/l0_test?sslmode=disable
        run: |
          go test -p 2 ./middleware ./router ./model ./controller -run 'Test(.*Assistant.*|.*DeveloperAccess.*|.*UnifiedTodo.*|.*ConsoleAccess.*|.*PreActivation.*|.*Paid.*)' -count=1 -timeout=10m 2>&1 | tee "$RUNNER_TEMP/l0-result/go-tests.log"
      - name: Frontend production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          bun run build > "$RUNNER_TEMP/l0-result/build.log" 2>&1
          bun run bundle:check >> "$RUNNER_TEMP/l0-result/build.log" 2>&1
      - name: Export candidate and evidence
        if: ${{ always() && steps.load.outcome == 'success' }}
        working-directory: candidate
        run: |
          git diff HEAD --binary > "$RUNNER_TEMP/l0-result/candidate.patch"
          git diff HEAD --stat > "$RUNNER_TEMP/l0-result/diff-stat.txt"
          git diff HEAD --check > "$RUNNER_TEMP/l0-result/diff-check.txt"
          git add --update
          git -c user.name='L0 review' -c user.email='review@example.invalid' commit -m 'isolated candidate source snapshot'
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/l0-result/candidate.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-result/source-commit.txt"
          cp ../l0-paths.json "$RUNNER_TEMP/l0-result/paths.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l0-l1-candidate-review
          path: ${{ runner.temp }}/l0-result/
          retention-days: 4
