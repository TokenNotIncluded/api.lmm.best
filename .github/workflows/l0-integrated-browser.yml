name: L0 integrated browser review
on:
  push:
    branches: [work/l0-l1-integration-20261009]
    paths: [.github/workflows/l0-integrated-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: f32e6ee949a66089a3ba91857d568d00f2327164
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare temporary browser fixtures only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l0-browser-result" "$RUNNER_TEMP/l0-browser-fixtures"
          git show eee8762dca7d59149c65991ff0061d51a9c9401f:.workbench/prepare-browser.py > "$RUNNER_TEMP/l0-browser-fixtures/prepare-browser.py"
          git show eee8762dca7d59149c65991ff0061d51a9c9401f:.workbench/l0-browser.mjs > "$RUNNER_TEMP/l0-browser-fixtures/l0-browser.mjs"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'l0-browser-fixtures/l0-browser.mjs'
          s=p.read_text()
          s=s.replace("[[1440, 'dark'], [390, 'light']]", "[[1440, 'dark'], [1440, 'light'], [390, 'dark'], [390, 'light']]")
          s=s.replace('    await context.addInitScript(() => {', "    await context.addCookies([{ name: 'vite-ui-theme', value: colorScheme, url: origin }])\n    await context.addInitScript(() => {")
          s=s.replace('report.length === 2', 'report.length === 4')
          s=s.replace('${width}.png', '${width}-${colorScheme}.png')
          needle="      await page.getByTestId('l0-contact-support').click()"
          assert needle in s
          s=s.replace(needle, """      assert.equal(await page.evaluate(theme => document.documentElement.classList.contains(theme), colorScheme), true, 'Requested theme must really be active')
                await page.getByTestId('l0-free-access').waitFor()
                await page.locator('#l0-tab-access').click()
                assert.doesNotMatch(await page.locator('body').innerText(), /Access request rejected|Awaiting review|AI recommendation|Revise application/)
                const size = await page.evaluate(() => ({ width: innerWidth, scroll: document.documentElement.scrollWidth }))
                assert.ok(size.scroll <= size.width, 'L0 page must not overflow')
                await page.screenshot({ path: path.join(output, `l0-access-${width}-${colorScheme}.png`), fullPage: true, animations: 'disabled' })
          """+needle)
          needle="        assert.equal(await page.locator('[data-sonner-toast][data-type=\"error\"]:visible').count(), 0)"
          assert needle in s
          s=s.replace(needle, needle+"\n        await page.screenshot({ path: path.join(output, `${destination.slice(1)}-${width}-${colorScheme}.png`), fullPage: true, animations: 'disabled' })")
          p.write_text(s)
          PY
          python3 "$RUNNER_TEMP/l0-browser-fixtures/prepare-browser.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/l0-browser-run.mjs"
      - name: Install locked app and isolated browser
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/l0-browser" playwright@1.51.1
          "$RUNNER_TEMP/l0-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check real routes and components with isolated API fixtures
        env:
          L0_BROWSER_OUTPUT: ${{ runner.temp }}/l0-browser-result
        run: |
          set -euo pipefail
          (cd apps/web && LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174) > "$RUNNER_TEMP/l0-browser-result/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" = 1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/l0-browser/node_modules/playwright/index.mjs" node "$RUNNER_TEMP/l0-browser-run.mjs" 2>&1 | tee "$RUNNER_TEMP/l0-browser-result/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l0-integrated-browser-evidence
          path: ${{ runner.temp }}/l0-browser-result
          retention-days: 3
