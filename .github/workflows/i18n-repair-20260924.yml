          for (const [locale, values] of Object.entries(corrections)) {
            const file = path.join(localeDir, `${locale}.json`)
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'))
            let changed = 0
            for (const [key, value] of Object.entries(values)) {
              if (!(key in doc.translation)) {
                console.log(`${locale}: key not present, skipped: ${key}`)
                continue
              }
              if (doc.translation[key] !== value) {
                doc.translation[key] = value
                changed++
              }
            }
            doc.translation = Object.fromEntries(
              Object.entries(doc.translation).sort(([a], [b]) => a.localeCompare(b))
            )
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + '\n')
            console.log(`${locale}: ${changed} repairs applied`)
          }
          NODE

      - name: Normalize locale files
        working-directory: apps/web
        run: node scripts/sync-i18n.mjs

      - name: Write diagnostics
        shell: bash
        run: |
          mkdir -p .tmp
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const dir = path.resolve('apps/web/src/i18n/locales')
          const locales = ['en', 'fr', 'ja', 'ru', 'vi']
          const data = Object.fromEntries(locales.map((locale) => [
            locale,
            JSON.parse(fs.readFileSync(path.join(dir, `${locale}.json`), 'utf8')).translation,
          ]))
          const placeholders = (s) =>
            [...String(s).matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map((m) => m[1].trim()).sort()
          const equal = (a, b) => JSON.stringify(a) === JSON.stringify(b)
          const literal = /^(?:https?:\/\/|\/|[A-Z0-9_.:/ -]+$)|(?:OpenAI|Claude|Gemini|GitHub|Stripe|Cloudflare|DeepSeek|Linux|macOS|SSL|TLS|API|OAuth|OIDC|JSON|HTTP|URL|TTFT|Top P|Waffo|WeChat|Vertex|ChatGPT|Baidu|Uptime|CC Switch)/i
          const report = {}
          for (const locale of ['fr', 'ja', 'ru', 'vi']) {
            const issues = []
            for (const [key, enValueRaw] of Object.entries(data.en)) {
              const enValue = String(enValueRaw ?? '')
              const value = String(data[locale][key] ?? '')
              const reasons = []
              if (!equal(placeholders(enValue), placeholders(value))) reasons.push('placeholder-mismatch')
              if (/__\s*PH_\d+\s*__/i.test(value)) reasons.push('machine-placeholder')
              if (value === enValue && enValue.length >= 6 && /[A-Za-z]{3,}/.test(enValue) && !literal.test(enValue)) reasons.push('same-as-english')
              if (locale !== 'ja' && /[\u3040-\u30ff\u3400-\u9fff]/.test(value) && !value.includes('支付宝')) reasons.push('cjk-leak')
              if (enValue.length >= 40 && value.length / enValue.length < 0.18) reasons.push('possible-truncation')
              if (reasons.length) issues.push({ key, en: enValue, value, reasons })
            }
            report[locale] = issues
          }
          fs.writeFileSync('.tmp/i18n-diagnostics.json', JSON.stringify(report, null, 2) + '\n')
          NODE

      - name: Commit generated locale repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/i18n/locales .tmp/i18n-diagnostics.json
          if git diff --cached --quiet; then
            echo "No generated i18n changes"
            exit 0
          fi
          git commit -m "fix(i18n): complete non-English translation repairs [i18n-repair-applied]"
          git push
