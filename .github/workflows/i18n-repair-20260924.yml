name: Temporary i18n quality repair

on:
  push:
    branches:
      - fix/i18n-quality-20260924
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/i18n-quality-20260924

      - name: Apply translation repairs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const localeDir = path.resolve('apps/web/src/i18n/locales')
          const corrections = {
            fr: {
              'Client model matching': 'Correspondance du modèle client',
              'Client model matching help': 'Aide sur la correspondance du modèle client',
              'Routes with the same incoming path are split by client model rules. Unmatched requests use the final fallback.':
                'Les routes ayant le même chemin entrant sont réparties selon les règles du modèle client. Les requêtes sans correspondance utilisent la dernière route de secours.',
              'Rules match the original model value from the client request body.':
                'Les règles correspondent à la valeur d’origine du champ model dans le corps de la requête client.',
              'A brief description in your own words is enough to start. There is no difficult puzzle or application letter.':
                'Une brève description avec vos propres mots suffit pour commencer. Il n’y a ni test compliqué ni lettre de candidature à rédiger.',
            },
            ja: {
              '{"original-model": "replacement-model"}': '{"original-model": "replacement-model"}',
              'API info added. Click "Save Settings" to apply.':
