name: Rust 327 minimal lock verification

on:
  push:
    branches:
      - automation/rust-327-minimal-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TOOLCHAIN: "1.91.0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose

      - name: Repair pre-existing percent-encoding checksum only
        run: |
          lock=apps/api-rust/tests/root-route-acceptance/Cargo.lock
          sed -i 's/9b4f627cb1b25917193a259e49bd08f671f8d9708acfd5fe0a8c1455d87220/9b4f627cb1b25917193a259e49bdad08f671f8d9708acfd5fe0a8c1455d87220/' "$lock"
          git diff --check

      - name: Fetch locked acceptance harness dependencies
        run: cargo fetch --locked --manifest-path apps/api-rust/tests/root-route-acceptance/Cargo.toml

      - name: Run locked acceptance support tests
        run: bash apps/api-rust/tests/scripts/test-root-route-acceptance.sh

      - name: Run locked runtime acceptance harness
        run: bash apps/api-rust/tests/scripts/run-root-route-acceptance.sh
