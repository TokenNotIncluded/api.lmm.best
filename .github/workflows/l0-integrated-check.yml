name: L0 integrated verification
on:
  push:
    branches: [work/l0-l1-retirement-20261009]
    paths: [.github/workflows/l0-integrated-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: l0_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d l0_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: candidate
          ref: da5572f5d1289dc4be21e672acaf1803c7167958
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.25.1'
          cache-dependency-path: candidate/apps/api-go/go.sum
      - name: Merge pinned current main without discarding either side
        id: merge
        run: |
          mkdir -p "$RUNNER_TEMP/l0-integrated"
          git -C candidate config user.name ChatGPT
          git -C candidate config user.email chatgpt@users.noreply.github.com
          git -C candidate merge --no-commit --no-ff 43be129a2120254eac260f61fe60f22f09995b66 > "$RUNNER_TEMP/l0-integrated/merge.log" 2>&1 || true
          python3 workbench/.workbench/merge-json.py candidate
          test -z "$(git -C candidate diff --name-only --diff-filter=U)"
          git -C candidate rev-parse MERGE_HEAD
          (cd candidate/apps/api-go && go generate ./controller)
          git -C candidate diff HEAD --check
      - name: Locked dependencies and formatting
        id: format
        working-directory: candidate
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bun run format) > "$RUNNER_TEMP/l0-integrated/format.log" 2>&1
          python3 - <<'PY'
          import subprocess
          for path in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              if not path.startswith('apps/web/src/i18n/locales/') and path != 'apps/api-go/controller/assistant_admin_operation_contracts.json':
                  subprocess.run(['git','restore','--worktree','--',path],check=True)
          PY
          (cd apps/web && bun run format:check) >> "$RUNNER_TEMP/l0-integrated/format.log" 2>&1
          git add --update
          git commit -m 'merge: reconcile current main with L0 activation and support fixes'
          git rev-parse HEAD > "$RUNNER_TEMP/l0-integrated/source-commit.txt"
      - name: Web checks
        id: web
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          failed=0
          for command in typecheck lint copyright:check; do
            file="${command//:/-}"
            if ! bun run "$command" > "$RUNNER_TEMP/l0-integrated/$file.log" 2>&1; then cat "$RUNNER_TEMP/l0-integrated/$file.log"; failed=1; fi
          done
          for file in $(find src/features/onboarding src/features/todos src/features/assistant src/features/support-ticket src/routes/_authenticated/todos src/lib/__tests__ -name '*.test.ts' -o -name '*.test.tsx' | sort); do
            echo "FILE: $file" >> "$RUNNER_TEMP/l0-integrated/web-tests.log"
            if ! bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" >> "$RUNNER_TEMP/l0-integrated/web-tests.log" 2>&1; then failed=1; fi
          done
          if grep -Eq '^# fail [1-9]|^not ok |^[[:space:]]*[1-9][0-9]* fail' "$RUNNER_TEMP/l0-integrated/web-tests.log"; then failed=1; fi
          exit "$failed"
      - name: Go checks including explicitly enabled PostgreSQL integration
        id: go
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        working-directory: candidate/apps/api-go
        env:
          TEST_POSTGRES_DSN: postgres://test:isolated-test-only@127.0.0.1:5432/l0_test?sslmode=disable
          TEST_POSTGRES_ISOLATED_SCHEMA: '1'
        run: |
          go test -json -p 2 ./middleware ./router ./model ./controller -run 'Test(.*Assistant.*|.*Registration.*|.*DeveloperAccess.*|.*UnifiedTodo.*|.*ConsoleAccess.*|.*PreActivation.*|.*Paid.*)' -count=1 -timeout=10m > "$RUNNER_TEMP/l0-integrated/go-tests.jsonl"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'l0-integrated/go-tests.jsonl'
          events=[json.loads(line) for line in p.read_text().splitlines()]
          passed={e.get('Test') for e in events if e.get('Action')=='pass'}
          required={'TestAssistantDirectL1GrantConcurrentCallsPostgres','TestPostgresUnifiedTodoUsesOneSnapshot','TestAssistantDirectL1GrantFromFirstHTTPMessageWithoutConversationID'}
          assert required <= passed, required-passed
          skipped=[e.get('Test') for e in events if e.get('Action')=='skip']
          (p.parent/'postgres-receipt.json').write_text(json.dumps({'required_passes':sorted(required),'skipped':skipped},indent=2))
          PY
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        working-directory: candidate/apps/web
        run: |
          bun run build > "$RUNNER_TEMP/l0-integrated/build.log" 2>&1
          bun run bundle:check >> "$RUNNER_TEMP/l0-integrated/build.log" 2>&1
      - name: Push verified merge to the existing PR branch only
        if: ${{ !cancelled() && steps.web.outcome == 'success' && steps.go.outcome == 'success' && steps.build.outcome == 'success' }}
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          git diff 43be129a2120254eac260f61fe60f22f09995b66 HEAD --check
          askpass="$RUNNER_TEMP/l0-integrated-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token;; *) printf "%s\n" "$GH_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/fix/l0-onboarding-and-support-20261009
          rm -f "$askpass"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-integrated/published-commit.txt"
      - name: Save source and verification evidence
        if: always()
        working-directory: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/l0-integrated"
          git status --short > "$RUNNER_TEMP/l0-integrated/status.txt"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/l0-integrated/conflicts.txt"
          git diff 43be129a2120254eac260f61fe60f22f09995b66 HEAD --binary > "$RUNNER_TEMP/l0-integrated/candidate.patch"
          git diff 43be129a2120254eac260f61fe60f22f09995b66 HEAD --stat > "$RUNNER_TEMP/l0-integrated/diff-stat.txt"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/l0-integrated/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l0-integrated-evidence
          path: ${{ runner.temp }}/l0-integrated/
          retention-days: 4
