name: Assistant surface review
on:
  push:
    branches: [fix/assistant-single-surface-20260923]
permissions:
  contents: write
concurrency:
  group: assistant-surface-bootstrap
  cancel-in-progress: false
jobs:
  implement-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-single-surface-20260923
          fetch-depth: 10
      - name: Apply verified implementation and remove staging payload
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          p=Path('.github/assistant-surface.patch.b64')
          data=p.read_text()
          for start,end,text in [(6862,6863,''),(3441,3441,'9'),(208,211,'')]:
              data=data[:start]+text+data[end:]
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2926a23f1f8fb62fe03d7a7fbe2e2b93d2073f419afc69e5f81aa7fe1b74253d'
          Path('/tmp/assistant.patch').write_bytes(patch)
          original=subprocess.check_output(['git','show','e2cd0dd5d6e96f480994fc7640c3d283a67acc1e:.github/workflows/assistant-surface-review.yml'])
          Path('.github/workflows/assistant-surface-review.yml').write_bytes(original)
          subprocess.run(['git','apply','--check','/tmp/assistant.patch'],check=True)
          subprocess.run(['git','apply','/tmp/assistant.patch'],check=True)
          p.unlink()
          PY
          git add apps/web/src apps/web/scripts/visual-review/assistant_surface_review.py .github/assistant-surface.patch.b64
          git diff --cached --name-only --diff-filter=ACMR > /tmp/assistant-changed-files
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format and commit only requested frontend changes
        run: |
          bun run format:web
          xargs -d '\n' git add -- < /tmp/assistant-changed-files
          git restore --source=HEAD --staged --worktree .github/workflows/assistant-surface-review.yml
          git restore .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): single L0 conversation and compact assistant surfaces'
          git push origin HEAD:fix/assistant-single-surface-20260923
          mkdir -p output/assistant-review
          git rev-parse HEAD > output/assistant-review/commit.txt
      - name: Typecheck
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck:web 2>&1 | tee output/assistant-review/typecheck.log
      - name: Assistant and L0 regression tests
        id: tests
        continue-on-error: true
        working-directory: apps/web
        run: |
          set +e
          failed=0
          while IFS= read -r test; do
            bun test "$test" >> ../../output/assistant-review/tests.log 2>&1 || failed=1
          done < <(find src/features/assistant src/features/onboarding -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          tail -100 ../../output/assistant-review/tests.log
          exit "$failed"
      - name: Build
        run: |
          set -o pipefail
          bun run build:web 2>&1 | tee output/assistant-review/build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise real routes
        id: visual
        continue-on-error: true
        run: |
          set -o pipefail
          python apps/web/scripts/visual-review/assistant_surface_review.py 2>&1 | tee output/assistant-review/visual.log
      - name: Package review build and source
        if: always()
        run: |
          mkdir -p output/assistant-review
          git archive --format=tar.gz -o output/assistant-review/source.tar.gz HEAD
          if [ -d apps/web/dist ]; then tar czf output/assistant-review/dist.tar.gz -C apps/web dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-surface-review
          path: output/assistant-review
          retention-days: 7
      - name: Require successful verification
        if: steps.types.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.visual.outcome == 'failure'
        run: exit 1
