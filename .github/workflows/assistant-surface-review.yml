name: Assistant surface review

on:
  pull_request:
    paths:
      - 'apps/web/src/features/assistant/**'
      - 'apps/web/src/features/onboarding/**'
      - 'apps/web/src/components/layout/**'
      - 'apps/web/scripts/visual-review/**'
      - '.github/workflows/assistant-surface-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-surface-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare evidence directory
        run: |
          mkdir -p output/assistant-review
          git rev-parse HEAD > output/assistant-review/commit.txt
      - name: Lint assistant and layout components
        working-directory: apps/web
        run: |
          ../../node_modules/.bin/oxlint -c .oxlintrc.json src/features/onboarding/l0-welcome.tsx src/features/assistant/assistant-panel.tsx src/features/assistant/assistant-new-user-gift.tsx src/features/assistant/assistant-support-controls.tsx src/features/assistant/assistant-launcher.tsx src/components/layout/components/app-header.tsx src/components/layout/components/authenticated-layout.tsx
      - name: Typecheck
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck:web 2>&1 | tee output/assistant-review/typecheck.log
      - name: Assistant, L0 and layout regression tests
        id: tests
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          failed=0
          while IFS= read -r test; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" >> ../../output/assistant-review/tests.log 2>&1 || failed=1
          done < <(find src/features/assistant src/features/onboarding src/components/layout -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          if grep -Eq '\(fail\)|^[[:space:]]*[1-9][0-9]* fail$' ../../output/assistant-review/tests.log; then failed=1; fi
          tail -100 ../../output/assistant-review/tests.log
          exit "$failed"
      - name: Build
        run: |
          set -o pipefail
          bun run build:web 2>&1 | tee output/assistant-review/build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review real routes
        id: visual
        continue-on-error: true
        run: |
          set -o pipefail
          python apps/web/scripts/visual-review/assistant_surface_review.py 2>&1 | tee output/assistant-review/visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-surface-review
          path: output/assistant-review
          retention-days: 7
      - name: Require successful verification
        if: steps.types.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.visual.outcome == 'failure'
        run: exit 1
