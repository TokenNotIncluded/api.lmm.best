name: Assistant surface review

on:
  push:
    branches: [fix/assistant-single-surface-20260923]

permissions:
  contents: read

concurrency:
  group: assistant-surface-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/assistant-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-review-source
          path: /tmp/assistant-review-source.tar.gz
          retention-days: 1
