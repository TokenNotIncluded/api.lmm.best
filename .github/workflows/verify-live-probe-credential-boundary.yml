name: Verify live production probe credential boundary
on:
  push:
    branches: [release/acceptance-20260916]
    paths: [.github/workflows/verify-live-probe-credential-boundary.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a861cb28b53e497c7b6637cb6d6aecbb58aa1cb0
          sparse-checkout: .github/workflows/diagnose-production-auth-probe.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compare exact former and corrected selection using the protected read-only harness
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          source=Path('.github/workflows/diagnose-production-auth-probe.yml').read_text()
          shell=textwrap.dedent(source.split('        run: |\n',1)[1])
          old='SELECT tokens.key FROM tokens JOIN users'
          assert shell.count(old)==1
          shell=shell.replace(old,'SELECT tokens.key, tokens.oauth_managed FROM tokens JOIN users')
          old='tokens=result.stdout.splitlines()'
          assert shell.count(old)==1
          shell=shell.replace(old,"rows=[line.split('|') for line in result.stdout.splitlines()]\n    report['oauth_managed_by_rank']=[row[1]=='t' for row in rows]\n    tokens=[row[0] for row in rows]")
          old="entry['available_probe_models']=[model for model in cheap if model in ids]"
          assert shell.count(old)==1
          shell=shell.replace(old,old+"\n                        entry['text_probe_models'] = sorted(model for model in ids if isinstance(model,str) and re.fullmatch(r'(?:gpt|claude|gemini|grok|deepseek)[A-Za-z0-9._:/-]{1,100}',model))[:12]")
          print('Former selection classification; no credential contents are printed.',flush=True)
          subprocess.run(['bash','-euo','pipefail','-c',shell],check=True)
          old='AND COALESCE(LENGTH(BTRIM(tokens.allow_ips)),0)=0'
          assert shell.count(old)==1
          corrected=shell.replace(old,old+"\nAND COALESCE((to_jsonb(tokens)->>'oauth_managed')::boolean,false)=false")
          print('Corrected selection classification and real authenticated GET results.',flush=True)
          subprocess.run(['bash','-euo','pipefail','-c',corrected],check=True)
          PY
