name: Store support feature verification
on:
  push:
    branches: [feat/store-customer-support]
permissions:
  contents: write
concurrency:
  group: store-support-feature-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Preserve current main and merge translation keys
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/store-customer-support
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main=1b612cc9b457c22bbe5f415d635d31f808ea1710
          git cat-file -e "$main^{commit}"
          if ! git merge-base --is-ancestor "$main" HEAD; then
            git merge --no-commit --no-ff "$main" || {
              python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          missing = object()
          def merge(base, ours, theirs, location):
              if ours == base: return theirs
              if theirs == base or ours == theirs: return ours
              if all(isinstance(value, dict) for value in (base, ours, theirs)):
                  result = {}
                  for key in dict.fromkeys([*theirs, *ours, *base]):
                      value = merge(base.get(key, missing), ours.get(key, missing), theirs.get(key, missing), location + '/' + key)
                      if value is not missing: result[key] = value
                  return result
              raise AssertionError('Different edits to the same value: ' + location)
          files = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          assert files, 'merge failed without translation conflicts'
          for name in files:
              assert name.startswith('apps/web/src/i18n/locales/') and name.endswith('.json'), 'Unreviewed conflict: ' + name
              versions = [json.loads(subprocess.check_output(['git', 'show', f':{stage}:{name}'], text=True)) for stage in (1, 2, 3)]
              result = merge(*versions, name)
              Path(name).write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
              subprocess.run(['git', 'add', '--', name], check=True)
          PY
            }
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Format feature changes
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w apps/api-go/model/merchant_store_support*.go apps/api-go/model/merchant_store_customers.go apps/api-go/controller/merchant_store_support.go apps/api-go/router/merchant_store_support*.go apps/api-go/middleware/merchant_store_support_rate_limit.go
          cd apps/web
          bun run oxlint -c .oxlintrc.json --fix src/features/store/support*.ts src/features/store/support*.tsx src/routes/store/support.tsx
          bun run oxfmt --write src/features/store/support*.ts src/features/store/support*.tsx src/routes/store/support.tsx
      - name: Build Web and generate route tree
        id: build
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run build 2>&1 | tee "$RUNNER_TEMP/support-build.log"
      - name: Commit integration to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/store-customer-support
          git diff --check
          git add -u apps/api-go apps/web/src
          if ! git diff --cached --quiet; then
            git commit -m 'merge: preserve current main and validate store customer support'
            git push origin HEAD:refs/heads/feat/store-customer-support
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/support-source-sha.txt"
          echo "Tested source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Web support and navigation tests
        id: web
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(src/features/store/support*.test.ts src/features/store/support*.test.tsx src/features/store/store-navigation*.test.ts src/features/store/store-navigation*.test.tsx src/features/store/categories-interactions.test.tsx)
          result=0
          for file in "${tests[@]}"; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee -a "$RUNNER_TEMP/support-web.log" || result=1
          done
          exit "$result"
      - name: Web type check
        id: types
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run typecheck 2>&1 | tee "$RUNNER_TEMP/support-types.log"
      - name: Feature lint
        id: lint
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run oxlint -c .oxlintrc.json src/features/store/support*.ts src/features/store/support*.tsx src/routes/store/support.tsx 2>&1 | tee "$RUNNER_TEMP/support-lint.log"
      - name: Support and customer Go regression tests
        id: go
        continue-on-error: true
        working-directory: apps/api-go
        shell: bash
        run: |
          set -o pipefail
          go test -race -p 2 ./model ./controller ./router -run 'TestMerchantStoreSupport|TestMerchantStoreCustomers|TestMerchantStoreBalanceTransfersSnapshotsAndReplay' -count=1 -json 2>&1 | tee "$RUNNER_TEMP/support-go.jsonl"
      - name: Concurrent retry repetition
        id: concurrent
        continue-on-error: true
        working-directory: apps/api-go
        shell: bash
        run: |
          set -o pipefail
          go test -race -p 2 ./model -run '^TestMerchantStoreSupportConcurrentReplay$' -count=20 -json 2>&1 | tee "$RUNNER_TEMP/support-concurrent.jsonl"
      - name: Verify tests did not modify source
        if: always()
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-support-verification
          path: |
            ${{ runner.temp }}/support-*.log
            ${{ runner.temp }}/support-*.jsonl
            ${{ runner.temp }}/support-source-sha.txt
          retention-days: 7
      - name: Require all feature checks
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          GO: ${{ steps.go.outcome }}
          WEB: ${{ steps.web.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          CONCURRENT: ${{ steps.concurrent.outcome }}
        shell: bash
        run: |
          printf 'build=%s go=%s web=%s types=%s lint=%s concurrent=%s\n' "$BUILD" "$GO" "$WEB" "$TYPES" "$LINT" "$CONCURRENT"
          test "$BUILD/$GO/$WEB/$TYPES/$LINT/$CONCURRENT" = success/success/success/success/success/success
