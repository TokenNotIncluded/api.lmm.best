name: Store support feature verification
on:
  push:
    branches: [feat/store-customer-support]
permissions:
  contents: write
concurrency:
  group: store-support-feature-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Integrate reviewed modules and translations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/store-customer-support
          python3 - <<'PY'
          import re, subprocess, textwrap
          from pathlib import Path
          if 'setMerchantStoreSupportRoutes(parent)' not in Path('apps/api-go/router/merchant_store_router.go').read_text():
              original = subprocess.check_output(['git', 'show', 'ba6ba1cb3b8ce8f819a1cb63dc2a839f1a309f3c:.github/workflows/store-support-check.yml'], text=True)
              match = re.search(r"^          python3 - <<'PY'\n(.*?)^          PY$", original, re.M | re.S)
              assert match, 'reviewed integration script not found'
              exec(compile(textwrap.dedent(match.group(1)), '<reviewed-store-support-integration>', 'exec'))
          path = Path('apps/api-go/model/merchant_store_support.go')
          text = path.read_text()
          text = re.sub(r'^\s*BodyDigest\s+string[^\n]*\n', '', text, flags=re.M)
          old = '\t\t\tif result.BodyDigest != storeHash(body) {'
          new = '\t\t\tprevious, decryptErr := storeDecrypt("support-message", id+":"+requestKey+":"+strconv.Itoa(actor), result.Ciphertext)\n\t\t\tif decryptErr != nil {\n\t\t\t\treturn decryptErr\n\t\t\t}\n\t\t\tif previous != body {'
          text = text.replace(old, new).replace('BodyDigest: storeHash(body), ', '')
          path.write_text(text)
          path = Path('apps/api-go/model/merchant_store_customers.go')
          text = path.read_text().replace('if in.Revision < 0 || !utf8.ValidString', 'if in.Revision < 0 || in.Revision >= 9007199254740991 || !utf8.ValidString')
          path.write_text(text)
          path = Path('docs/merchant-store-support.md')
          path.write_text(path.read_text().replace('密文、重试摘要及内部索引', '密文及内部索引'))
          PY
          gofmt -w apps/api-go/model/merchant_store_support*.go apps/api-go/model/merchant_store_customers.go apps/api-go/model/main.go apps/api-go/controller/merchant_store_support.go apps/api-go/router/merchant_store_support.go apps/api-go/router/merchant_store_router.go
          cd apps/web
          bun run oxfmt --write src/features/store/support*.ts src/features/store/support*.tsx src/features/store/store-navigation.tsx src/features/store/orders-page.tsx src/features/store/product-page.tsx src/routes/store/support.tsx
      - name: Build Web and generate route tree
        id: build
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run build 2>&1 | tee "$RUNNER_TEMP/support-build.log"
      - name: Commit integration to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/store-customer-support
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u apps/api-go apps/web/src docs/merchant-store-support.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat(store): integrate support routes, contact links and translations'
            git push origin HEAD:refs/heads/feat/store-customer-support
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/support-source-sha.txt"
          echo "Tested source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Web support and navigation tests
        id: web
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(src/features/store/support*.test.ts src/features/store/support*.test.tsx src/features/store/store-navigation*.test.ts src/features/store/store-navigation*.test.tsx src/features/store/categories-interactions.test.tsx)
          result=0
          for file in "${tests[@]}"; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee -a "$RUNNER_TEMP/support-web.log" || result=1
          done
          exit "$result"
      - name: Web type check
        id: types
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run typecheck 2>&1 | tee "$RUNNER_TEMP/support-types.log"
      - name: Feature lint
        id: lint
        continue-on-error: true
        working-directory: apps/web
        shell: bash
        run: set -o pipefail; bun run oxlint -c .oxlintrc.json src/features/store/support*.ts src/features/store/support*.tsx src/routes/store/support.tsx 2>&1 | tee "$RUNNER_TEMP/support-lint.log"
      - name: Existing Go baseline at original main revision
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/support-baseline" 6777280b2e32f15e8e3793988ee90d57cba33662
          cd "$RUNNER_TEMP/support-baseline/apps/api-go"
          go test -p 2 ./model -run '^TestMerchantStoreBalanceTransfersSnapshotsAndReplay$' -count=1 2>&1 | tee "$RUNNER_TEMP/support-baseline.log"
      - name: Support and customer Go regression tests
        id: go
        continue-on-error: true
        working-directory: apps/api-go
        shell: bash
        run: |
          set -o pipefail
          go test -race -p 2 ./model ./controller ./router -run 'TestMerchantStoreSupport|TestMerchantStoreCustomers|TestMerchantStoreBalanceTransfersSnapshotsAndReplay' -count=1 -json 2>&1 | tee "$RUNNER_TEMP/support-go.jsonl"
      - name: Verify tests did not modify source
        if: always()
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-support-verification
          path: |
            ${{ runner.temp }}/support-*.log
            ${{ runner.temp }}/support-*.jsonl
            ${{ runner.temp }}/support-source-sha.txt
          retention-days: 7
      - name: Require all feature checks
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          GO: ${{ steps.go.outcome }}
          WEB: ${{ steps.web.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          printf 'build=%s go=%s web=%s types=%s lint=%s\n' "$BUILD" "$GO" "$WEB" "$TYPES" "$LINT"
          test "$BUILD/$GO/$WEB/$TYPES/$LINT" = success/success/success/success/success
