name: Apply scoped homepage patch

on:
  push:
    branches: [codex/homepage-polish-20260926]
    paths: ['.github/workflows/homepage-apply-once.yml']

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/codex/homepage-polish-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Apply explicit presentation changes
        run: python3 .github/homepage-polish.py
      - name: Format the two modified frontend files
        working-directory: apps/web
        run: ../../node_modules/.bin/oxfmt -c .oxfmtrc.json --write src/features/forge/forge-home.css scripts/home-design-review.mjs
      - name: Commit only reviewed paths to the work branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/homepage-polish-20260926
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          for path in apps/web/src/features/forge/forge-home.css apps/web/scripts/home-design-review.mjs; do
            if git diff --quiet -- "$path"; then continue; fi
            blob=$(git rev-parse "HEAD:$path")
            jq -n --arg branch "$BRANCH" --arg sha "$blob" \
              --arg content "$(base64 -w0 "$path")" \
              --arg message 'style(web): lighten homepage hierarchy and clear mobile navigation' \
              '{branch:$branch,sha:$sha,content:$content,message:$message}' > "$RUNNER_TEMP/home-change.json"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              --input "$RUNNER_TEMP/home-change.json" --jq .commit.sha
          done
