name: PR 477 validated ledger repair
on:
  push:
    branches: [workbench/review-477-snapshot]
    paths: [.github/workflows/review-477-snapshot.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 3c7d453fa45db195fe59df026f8fd64e149cd683
          persist-credentials: false
      - name: Apply only the locally tested ledger bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3c7d453fa45db195fe59df026f8fd64e149cd683
          python3 -I - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('apps/api-rust/tests/fixtures/routes')
          expected = {
              'legacy-go-routes.tsv': ('295e20bfe8028aa7e57349b10e30d168b5742291', 'f999ac15b5885796bd270cedb63d1daf1a00ce13'),
              'frozen-route-auth.tsv': ('b3fd4c43dfad8a4300877b14084682e5016e9efd', '152afdc897ac04e17e199d0a71e5f04a7c3a5bc0'),
              'route-plan.tsv': ('2675287d98f9dba980250ab50e4fc10e7e8443d4', '3f1e4630cb1eed1343d1d32779bad1f9570fe86a'),
              'route-gate.tsv': ('17832a1389cf225e4687700c3da1c1baf031af4b', '035488473ff37970037bf6d4b6635b289f2c6f54'),
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, (before, after) in expected.items():
              path = root / name
              original = path.read_bytes()
              assert blob(original) == before, name
              text = original.decode()
              for route, handler, auth, anchor in [
                  ('/api/log/search', 'SearchAllLogs', 'admin', '/api/log/self'),
                  ('/api/log/self/search', 'SearchUserLogs', 'user', '/api/log/self/stat'),
              ]:
                  if name == 'legacy-go-routes.tsv':
                      row = '\t'.join(['GET', route, 'github.com/QuantumNous/new-api/controller.' + handler])
                  elif name == 'frozen-route-auth.tsv':
                      row = '\t'.join(['GET', route, auth])
                  elif name == 'route-plan.tsv':
                      row = '\t'.join(['GET', route, 'github.com/QuantumNous/new-api/controller.' + handler, 'usage-audit', auth, 'read', 'none', 'P2', 'lmm_api_rs::routes::usage_audit', 'none'])
                  else:
                      row = '\t'.join(['GET', route, 'absent', 'not-applicable', 'unmounted', 'not-applicable', 'not-applicable', 'go', 'legacy-go', 'retired=true;issue=385;test=apps/api-rust/tests/observability.rs'])
                  marker = '\nGET\t' + anchor + '\t'
                  assert text.count(marker) == 1 and row not in text
                  text = text.replace(marker, '\n' + row + marker, 1)
              result = text.encode()
              assert blob(result) == after, name
              path.write_bytes(result)
          assert hashlib.sha256((root / 'legacy-go-routes.tsv').read_bytes()).hexdigest() == '915d76afb3d42ad59d14c4a26a359f955b19ac09fbb81507ad6be67287cefd57'
          print('All four before/after Git blob hashes and frozen baseline SHA-256 verified')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          git add -- apps/api-rust/tests/fixtures/routes/legacy-go-routes.tsv apps/api-rust/tests/fixtures/routes/frozen-route-auth.tsv apps/api-rust/tests/fixtures/routes/route-plan.tsv apps/api-rust/tests/fixtures/routes/route-gate.tsv
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(routes): preserve frozen log-search contracts and record explicit retirement'
      - name: Fast-forward only the reviewed PR branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          target=refs/heads/cleanup/retire-log-search-385
          current=$(git ls-remote origin "$target" | cut -f1)
          test "$current" = 3c7d453fa45db195fe59df026f8fd64e149cd683
          git push origin "HEAD:$target"
          git rev-parse HEAD
