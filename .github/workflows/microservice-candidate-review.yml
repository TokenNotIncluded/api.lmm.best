name: Isolated microservice candidate review
on:
  push:
    branches: [work/microservice-distribution-review-20261010]
    paths: [.github/workflows/microservice-candidate-review.yml]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: f1f637423379a8b732d2cd1484834cebcb024798
          fetch-depth: 0
          persist-credentials: false
      - name: Match locally tested file contents and modes
        shell: bash
        run: |
          git diff --raw --no-abbrev 72667564c0431754d4856dc2e0db55f360bd2745 HEAD > "$RUNNER_TEMP/candidate-diff.raw"
          cat "$RUNNER_TEMP/candidate-diff.raw"
          echo "847a799ae5072c8fedf4257f5bf0fc9e6d09d7c8357c588d4cc835f4c29f0185  $RUNNER_TEMP/candidate-diff.raw" | sha256sum --check
          git rev-parse HEAD
  preview:
    needs: identity
    uses: ./.github/workflows/microservice-distribution.yml
    with:
      source_ref: f1f637423379a8b732d2cd1484834cebcb024798
      version: 0.1.0-preview
