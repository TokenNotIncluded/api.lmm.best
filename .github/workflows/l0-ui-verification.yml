name: Isolated L0 UI verification
on:
  push:
    branches: [verify/l0-ui-20260922]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: verify/l0-ui-20260922
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Format with protected copyright headers
        run: bun run --filter @lmm/web format
      - name: Store only L0 formatter output on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/l0-ui-20260922
          git add -- \
            apps/web/src/features/onboarding/l0-access-copy.ts \
            apps/web/src/features/onboarding/l0-paid-access.test.ts \
            apps/web/src/features/onboarding/l0-paid-welcome.test.tsx \
            apps/web/src/features/onboarding/l0-token-cloud.test.ts \
            apps/web/src/features/onboarding/l0-token-cloud.ts \
            apps/web/src/features/onboarding/l0-welcome.css \
            apps/web/src/features/onboarding/l0-welcome.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(web): format L0 components and regression tests'
            git push origin HEAD:refs/heads/verify/l0-ui-20260922
          fi
          git log -1 --format=%H
          git diff --stat 2c89470033b07348d4baa43925f1fc82799cc8f7 -- apps/web/src/features/onboarding
      - name: Check formatting
        run: bun run --filter @lmm/web format:check
      - name: Check copyright headers
        run: bun run --filter @lmm/web copyright:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run --filter @lmm/web lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run --filter @lmm/web typecheck
      - name: L0 regression tests with real workspace dependencies
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          for test in l0-paid-access.test.ts l0-token-cloud.test.ts l0-paid-welcome.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/onboarding/$test" || exit 1
          done
      - name: Production build
        if: ${{ !cancelled() }}
        run: bun run --filter @lmm/web build
