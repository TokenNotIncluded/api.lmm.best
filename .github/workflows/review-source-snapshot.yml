name: Read-only source snapshot for conflict review

on:
  push:
    branches: [ci/source-snapshot-20260916-1322]
    paths: [.github/workflows/review-source-snapshot.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch public PR tips without credentials and record exact commits
        run: |
          mkdir -p source-evidence
          git -c credential.helper= fetch https://github.com/TokenNotIncluded/api.lmm.best.git refs/heads/main:refs/heads/snapshot-main refs/heads/ci/reviewed-integration-20260916-1334:refs/heads/snapshot-candidate
          for pr in 316 320 324 328 329 333 334 335 336 337 338 339 340; do
            git -c credential.helper= fetch https://github.com/TokenNotIncluded/api.lmm.best.git "refs/pull/${pr}/head:refs/heads/snapshot-pr-${pr}"
          done
          git for-each-ref --format='%(objectname) %(refname)' 'refs/heads/snapshot-*' > source-evidence/refs.txt
          test -s source-evidence/refs.txt
          git bundle create source-evidence/review.bundle --branches='snapshot-*'
          git bundle verify source-evidence/review.bundle
          sha256sum source-evidence/review.bundle > source-evidence/SHA256SUMS
      - name: Upload source objects and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-source-snapshot-${{ github.sha }}
          path: source-evidence/
          retention-days: 3
          if-no-files-found: error
