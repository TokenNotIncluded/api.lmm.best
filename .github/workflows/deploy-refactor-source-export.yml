name: Deployment refactor source export

# Temporary branch-scoped build inputs. No tests, release or production access.
on:
  push:
    branches: [refactor/remove-go-deploy-cli]
    paths: [.github/workflows/deploy-refactor-source-export.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Collect public toolchain and checked module downloads
        run: |
          set -euo pipefail
          cd apps/api-go
          go version
          go mod download
          mkdir -p "$RUNNER_TEMP/local-build-inputs"
          goroot=$(go env GOROOT)
          tar -C "$goroot" -czf "$RUNNER_TEMP/local-build-inputs/go-sdk.tar.gz" .
          tar -C "$(go env GOMODCACHE)/cache" -czf "$RUNNER_TEMP/local-build-inputs/go-downloads.tar.gz" download
          cp go.mod go.sum "$RUNNER_TEMP/local-build-inputs/"
          sha256sum "$RUNNER_TEMP/local-build-inputs/"*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deploy-refactor-go-inputs
          path: ${{ runner.temp }}/local-build-inputs/*
          retention-days: 1
          if-no-files-found: error
