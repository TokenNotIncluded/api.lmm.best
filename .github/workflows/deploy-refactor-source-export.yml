name: Deployment refactor source export

# Temporary, branch-scoped source export. No tests, release or production access.
on:
  push:
    branches: [refactor/remove-go-deploy-cli]
    paths: [.github/workflows/deploy-refactor-source-export.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deploy-refactor-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
