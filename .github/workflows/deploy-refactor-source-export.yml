name: Deployment refactor source export

# Temporary branch-only public build tools. No tests, release or production access.
on:
  push:
    branches: [refactor/remove-go-deploy-cli]
    paths: [.github/workflows/deploy-refactor-source-export.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Collect portable public test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools
          mkdir -p "$RUNNER_TEMP/local-test-tools"
          cp /usr/bin/bsdtar "$RUNNER_TEMP/local-test-tools/bsdtar"
          cp "$(command -v cosign)" "$RUNNER_TEMP/local-test-tools/cosign"
          ldd /usr/bin/bsdtar > "$RUNNER_TEMP/local-test-tools/bsdtar-libraries.txt"
          sha256sum "$RUNNER_TEMP/local-test-tools/bsdtar" "$RUNNER_TEMP/local-test-tools/cosign"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deploy-refactor-test-tools
          path: ${{ runner.temp }}/local-test-tools/*
          retention-days: 1
          if-no-files-found: error
