name: Store publishing workbench
on:
  push:
    branches: [fix/store-publishing-variants-20261010]
permissions:
  contents: write
concurrency:
  group: store-publishing-workbench
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 64
      - name: Integrate current main before applying the source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=64 origin main
          git merge --no-edit origin/main
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Apply reviewed source patch when present
        id: patch
        run: |
          if test -f scripts/store-publishing-workbench.py; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/store-publishing-workbench.py')
          s = p.read_text().replace("import { STORE_ACCESS_COPY as accessCopy } from './access-copy'", "import { STORE_ACCESS_COPY } from './access-copy'", 2)
          s = s.replace('.includes(issue.code)', ".includes(issue.code ?? '')")
          s = s.replace('{editing && (', '{editing !== null && (')
          s = s.replace('# Format only intended source files;', "exec(Path('scripts/store-publishing-tests.py').read_text())\nexec(Path('scripts/store-publishing-patch-review.py').read_text())\n\n# Format only intended source files;")
          s = s.replace('assert anchor in s', 'assert anchor in s, repr(anchor)').replace('assert anchor in part', 'assert anchor in part, repr(anchor)').replace('assert anchor in editor', 'assert anchor in editor, repr(anchor)')
          p.write_text(s)
          PY
            python3 scripts/store-publishing-workbench.py
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Frontend typecheck and lint
        run: |
          bun run --filter @lmm/web typecheck > /tmp/store-types.log 2>&1 || { tail -n 100 /tmp/store-types.log; exit 1; }
          bun run --filter @lmm/web lint > /tmp/store-lint.log 2>&1 || { grep '::error' /tmp/store-lint.log; tail -n 5 /tmp/store-lint.log; exit 1; }
          tail -n 5 /tmp/store-types.log
          tail -n 5 /tmp/store-lint.log
      - name: Frontend store regressions
        working-directory: apps/web
        run: |
          for file in src/features/store/interactions.test.tsx src/features/store/store-mobile.test.tsx src/features/store/*.test.ts src/features/store/*.test.tsx; do
            test -f "$file" || continue
            marker="/tmp/store-tested-$(basename "$file")"
            test -f "$marker" && continue
            touch "$marker"
            echo "Testing $file"
            if ! bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./$file" > /tmp/store-ui.log 2>&1; then
              grep -B 15 -A 12 -E 'error:|AssertionError|\(fail\)' /tmp/store-ui.log | tail -n 260
              exit 1
            fi
            tail -n 4 /tmp/store-ui.log
          done
      - name: Go store regressions
        working-directory: apps/api-go
        run: |
          go test -p 2 ./model ./controller -run 'MerchantStore|StorePublish' -count=1 > /tmp/store-go.log 2>&1 || { grep -A 24 -E -- '--- FAIL|Error:|Error Trace:|build failed|undefined:' /tmp/store-go.log | tail -n 180; tail -n 30 /tmp/store-go.log; exit 1; }
          tail -n 5 /tmp/store-go.log
      - name: Production web build
        run: |
          bun run --filter @lmm/web build > /tmp/store-build.log 2>&1 || { tail -n 100 /tmp/store-build.log; exit 1; }
          tail -n 8 /tmp/store-build.log
      - name: Commit verified source changes only
        if: ${{ success() && steps.patch.outputs.applied == 'true' }}
        env:
          BRANCH: fix/store-publishing-variants-20261010
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = json.loads(Path('/tmp/store-publishing-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm -f scripts/store-publishing-workbench.py scripts/store-publishing-tests.py scripts/store-publishing-patch-review.py .github/workflows/store-publishing-workbench.yml
          git diff --cached --check
          git commit -m 'fix(store): clarify publishing, configure terms inline, and create variants atomically'
          git push origin "HEAD:refs/heads/$BRANCH"
