name: Store publishing workbench
on:
  push:
    branches: [fix/store-publishing-variants-20261010]
permissions:
  contents: write
concurrency:
  group: store-publishing-workbench
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Apply reviewed source patch when present
        id: patch
        run: |
          if test -f scripts/store-publishing-workbench.py; then
            python3 scripts/store-publishing-workbench.py
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Go store regressions
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller -run 'MerchantStore|StorePublish' -count=1
      - name: Frontend store regressions
        working-directory: apps/web
        run: |
          for file in src/features/store/*.test.ts src/features/store/*.test.tsx; do
            test -f "$file" || continue
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./$file"
          done
      - name: Frontend typecheck and lint
        run: |
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web lint
      - name: Production web build
        run: bun run --filter @lmm/web build
      - name: Commit verified source changes only
        if: steps.patch.outputs.applied == 'true'
        env:
          BRANCH: fix/store-publishing-variants-20261010
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = json.loads(Path('/tmp/store-publishing-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm scripts/store-publishing-workbench.py .github/workflows/store-publishing-workbench.yml
          git diff --cached --check
          git commit -m 'fix(store): clarify publishing, configure terms inline, and create variants atomically'
          git push origin "HEAD:refs/heads/$BRANCH"
