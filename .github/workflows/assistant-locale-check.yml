name: Assistant locale verification
on:
  push:
    branches: [work/assistant-tool-control-center-20261009]
    paths: ['.github/workflows/assistant-locale-check.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          path: review
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 7f47389b5cf5cd3247dcc0c08866c6f5a3668a50
          path: source
      - name: Apply the bounded locale correction
        working-directory: source
        run: |
          git apply --index --whitespace=error ../review/.review/assistant-workspace/locale-fix.diff
          cp ../review/.review/assistant-workspace/visualization-locale.test.tsx apps/web/src/features/assistant/assistant-visualization-locale.test.tsx
          git add -N apps/web/src/features/assistant/assistant-visualization-locale.test.tsx
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: source
      - name: Format, typecheck and regression tests
        working-directory: source/apps/web
        run: |
          mkdir -p /tmp/locale-evidence
          bun run format 2>&1 | tee /tmp/locale-evidence/format.log
          bun run typecheck 2>&1 | tee /tmp/locale-evidence/typecheck.log
          bun run lint 2>&1 | tee /tmp/locale-evidence/lint.log
          failed=0
          while IFS= read -r file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" >> /tmp/locale-evidence/tests.log 2>&1 || failed=1
          done < <(find src/features/assistant src/features/system-settings src/features/dashboard -name '*.test.ts' -o -name '*.test.tsx' | sort)
          tail -n 60 /tmp/locale-evidence/tests.log
          exit "$failed"
      - name: Build and check budget
        working-directory: source/apps/web
        run: |
          bun run build 2>&1 | tee /tmp/locale-evidence/build.log
          bun run bundle:check 2>&1 | tee /tmp/locale-evidence/bundle.log
          bun run copyright:check 2>&1 | tee /tmp/locale-evidence/copyright.log
      - name: Export exact checked source
        if: always()
        working-directory: source
        run: |
          mkdir -p /tmp/locale-evidence
          git diff --full-index HEAD -- apps/web/src/features/assistant/assistant-visualization.tsx apps/web/src/features/assistant/assistant-visualization-locale.test.tsx apps/web/src/features/dashboard/components/overview/overview-greeting.tsx apps/web/src/features/dashboard/components/overview/overview-personalization-data.ts apps/web/src/features/dashboard/components/overview/overview-personalization-data.test.ts apps/web/src/features/system-settings/content/assistant-tool-configuration.tsx apps/web/src/features/system-settings/content/assistant-tool-policy-editor.test.tsx > /tmp/locale-evidence/locale.patch
          cd /tmp/locale-evidence
          sha256sum locale.patch > locale.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-locale-evidence
          path: /tmp/locale-evidence/
          retention-days: 3
  publish-review-fix:
    needs: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/assistant-tool-center-reviewed-20261009
      - uses: actions/download-artifact@v4
        with:
          name: assistant-locale-evidence
          path: /tmp/locale-evidence
      - name: Apply checked text patch without running application code
        run: |
          test "$(git rev-parse HEAD)" = 7f47389b5cf5cd3247dcc0c08866c6f5a3668a50
          (cd /tmp/locale-evidence && sha256sum -c locale.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import re
          patch=Path('/tmp/locale-evidence/locale.patch').read_bytes()
          paths=re.findall(rb'^diff --git a/(.+) b/(.+)$',patch,re.M)
          assert len(paths)==7
          for before,after in paths:
              path=after.decode()
              assert before==after and '..' not in Path(path).parts
              assert path.startswith('apps/web/src/features/') and path.endswith(('.ts','.tsx'))
          assert b'GIT binary patch' not in patch
          assert not re.search(rb'^(?:new file|old|new) mode (?!100644)',patch,re.M)
          PY
          git apply --index --whitespace=error /tmp/locale-evidence/locale.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(assistant): render Chinese charts and full tool level labels'
          git push origin HEAD:refs/heads/work/assistant-tool-center-reviewed-20261009
