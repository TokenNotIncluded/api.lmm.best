name: Billing safety regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-safety:
    name: Billing boundaries and concurrent reservations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/native_accounts_test?sslmode=disable
      TEST_POSTGRES_ISOLATED_SCHEMA: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: native_accounts_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_accounts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api-go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Validate per-key payer order and team account isolation
        run: go test -race -p 2 ./pkg/account ./pkg/accountfunding -count=1 -timeout=1m
      - name: Validate shared team level policy without platform privilege inheritance
        run: go test -race -p 2 ./model -run '^(TestTeamAccountAccess|TestEvaluateTrustLevel|TestPostgresCatalog)' -count=1 -timeout=5m
      - name: Validate native account storage, session and HTTP boundaries
        run: go test -race -p 2 ./model ./controller ./router -run '^TestNativeAccount' -count=1 -timeout=5m
      - name: Run real service-package regressions under the race detector
        run: go test -race -p 2 ./service -run '^(TestBillingSafety|TestPostTextConsumeQuotaClaudeRefusal|TestTextBillingExemption)' -count=1 -timeout=5m
      - name: Validate Claude refusal evidence and default-off policy
        run: go test -race -p 2 ./relay/channel/claude ./setting/model_setting -run '^(TestClaudeRefusal|TestClaudeResponses)' -count=1 -timeout=5m
