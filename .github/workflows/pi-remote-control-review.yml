name: Pi remote control review
on:
  push:
    branches: [feat/pi-remote-control-commands]
    paths: [.remote-control-change.b64, .github/workflows/pi-remote-control-review.yml]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply the reviewed source update to this feature branch
        id: source
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref_name }}' = 'feat/pi-remote-control-commands' ] && [ -f .remote-control-change.b64 ]; then
            python3 - <<'PY'
          import base64, pathlib, subprocess, zlib
          sources = sorted(pathlib.Path('.').glob('.remote-control-change.part*')) + [pathlib.Path('.remote-control-change.b64')]
          patch = zlib.decompress(base64.b64decode(''.join(path.read_text().strip() for path in sources), validate=True))
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
            git rm .remote-control-change.b64 .remote-control-change.part*
            git -c user.name='LMM integration' -c user.email='noreply@lmm.best' commit -m 'feat: scoped Pi remote-control API and interactive web controller'
            git push origin HEAD:feat/pi-remote-control-commands
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Remote relay, ownership, explicit consent and OAuth regression
        working-directory: apps/api-go
        run: go test ./controller ./router -run 'TestPiRemote|TestOAuthHTTPDiscovery' -count=1 -v
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set isolated browser paths
        run: |
          echo "REMOTE_BROWSER_ROOT=$RUNNER_TEMP/remote-browser" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/remote-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: server
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TokenNotIncluded/pi-lmm-provider
          ref: 58f0d8b311433053983092b7a66ddfb835f3d5f8
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the project's locked web dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Web encrypted-command regression
        working-directory: server/apps/web
        run: bun test src/features/remote-control/*.test.ts
      - name: Install the official Pi host and published ask_user extension
        working-directory: plugin
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts pi-ask-user@0.16.0 @sinclair/typebox@0.34.52
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/remote-tools" --ignore-scripts --no-package-lock playwright@1.56.1 @tailwindcss/cli@4.3.2
          node "$RUNNER_TEMP/remote-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build the production controller components in the test harness
        working-directory: server/apps/web
        run: |
          bun scripts/remote-control-review/build.mjs
          node "$RUNNER_TEMP/remote-tools/node_modules/@tailwindcss/cli/dist/index.mjs" -i scripts/remote-control-review/browser.css -o "$REMOTE_BROWSER_ROOT/browser.css" --minify
      - name: Mobile and desktop Chromium controls actual Pi and third-party ask_user
        shell: bash
        run: |
          mkdir -p "$REMOTE_BROWSER_ROOT"
          (cd plugin && node --experimental-strip-types test/remote-sdk.mjs) > "$REMOTE_BROWSER_ROOT/native.log" 2>&1 &
          pi_pid=$!
          trap 'kill "$pi_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            [ -f "$REMOTE_BROWSER_ROOT/fixture.json" ] && break
            kill -0 "$pi_pid" || { cat "$REMOTE_BROWSER_ROOT/native.log"; exit 1; }
            sleep 0.5
          done
          test -f "$REMOTE_BROWSER_ROOT/fixture.json"
          (cd server/apps/web && node scripts/remote-control-review/check.mjs)
          wait "$pi_pid"
          cat "$REMOTE_BROWSER_ROOT/native.log"
      - name: Full web TypeScript check
        working-directory: server/apps/web
        run: bun run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-remote-browser-proof
          path: |
            ${{ runner.temp }}/remote-browser/*.png
            ${{ runner.temp }}/remote-browser/browser-result.json
            ${{ runner.temp }}/remote-browser/native.log
          retention-days: 7
