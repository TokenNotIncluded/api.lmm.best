name: Pi remote control review
on:
  push:
    branches: [feat/pi-remote-control-commands]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Remote relay and OAuth regression
        working-directory: apps/api-go
        run: go test ./controller ./router -run 'TestPiRemote|TestOAuthHTTPDiscovery' -count=1
  browser-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install isolated browser test dependencies without lifecycle scripts
        run: |
          mkdir -p /tmp/remote-browser-env
          cd /tmp/remote-browser-env
          npm install --ignore-scripts --no-audit --no-fund react@19.2.7 react-dom@19.2.7 @base-ui/react@1.8.0 react-i18next@17.0.8 i18next@26.3.4 class-variance-authority@0.7.1 clsx@2.1.1 tailwind-merge@3.6.0 @tanstack/react-query@5.101.2 axios@1.18.1 @types/react@19.2.17 @types/react-dom@19.2.3 @sinclair/typebox@0.34.52 pi-ask-user@0.16.0 tailwindcss@4.3.2 @tailwindcss/cli@4.3.2
          cp "$(command -v bun)" /tmp/remote-browser-env/bun
          tar -C /tmp -czf /tmp/remote-browser-env.tgz remote-browser-env
      - uses: actions/upload-artifact@v4
        with:
          name: remote-browser-env
          path: /tmp/remote-browser-env.tgz
          retention-days: 1
