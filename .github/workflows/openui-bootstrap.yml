name: OpenUI integration verification
on:
  push:
    branches: [feat/openui-generative-assistant]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: openui-integration-bootstrap
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: install
        run: bun install --frozen-lockfile
      - name: Format only new OpenUI source files
        working-directory: apps/web
        run: bun x --no-install oxfmt --write src/components/ai-elements/openui/ scripts/generate-assistant-openui.ts
      - name: Verify the shared contract and affected web tests in isolation
        working-directory: apps/web
        run: |
          bun run openui:check
          failed=0
          while IFS= read -r -d '' file; do
            bun test --preload ./scripts/test-preload.mjs "$file" || failed=1
          done < <(find src/components/ai-elements src/features/assistant -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
          exit "$failed"
      - name: Typecheck full web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: bun run typecheck
      - name: Lint all touched web code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: bun x --no-install oxlint -c .oxlintrc.json src/components/ai-elements/openui/ scripts/generate-assistant-openui.ts src/components/ai-elements/response.tsx src/components/ai-elements/response-renderer-blocks.tsx src/features/assistant/assistant-panel.tsx
      - name: Build web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: bun run build
      - name: Collect formatted new source only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/openui-source/apps/web/src/components/ai-elements/openui" "$RUNNER_TEMP/openui-source/apps/web/scripts"
          cp apps/web/src/components/ai-elements/openui/* "$RUNNER_TEMP/openui-source/apps/web/src/components/ai-elements/openui/"
          cp apps/web/scripts/generate-assistant-openui.ts "$RUNNER_TEMP/openui-source/apps/web/scripts/"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: openui-formatted-source
          path: ${{ runner.temp }}/openui-source
          if-no-files-found: error
          retention-days: 3
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Check assistant prompt and cache regressions
        working-directory: apps/api-go
        run: go test ./controller -run 'TestAssistantOpenUIContract|TestBuildAssistantSystemPrompt|TestAssistantCache' -count=1
  commit:
    needs: [web, go]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openui-formatted-source
          path: source
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const ref = 'heads/feat/openui-generative-assistant';
            const current = await github.rest.git.getRef({...repo, ref});
            if (current.data.object.sha !== context.sha) throw new Error('Branch moved; refusing overwrite.');
            const parent = await github.rest.git.getCommit({...repo, commit_sha: context.sha});
            const paths = ['policy.ts', 'policy.test.ts', 'library.tsx', 'library.test.tsx', 'renderer.tsx', 'renderer.test.tsx', 'block.tsx', 'streaming-context.ts', 'table.tsx'].map(name => `apps/web/src/components/ai-elements/openui/${name}`);
            paths.push('apps/web/scripts/generate-assistant-openui.ts');
            const tree = [];
            for (const path of paths) {
              const data = fs.readFileSync(`source/${path}`);
              if (data.length > 100_000) throw new Error(`Unexpected file size: ${path}`);
              const blob = await github.rest.git.createBlob({...repo, content: data.toString('base64'), encoding: 'base64'});
              tree.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const createdTree = await github.rest.git.createTree({...repo, base_tree: parent.data.tree.sha, tree});
            if (createdTree.data.sha !== parent.data.tree.sha) {
              const commit = await github.rest.git.createCommit({...repo, tree: createdTree.data.sha, parents: [context.sha], message: 'style(assistant): commit verified OpenUI source formatting'});
              await github.rest.git.updateRef({...repo, ref, sha: commit.data.sha, force: false});
              core.info(`Verified source committed: ${commit.data.sha}`);
            }
