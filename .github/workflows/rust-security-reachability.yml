name: Rust security reachability

on:
  push:
    branches:
      - codex/rust-rustsec-audit
    paths:
      - '.github/workflows/rust-security-reachability.yml'

permissions:
  contents: read

jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect advisory reverse dependency graphs
        shell: bash
        working-directory: apps/api-rust
        run: |
          set -euo pipefail
          echo '=== rkyv / all targets ==='
          cargo tree --locked --target all -i rkyv || true
          echo '=== chacha20 0.10.2 / all targets ==='
          cargo tree --locked --target all -i chacha20@0.10.2 || true
          echo '=== rsa / all targets ==='
          cargo tree --locked --target all -i rsa || true
          echo '=== rustls 0.23.45 / all targets ==='
          cargo tree --locked --target all -i rustls@0.23.45 || true
