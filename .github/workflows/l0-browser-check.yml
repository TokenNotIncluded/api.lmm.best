name: L0 browser review
on:
  push:
    branches: [work/l0-l1-retirement-20261009]
    paths: [.github/workflows/l0-browser-check.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: candidate
          ref: 9633ad6bb0f019c39b005f0433f4ae08d6dcc965
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare the same product candidate
        run: |
          mkdir -p "$RUNNER_TEMP/l0-browser-result"
          python3 workbench/.workbench/final-review.py candidate
          python3 workbench/.workbench/first-turn-fix.py candidate
          cp workbench/.workbench/assistant_first_turn_activation_test.go candidate/apps/api-go/controller/assistant_first_turn_activation_test.go
          git -C candidate diff --check
      - name: Install locked web and isolated browser dependencies
        working-directory: candidate
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/l0-browser" playwright@1.51.1
          "$RUNNER_TEMP/l0-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks
        env:
          L0_BROWSER_OUTPUT: ${{ runner.temp }}/l0-browser-result
        run: |
          python3 workbench/.workbench/prepare-browser.py candidate "$RUNNER_TEMP/l0-browser-run.mjs"
          (cd candidate/apps/web && LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174) > "$RUNNER_TEMP/l0-browser-result/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" = 1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/l0-browser/node_modules/playwright/index.mjs" node "$RUNNER_TEMP/l0-browser-run.mjs" 2>&1 | tee "$RUNNER_TEMP/l0-browser-result/browser.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l0-browser-review
          path: ${{ runner.temp }}/l0-browser-result/
          retention-days: 4
