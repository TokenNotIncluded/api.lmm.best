name: HumanGrant task verification
on:
  push:
    branches: [feat/humangrant-login]
    paths: [.github/workflows/humangrant-task-source.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Existing authentication regression tests
        working-directory: apps/api-go
        run: go test -p 2 ./controller ./router -run 'TestGenerateAccessTokenRejectsNonBrowserSessions|TestAuthSession|TestAuthFlow' -count=1
