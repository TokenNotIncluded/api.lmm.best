name: PR 340 CI repair
on:
  push:
    branches: ['assistant/pr340-integration-20260916']
    paths: ['.github/workflows/pr340-ci-repair.yml']
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Collect failed-job evidence without dumping full logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr340-diagnostics
          for job in 104792753029 104792752923; do
            gh api "repos/TokenNotIncluded/api.lmm.best/actions/jobs/$job" > "/tmp/pr340-diagnostics/$job.json"
            gh api "repos/TokenNotIncluded/api.lmm.best/actions/jobs/$job/logs" > "/tmp/pr340-diagnostics/$job.log"
          done
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('/tmp/pr340-diagnostics')
          out=[]
          for p in root.glob('*.log'):
              lines=p.read_text(errors='replace').splitlines()
              keep=set(range(min(12,len(lines))))
              for i,line in enumerate(lines):
                  if re.search(r'(--- FAIL:|WARNING: DATA RACE|signal: killed|fatal error:|##\[error\]|^.{0,35}FAIL\s|##\[group\]Run go |go test .*\.\.\.)',line):
                      keep.update(range(max(0,i-3),min(len(lines),i+18)))
              out.extend(['FILE '+p.name]+[lines[i] for i in sorted(keep)])
          text='\n'.join(out)
          (root/'failures.txt').write_text(text)
          print(text[-18000:])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr340-exact-ci-failures
          path: /tmp/pr340-diagnostics
          retention-days: 3
  panel:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/assistant/pr340-integration-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a33982d2d394a5d4d46f7d03f7269a5f40c08ebb
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Update stale panel fixtures and test retired-action replay protection
        env:
          PLAN: ''
        run: |
          python3 - <<'PY'
          import os,pathlib,hashlib,json,lzma,base64
          blob=base64.b64decode(os.environ['PLAN'],validate=True)
          assert hashlib.sha256(blob).hexdigest()=='5ed6ac3c6027f2b8c21b9e2ed97a299fd713b7ad3714d1f68ba60b8e3b9bd4fc'
          rows=json.loads(lzma.decompress(blob)); assert len(rows)==1
          r=rows[0]; assert r['path']=='apps/web/src/features/assistant/assistant-panel.test.tsx'
          p=pathlib.Path(r['path']); old=p.read_bytes(); assert hashlib.sha256(old).hexdigest()==r['old']
          lines=old.decode().splitlines(keepends=True)
          for start,end,text in reversed(r['changes']): lines[start:end]=[text]
          result=''.join(lines).encode(); assert hashlib.sha256(result).hexdigest()==r['new']
          p.write_bytes(result)
          PY
          mkdir -p /tmp/pr340-panel
          bun run --filter @lmm/web format > /tmp/pr340-panel/format.log 2>&1
          python3 - <<'PY'
          import subprocess
          for path in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              if path!='apps/web/src/features/assistant/assistant-panel.test.tsx': subprocess.run(['git','restore','--',path],check=True)
          PY
      - name: Run complete web test suite and static checks
        shell: bash
        run: |
          status=0
          for command in lint typecheck test build bundle:check copyright:check; do
            bun run --filter @lmm/web "$command" > "/tmp/pr340-panel/$command.log" 2>&1 || { tail -70 "/tmp/pr340-panel/$command.log"; status=1; }
          done
          git diff --check || status=1
          exit "$status"
      - name: Commit and publish tested candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/assistant/pr340-integration-20260916
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/assistant/assistant-panel.test.tsx
          git commit -m 'test(assistant): align panel fixtures and reject retired recommendation replay'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/assistant/pr340-merged-20260916
          git rev-parse HEAD HEAD^{tree} > /tmp/pr340-panel/commit.txt
      - name: Save actual source and test evidence
        if: always()
        run: |
          mkdir -p /tmp/pr340-panel
          cp apps/web/src/features/assistant/assistant-panel.test.tsx /tmp/pr340-panel/assistant-panel.test.tsx
          git diff > /tmp/pr340-panel/panel.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr340-panel-regression
          path: /tmp/pr340-panel
          retention-days: 3
