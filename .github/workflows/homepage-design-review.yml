name: Homepage design review

on:
  push:
    branches: [codex/homepage-polish-20260926]

permissions:
  contents: read

concurrency:
  group: homepage-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    name: Build inspectable homepage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build production frontend
        run: bun run --filter @lmm/web build
      - name: Package review inputs
        shell: bash
        run: |
          mkdir -p review
          git rev-parse HEAD > review/revision.txt
          tar -czf review/web-dist.tar.gz -C apps/web dist
          git archive --format=tar.gz --output=review/source.tar.gz HEAD
          find node_modules -path '*oxfmt*' -type f -print0 | tar --null -T - -czf review/formatter.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-review-build
          path: review/
          retention-days: 3
          if-no-files-found: error
