name: Task and drawing logs review

on:
  workflow_dispatch:
  push:
    branches: [fix/task-drawing-logs-20261010]
    paths:
      - .github/workflows/task-drawing-logs-review.yml
      - apps/web/src/features/usage-logs/**
      - apps/web/src/routes/_authenticated/usage-logs/**
      - apps/api-go/controller/midjourney.go
      - apps/api-go/model/midjourney*.go
      - apps/api-rust/src/routes/control_tasks.rs

permissions:
  contents: read

concurrency:
  group: task-drawing-logs-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Capture exact source under review
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs-source"
          git rev-parse HEAD > "$RUNNER_TEMP/logs-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/logs-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-drawing-logs-source
          path: ${{ runner.temp }}/logs-source
          retention-days: 3
          if-no-files-found: error
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck the application
        working-directory: apps/web
        run: bun run typecheck
      - name: Run log regression tests
        working-directory: apps/web
        run: bun test src/features/usage-logs

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify drawing query and owner-scope regressions
        working-directory: apps/api-go
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
          GOMAXPROCS: "2"
        shell: bash
        run: |
          if test -f model/midjourney_log_filters_test.go; then
            go test -p 2 ./model -run '^TestMidjourneyLogFilters$' -count=1
          else
            echo 'Review source captured; filter regression patch not present in this revision.'
          fi
