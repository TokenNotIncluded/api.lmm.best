name: L0 stage verification workspace
on:
  push:
    branches: [verify/l0-stage-20260922]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Package source and locked dependencies for offline verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/l0-stage-workspace
          git archive HEAD > /tmp/l0-stage-workspace/source.tar
          tar -cf - node_modules | gzip -1 > /tmp/l0-stage-workspace/dependencies.tar.gz
          cp "$(command -v bun)" /tmp/l0-stage-workspace/bun
          gzip -1 /tmp/l0-stage-workspace/bun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-stage-offline-workspace
          path: /tmp/l0-stage-workspace
          retention-days: 1
          compression-level: 0
