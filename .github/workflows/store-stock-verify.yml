name: Verify integrated stock candidate
on:
  push:
    branches: [review/store-stock-finish-20261010]
    paths: [.github/workflows/store-stock-verify.yml]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0070bdf81fad1d65e905e4395dbe0aff56d5e2e8
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Verify inventory and order invariants under the race detector
        working-directory: apps/api-go
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stock-database"
          git rev-parse HEAD > "$RUNNER_TEMP/stock-database/revision.txt"
          go test -race -p 2 ./model -run 'TestMerchantStore(Catalogue|Sales|Remaining|Fixed|Stock)' -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/stock-database/tests.jsonl"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-database-verified
          path: ${{ runner.temp }}/stock-database
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0070bdf81fad1d65e905e4395dbe0aff56d5e2e8
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Static checks
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/stock-browser-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/stock-browser-evidence/revision.txt"
          bun run lint > "$RUNNER_TEMP/stock-browser-evidence/lint.log" 2>&1
          bun run typecheck > "$RUNNER_TEMP/stock-browser-evidence/typecheck.log" 2>&1
          PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" oxfmt --check scripts/store-stock-review.mjs scripts/store-stock-copy.mjs src/features/store/seller-page.tsx src/features/store/stock-status.ts src/features/store/stock-status.test.ts src/features/store/catalogue-tags.tsx
      - name: Workflow boundaries and translation regression checks
        run: |
          node --test scripts/workflow-topology.test.mjs scripts/check-i18n.test.mjs > "$RUNNER_TEMP/stock-browser-evidence/contracts.log" 2>&1
          node scripts/check-i18n.mjs --base origin/main > "$RUNNER_TEMP/stock-browser-evidence/translations.log" 2>&1
      - name: Stock, catalogue and seller interactions
        working-directory: apps/web
        run: |
          bun test src/features/store/stock-status.test.ts > "$RUNNER_TEMP/stock-browser-evidence/stock-unit.log" 2>&1
          bun test src/features/store/catalogue-interactions.test.tsx > "$RUNNER_TEMP/stock-browser-evidence/catalogue.log" 2>&1
          bun test src/features/store/interactions.test.tsx > "$RUNNER_TEMP/stock-browser-evidence/seller-interactions.log" 2>&1
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/stock-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/stock-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile stock acceptance
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/stock-browser/node_modules/playwright/index.mjs
          STOCK_REVIEW_OUTPUT: ${{ runner.temp }}/stock-browser-evidence
          STOCK_REVIEW_URL: http://127.0.0.1:4189
        run: |
          bun run build > "$STOCK_REVIEW_OUTPUT/build.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4189 > "$STOCK_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4189/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-stock-review.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-browser-verified
          path: ${{ runner.temp }}/stock-browser-evidence
          if-no-files-found: error
          retention-days: 7
  go107-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0070bdf81fad1d65e905e4395dbe0aff56d5e2e8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Apply only the display helper and regression tests to Go107
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stock-go107"
          git worktree add --detach "$RUNNER_TEMP/stock-go107-source" go-v0.2.107
          python3 - <<'PY'
          import os
          from pathlib import Path
          current = Path('apps/api-go/model')
          legacy = Path(os.environ['RUNNER_TEMP']) / 'stock-go107-source/apps/api-go/model'
          text = (current / 'merchant_store_catalogue.go').read_text()
          helper = text.split('func merchantStoreCatalogueStockTag(', 1)[1].split('func PopulateMerchantStoreCatalogue(', 1)[0]
          target = legacy / 'merchant_store_catalogue.go'
          old = target.read_text()
          label = '\tp.DisplayTags = []string{}\n\tif p.SaleAvailable > 0 && !p.TradingPaused {\n\t\tp.DisplayTags = append(p.DisplayTags, "in_stock")\n\t} else {\n\t\tp.DisplayTags = append(p.DisplayTags, "out_of_stock")\n\t}'
          assert old.count(label) == 1
          old = old.replace(label, '\tp.DisplayTags = []string{merchantStoreCatalogueStockTag(p)}')
          old = old.replace('func PopulateMerchantStoreCatalogue(', 'func merchantStoreCatalogueStockTag(' + helper + 'func PopulateMerchantStoreCatalogue(', 1)
          target.write_text(old)
          for name in ['merchant_store_stock_status_test.go', 'merchant_store_stock_quota_cycle_test.go']:
              (legacy / name).write_bytes((current / name).read_bytes())
          PY
          git -C "$RUNNER_TEMP/stock-go107-source" rev-parse HEAD > "$RUNNER_TEMP/stock-go107/base-revision.txt"
          git -C "$RUNNER_TEMP/stock-go107-source" diff -- apps/api-go/model/merchant_store_catalogue.go > "$RUNNER_TEMP/stock-go107/display-only.patch"
      - name: Run Go107 hotfix regressions without schema changes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/stock-go107-source/apps/api-go"
          go test -race -p 2 ./model -run 'TestMerchantStore(CatalogueStock|CatalogueDistinguishes|StockQuota)' -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/stock-go107/tests.jsonl"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-go107-verified
          path: ${{ runner.temp }}/stock-go107
          if-no-files-found: error
          retention-days: 7
