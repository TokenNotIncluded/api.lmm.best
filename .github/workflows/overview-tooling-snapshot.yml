name: Overview local tooling snapshot

on:
  push:
    branches: [workbench/overview-tooling-20261009]
    paths: [.github/workflows/overview-tooling-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked workspace tools, without application tests or deployment
        run: bun install --frozen-lockfile
      - name: Prepare reproducible source and local tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overview-tooling"
          git rev-parse HEAD > "$RUNNER_TEMP/overview-tooling/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/overview-tooling/source.tar.gz" HEAD
          cp "$(command -v bun)" "$RUNNER_TEMP/overview-tooling/bun"
          tar -czf "$RUNNER_TEMP/overview-tooling/dependencies.tar.gz" node_modules apps/web/node_modules
          gzip "$RUNNER_TEMP/overview-tooling/bun"
          du -h "$RUNNER_TEMP/overview-tooling/"*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overview-local-tooling
          path: ${{ runner.temp }}/overview-tooling
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
