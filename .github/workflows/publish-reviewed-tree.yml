name: Publish hash-verified integration candidate

on:
  push:
    branches: [ci/source-snapshot-20260916-1322]
    paths: [.github/workflows/publish-reviewed-tree.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 4d49c2f405298286e65b7dfb0a06c90db55ba933
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble reviewed Git objects without executing repository code
        run: |
          git -c credential.helper= fetch https://github.com/TokenNotIncluded/api.lmm.best.git 749960b73b6ea6f2c7fecd6691203d85941e3436 1dd25eda5a634b5687e5b761721a8618bff7ef63 ec79542d92e3b4bd84c838f8cc794e610ed8ec2b 682c10fe4dafc370f03c976c4dca906588dbe13b
          python3 - <<'PY'
          import base64, subprocess
          patch = ''
          decoded = base64.b64decode(patch, validate=True)
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=decoded, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=decoded, check=True)
          expected = {
              '.github/CI_QUALITY.md': '4cf08437c8bbe9500a978a8b00ac8452fa19b089',
              '.github/workflows/ci.yml': '083cf50bd51a8c30b75e5b6307dcb79cf6ffa9aa',
              'apps/api-go/go.sum': '041a23a6ed0c25ecfd50c5bbba211b03f57ea40b',
              'apps/api-go/service/text_quota_missing_usage_test.go': '6185843c7424b58dc5710bbade3f9a9d25d32f55',
              'apps/web/src/components/brand-logo-recovery.test.tsx': '8f98acda1b5c411346c961c45e337b0d3aa87ccb',
              'apps/web/src/components/brand-logo.tsx': 'fa3c4160f87e553401a78aede6a1f4ee1ecd39ad',
              'apps/web/src/components/lmm-brand-mark.tsx': '9d1cbed812c580d3318d847643c0747c6581df30',
              'apps/web/src/features/assistant/assistant-activation-tool.test.tsx': 'fd63e238580c5516aa9eae7aebf89a8d94ec4bdc',
              'apps/web/src/features/assistant/assistant-activation-tool.tsx': '596bc93f2247a38376c3e7fce6524ca559b02d52',
              'apps/web/src/features/assistant/assistant-panel.test.tsx': 'c606ef3b8d554a019f22d7b1a0601fdec2b6b4b8',
              'apps/web/src/features/assistant/assistant-panel.tsx': 'a541a7fd3b5cacdf91b3d51c7f2478e50dfe9296',
              'apps/web/src/features/assistant/assistant-registration-status.tsx': 'f6836d41097fd60dae4b439607a44eef64803300',
              'apps/web/src/features/forge/forge-public-shell.tsx': '53593175bf5a30319fc4b68d417dc194c22898ca',
              'apps/web/src/features/home/VISUAL-REVIEW.md': '28f188f0d83a65fe8493b66cee88b375567abb31',
              'scripts/check-go-format.sh': 'affbdbd6941d9daf23cfb48b88ec770d7e36c1a6',
              'scripts/check-static-go-binary.sh': 'c434d3bfe601d2cf849eabd1cf611b8484601b98',
              'scripts/ci_quality_gate.py': '7de49cc4424e4fb52fa1fddd8ad2fce2a11e954d',
              'scripts/test_ci_quality_gate.py': 'c4dd1b5643416c838f11857a9ec3a8d83519da1c',
          }
          for path, sha in expected.items():
              kind = subprocess.check_output(['git', 'cat-file', '-t', sha], text=True).strip()
              if kind != 'blob':
                  raise SystemExit(f'Not a blob: {path}')
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', f'100644,{sha},{path}'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != 'ddce1af33d0c912232f24b892cce855b91bf6c0e':
              raise SystemExit(f'Refusing unreviewed tree: {tree}')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print(f'Exact reviewed tree: {tree}')
          PY
      - name: Publish an isolated candidate, never main or a PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=ci/reviewed-integration-20260916-1334
          test -z "$(git ls-remote origin "refs/heads/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          test "$tree" = ddce1af33d0c912232f24b892cce855b91bf6c0e
          commit=$(printf '%s\n' 'merge: reconcile main and current PR tips without retiring safety gates' '' 'Preserve main registration refresh, bounded agent execution, legacy-token rejection, and missing-usage completion guards. Include latest logo recovery, support checksums, and fail-closed CI shell tests. Exclude all temporary repair workflows from the candidate tree. Local checks: 12 homepage tests and 28 CI gate tests passed; complete current-head CI is still required.' | git commit-tree "$tree" -p 4d49c2f405298286e65b7dfb0a06c90db55ba933 -p 749960b73b6ea6f2c7fecd6691203d85941e3436 -p 1dd25eda5a634b5687e5b761721a8618bff7ef63 -p ec79542d92e3b4bd84c838f8cc794e610ed8ec2b -p 682c10fe4dafc370f03c976c4dca906588dbe13b)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push origin "$commit:refs/heads/$target"
          printf 'Candidate: `%s`\nTree: `%s`\n' "$commit" "$tree" >> "$GITHUB_STEP_SUMMARY"
