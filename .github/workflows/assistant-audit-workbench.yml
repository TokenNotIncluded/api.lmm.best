name: Assistant audit workbench

on:
  push:
    branches: [improve/assistant-token-efficiency]
    paths: [.github/workflows/assistant-audit-workbench.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-audit-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-audit-source
          path: ${{ runner.temp }}/assistant-audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
