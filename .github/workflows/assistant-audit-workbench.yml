name: Assistant audit workbench

on:
  push:
    branches: [improve/assistant-token-efficiency]
    paths: [.github/workflows/assistant-audit-workbench.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      CI: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Record baseline assistant checks
        id: baseline
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/assistant-results"
          cd apps/api-go
          go test -p 2 ./internal/agent ./setting ./controller -run 'Test(AssistantToolPolicy|AssistantAgentRepeated|LoopGuard|NormalizeCalls)' -count=1 2>&1 | tee "$RUNNER_TEMP/assistant-results/baseline.log"
      - name: Verify and apply isolated patch and reviewed fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'.assistant-audit-part-{i}').read_text().strip() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '50aa8a08e0ceeb62f7c0eb69eb8a689452f989cf3ec70786ed7fe3f161c38570'
          Path('/tmp/assistant-efficiency.patch').write_bytes(patch)
          PY
          git apply --check /tmp/assistant-efficiency.patch
          git apply /tmp/assistant-efficiency.patch
          python3 .assistant-audit-review.py
          git diff --check
          changed_go=$(git diff --name-only -- '*.go')
          if [ -n "$changed_go" ]; then test -z "$(gofmt -l $changed_go)"; fi
      - name: Go assistant regression tests
        id: go_tests
        continue-on-error: true
        run: |
          cd apps/api-go
          go test -p 2 ./internal/agent ./setting -count=1 2>&1 | tee "$RUNNER_TEMP/assistant-results/go-unit.log"
          go test -p 2 ./controller -run '^TestAssistant' -count=1 2>&1 | tee "$RUNNER_TEMP/assistant-results/go-tests.log"
      - name: Measure initial tool definition bytes
        id: measurement
        continue-on-error: true
        run: |
          cd apps/api-go
          go test -p 2 ./controller -run TestAssistantEfficiencyMeasuresDefinitionBytesForEachRole -count=1 -v 2>&1 | tee "$RUNNER_TEMP/assistant-results/measurement.log"
      - name: Go static checks
        id: vet
        continue-on-error: true
        run: |
          cd apps/api-go
          go vet ./internal/agent ./setting ./controller 2>&1 | tee "$RUNNER_TEMP/assistant-results/go-vet.log"
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend assistant regression tests
        id: web_tests
        continue-on-error: true
        run: |
          cd apps/web
          failed=0
          while IFS= read -r file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee -a "$RUNNER_TEMP/assistant-results/web-tests.log" || failed=1
          done < <(find ./src/features/assistant -name '*.test.ts' -o -name '*.test.tsx' | sort)
          exit "$failed"
      - name: Frontend types and changed-file lint
        id: web_checks
        continue-on-error: true
        run: |
          cd apps/web
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/assistant-results/web-typecheck.log"
          bun x --no-install oxlint -c .oxlintrc.json src/features/assistant/assistant-tool-calls.tsx src/features/assistant/assistant-tool-calls.test.ts 2>&1 | tee "$RUNNER_TEMP/assistant-results/web-lint.log"
      - name: Preserve inspectable test evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/assistant-results"
          git diff --binary > "$RUNNER_TEMP/assistant-results/tested.patch"
          git status --short > "$RUNNER_TEMP/assistant-results/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-verification
          path: ${{ runner.temp }}/assistant-results
          retention-days: 3
      - name: Require regression checks
        env:
          GO_TESTS: ${{ steps.go_tests.outcome }}
          MEASUREMENT: ${{ steps.measurement.outcome }}
          VET: ${{ steps.vet.outcome }}
          WEB_TESTS: ${{ steps.web_tests.outcome }}
          WEB_CHECKS: ${{ steps.web_checks.outcome }}
        run: |
          for result in "$GO_TESTS" "$MEASUREMENT" "$VET" "$WEB_TESTS" "$WEB_CHECKS"; do test "$result" = success; done
      - name: Publish tested source and remove temporary workbench
        run: |
          rm .assistant-audit-part-{1,2,3,4,5} .assistant-audit-review.py .github/workflows/assistant-audit-workbench.yml
          git add CHANGELOG.md apps/api-go/controller/assistant*.go apps/api-go/internal/agent/loop.go apps/api-go/internal/agent/efficiency_test.go apps/api-go/setting/assistant_tool_policy*.go apps/web/src/features/assistant/assistant-tool-calls.tsx apps/web/src/features/assistant/assistant-tool-calls.test.ts apps/web/src/i18n/locales/*.json docs/assistant-efficiency-audit.md docs/assistant-tool-policy.md
          git add -u -- .assistant-audit-part-1 .assistant-audit-part-2 .assistant-audit-part-3 .assistant-audit-part-4 .assistant-audit-part-5 .assistant-audit-review.py .github/workflows/assistant-audit-workbench.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(assistant): load tools on demand and allow early completion'
          git push origin HEAD:refs/heads/improve/assistant-token-efficiency
